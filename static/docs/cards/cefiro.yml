cards:
  - name: Sintonía Fluida
    level: 1
    type: efecto
    tags:
      - Céfiro
      - Arquetipo
      - Combatiente
    requirements: Reflejos 2
    description: >-
      _Eres como el viento entre las hojas: inalcanzable, veloz y capaz de golpear con precisión antes de desaparecer de la vista de tus rivales._<br><br>
      Obtienes Ventaja (+1d4) en Pruebas de Acrobacias y Supervivencia.<br><br>
      **Beneficio de Arquetipo:** Adquieres la carta _Maestría Marcial_ y usas Reflejos como tu Atributo Marcial. Tu Salud máxima aumenta en +5. Además, ignoras una cantidad de la penalización a la Esquiva de tu armadura igual a tu puntuación de Reflejos dividida por 3 (redondeando hacia abajo, mínimo 1), siempre que cumplas el requisito de atributo de la armadura. Adicionalmente, ganas un bono a tus Puntos de Salud igual a 6 PS por cada 10 PP que hayas gastado.<br><br>
    uses:
      type: null
      qty: 0
  - name: Foco del Escaramuzador
    level: 1
    type: activable
    tags:
      - Céfiro
    requirements: Sintonía Fluida
    description: >-
      _Entras en un estado de calma absoluta donde el tiempo parece ralentizarse, permitiéndote reaccionar a cada amenaza antes de que ocurra._<br><br>
      Como Interacción, entras en un estado de concentración absoluta durante 1 minuto o hasta que quedes inconsciente. Mientras dure este estado, tu velocidad de reacción te otorga un +1 a tu Esquiva y puedes desenvainar o guardar armas sin gastar tu Interacción.<br>
      Mientras dure el foco, no puedes mantener concentración en otras habilidades o usar cartas con la etiqueta _Conjuro_.
    uses:
      type: LONG_REST
      qty: 2
  - name: Precisión Letal
    level: 2
    type: activable
    tags:
      - Céfiro
    requirements: 'Sintonía Fluida & Reflejos 3'
    description: >-
      _Con paciencia y un pulso de acero, esperas el momento perfecto para que tu disparo o estocada ignore cualquier armadura._<br><br>
      Mientras tengas esta carta activa, si no has gastado nada de tu movimiento durante tu turno, puedes sacrificarlo para obtener un +1 a tus tiradas de ataque con armas Precisas, a distancia y arrojadizas hasta el final de tu turno.<br>
      Como Acción, puedes gastar un uso de esta carta para realizar un único ataque con una de estas armas. Si impacta, el golpe ignora toda la Mitigación Física del objetivo.
    uses:
      type: RELOAD
      qty: 4
  - name: Torbellino de Acero
    level: 3
    type: activable
    tags:
      - Céfiro
    requirements: 'Precisión Letal & Reflejos 4'
    description: >-
      _Te conviertes en un ciclón de filos que barre todo lo que te rodea, dejando un rastro de destrucción a tu paso._<br><br>
      Como Acción, desatas una ráfaga ineludible.<br>
      Si usas un arma a distancia, eliges un punto a distancia Larga. Si usas un arma cuerpo a cuerpo Precisa, el punto eres tú mismo.<br>
      Todas las criaturas a 3 metros del punto elegido deben superar una TS de Reflejos (ND 5 + Reflejos) o recibir 2d6 de daño (del mismo tipo que tu arma).
    uses:
      type: RELOAD
      qty: 5
  - name: Memoria Muscular
    level: 4
    type: efecto
    tags:
      - Céfiro
    requirements: 'Sintonía Fluida & Reflejos 5'
    description: >-
      _Tu cuerpo reacciona antes que tu mente; cada golpe que recibes te enseña cómo evitar el siguiente con una fluidez instintiva._<br><br>
      Obtienes Ventaja (+1d4) en todas tus Tiradas de Salvación de Reflejos.<br>
      Además, cada vez que un enemigo te impacta con un ataque, obtienes un +1 acumulativo a tu Esquiva exclusivamente contra los próximos ataques de ese mismo enemigo.<br>
      Este bonificador se mantiene hasta el inicio de tu próximo turno.
    uses:
      type: null
      qty: 0
  - name: 'Tempestad Incesante'
    level: 5
    type: activable
    tags:
      - Céfiro
    requirements: 'Maestría Marcial & Reflejos 6'
    description: >-
      _Eres una ráfaga imparable que golpea múltiples objetivos en un parpadeo, moviéndote por el campo de batalla como un rayo._<br><br>
      Como Acción, eliges hasta un número de enemigos igual a tu puntuación de Reflejos que puedas ver a distancia Larga. Realizas un único ataque (usando un arma Precisa o a distancia) contra cada uno de ellos.<br>
      Este asalto es tan rápido que parece que te teletransportas.<br>
      Inmediatamente después de resolver todos los ataques, puedes elegir aparecer en un espacio desocupado a distancia Inmediata de cualquiera de los objetivos atacados, o bien regresar a la posición desde donde iniciaste la habilidad.
    uses:
      type: LONG_REST
      qty: 1
