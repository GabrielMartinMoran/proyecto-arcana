cards:
  - name: Herencia Sobrenatural
    level: 1
    type: efecto
    tags:
      - Hechicero
      - Arquetipo
      - Arcanista
    requirements: Presencia 2
    description: >-
      _La magia no es algo que aprendiste; es algo que eres. Un fuego antiguo o un linaje cósmico late en tus venas, esperando ser liberado por tu voluntad._<br><br>
      Obtienes Ventaja (+1d4) en pruebas de **Persuasión** e **Intimidación**.<br>
      Adquieres la carta _Afinidad Arcana_, y puedes usar Presencia como tu Atributo Arcano para las cartas de _Arcanista_.<br>
      <br>
      **Beneficio de Arquetipo:** <br>
      - **Uno con la Magia:** Mientras este sea tu Beneficio de Arquetipo activo, añades la carta _Sangre Mágica_ a tu colección.<br>
      Adicionalmente, tu Salud máxima aumenta en +3, aprendes un idioma (asociado con tu fuente de magia) y ganas un bono a tus Puntos de Salud igual a 5 PS por cada 10 PP que hayas gastado.<br><br>
    uses:
      type: null
      qty: 0
  - name: Sangre Mágica
    level: 1
    type: efecto
    tags:
      - Hechicero
    requirements: Herencia Sobrenatural
    description: >-
      _Utilizas tu propia vitalidad como combustible, sacrificando tu cuerpo para potenciar tu inestable poder arcano._<br><br>
      Una vez por ronda, puedes sacrificar vitalidad (daño directo no mitigable) para alterar tus conjuros de _Arcanista_ o de _Hechicero_:<br>
      - **Sacrificio:** Cuando fallas una Recarga, puedes pagar **3 PS por cada punto** que quieras sumar al resultado.<br>
      - **Potencia:** Al tirar daño, puedes pagar **2 PS por nivel del conjuro** para volver a tirar un número de dados igual a tu **Presencia**.<br>
      - **Celeridad:** Puedes lanzar un conjuro de Nivel 1 o 2 usando tu **Interacción**. El coste es 3 + nivel del conjuro de daño.<br>
    uses:
      type: null
      qty: 0
  - name: 'Ráfaga Inestable'
    level: 1
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: 'Herencia Sobrenatural'
    description: >-
      _Disparas un proyectil de energía pura que, al impactar, puede desbordarse en una cascada de destrucción impredecible._<br><br>
      Realizas un ataque de conjuro (1d8e + Atributo Arcano) a distancia Cercana contra un objetivo. Si impactas, infliges 1d6 de daño de Fuerza.<br>
      - **Cascada Menor:** Si el dado de daño resulta en un 6 natural, la energía se desborda: tiras 1d6 adicional y lo sumas al daño total. Este dado también puede explotar si saca un 6.
    uses:
      type: RELOAD
      qty: 3

  - name: 'Escudo Residual'
    level: 2
    type: efecto
    tags:
      - Hechicero
    requirements: 'Herencia Sobrenatural & Presencia 2'
    description: >-
      _Tu cuerpo instintivamente convierte el dolor de tu sacrificio arcano en una barrera protectora efímera._<br><br>
      Inmediatamente después de sacrificar Puntos de Salud usando tu carta _Sangre Mágica_, ganas una cantidad de Puntos de Salud temporales igual a la mitad de los PS sacrificados (redondeado hacia arriba). Estos puntos temporales duran hasta el inicio de tu próximo turno.
    uses:
      type: null
      qty: 0
  - name: 'Anomalía Salvaje'
    level: 3
    type: efecto
    tags:
      - Hechicero
    requirements: 'Herencia Sobrenatural & Presencia 4'
    description: >-
      _Al forzar tu poder, la magia errática desestabiliza la realidad a tu alrededor, creando efectos aleatorios._<br><br>
      Inmediatamente después de sacrificar Puntos de Salud usando tu carta _Sangre Mágica_, tira 1d4 para determinar qué efecto secundario se manifiesta:<br>
      - **Parpadeo:** Te teletransportas hasta 3 metros a un espacio desocupado que puedas ver.<br>
      - **Distorsión:** El próximo ataque que recibas antes del inicio de tu próximo turno se realiza con Desventaja (-1d4).<br>
      - **Claridad:** Tu próxima tirada de ataque de conjuro antes del final de tu próximo turno obtiene Ventaja (+1d4).<br>
      - **Ruptura Defensiva:** Eliges a una criatura a distancia Media que puedas ver. Esta sufre Desventaja (-1d4) en la próxima Tirada de Salvación que realice contra uno de tus conjuros antes del final de tu próximo turno.
    uses:
      type: null
      qty: 0
  - name: 'Absorción Inestable'
    level: 3
    type: activable
    tags:
      - Hechicero
      - Reacción
    requirements: 'Herencia Sobrenatural & Presencia 4'
    description: >-
      _En lugar de rehuir del daño mágico, obligas a tu cuerpo a absorber esa energía para alimentar tus próximos conjuros._<br><br>
      Como Reacción, cuando recibes daño de un _Conjuro_ o efecto mágico, obligas a tu cuerpo a absorber esa energía para alimentar tu propio poder. Reduces el daño recibido a la mitad.<br>
      Además, el remanente de esa magia queda latente en tu interior: la próxima vez que lances una carta de _Conjuro_ antes del final de tu próximo turno, puedes aplicar una de las opciones de tu carta _Sangre Mágica_ sin tener que sacrificar Puntos de Salud.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Esfera de Caos'
    level: 3
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: 'Herencia Sobrenatural & Atributo Arcano 4'
    description: >-
      _Lanzas un orbe de magia cruda que detona violentamente, alterando la gravedad y la masa en su centro de impacto._<br><br>
      Elije punto a distancia Media, donde provocas una detonación en una esfera de 3 metros de radio. Todas las criaturas en el área deben superar una TS de Reflejos (ND 5 + Atributo Arcano). El daño de la detonación es de 4d6 de daño de Fuerza.<br>
      - **Cascada Inestable:** Por cada dado de daño que resulte en un "6" natural, la magia se desborda y tiras 1d6 adicional para sumarlo al daño total. Estos dados adicionales también generan más dados si sacan un 6.<br>
      - **Anomalía Gravitacional:** Observa el número total final del daño. Las criaturas que fallaron su Tirada de Salvación sufren uno de los siguientes efectos adicionales:<br>
      &nbsp;&nbsp;&nbsp;&nbsp; - _Si el daño total es PAR (Implosión):_ Son arrastradas violentamente 2 metros hacia el centro de la esfera y su Velocidad se reduce a la mitad hasta el final de tu próximo turno.<br>
      &nbsp;&nbsp;&nbsp;&nbsp; - _Si el daño total es IMPAR (Onda Cinética):_ Son empujadas 2 metros en dirección opuesta al centro de la esfera y caen Derribadas.<br> Si una criatura tiene éxito en la salvación, recibe la mitad del daño total acumulado y no sufre la anomalía gravitacional.
    uses:
      type: RELOAD
      qty: 6
  - name: 'Apoteosis Arcana'
    level: 4
    type: activable
    tags:
      - Hechicero
    requirements: 'Herencia Sobrenatural & Presencia 5'
    description: >-
      _Dejas que la magia pura de tu linaje te consuma por completo, convirtiéndote en un faro de poder letal._<br><br>
      Como Acción, entras en un estado de poder arcano que dura 1 minuto.<br>
      Mientras estes en este estado, ganas una velocidad de vuelo igual a tu Velocidad normal, emites luz brillante a 3 metros, y el costo en Puntos de Salud de todas las opciones de tu carta _Sangre Mágica_ se reduce a la mitad (redondeado hacia arriba, hasta un mínimo de 1 PS).
    uses:
      type: LONG_REST
      qty: 1
  - name: 'Torrente de la Urdimbre'
    level: 5
    type: activable
    tags:
      - Hechicero
      - Reacción
    requirements: 'Herencia Sobrenatural & Presencia 6'
    description: >-
      _Te niegas a caer, anclando tu alma a la Urdimbre para desatar una onda de choque devastadora como tu último aliento._<br><br>
      Una vez por día de descanso, cuando tus Puntos de Salud se reducen a 0, puedes usar tu Reacción para negarte a caer, anclando tu alma a la Urdimbre. Quedas con 1 Punto de Salud y tu cuerpo desata una onda de choque inestable de magia pura.<br>
      liges hasta un número de criaturas hostiles a distancia Cercana igual a tu puntuación de Presencia. Cada objetivo debe superar una TS de Reflejos (ND 5 + Presencia) o recibir 5d8 de daño de Fuerza y ser empujado 3 metros lejos de ti. Si tiene éxito, recibe la mitad del daño y no es empujado.<br>
      Además, la pura adrenalina mágica te permite recuperar instantáneamente el uso de una carta de Arcanista que tuvieras agotada.
    uses:
      type: LONG_REST
      qty: 1
