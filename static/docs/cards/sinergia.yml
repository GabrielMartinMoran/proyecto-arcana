cards:
  # ------- CARTAS DE SINERGIA ------
  # ------------------------------ 1. Combatiente + Pícaro ------------------------------
  - name: Maestro de la Danza Letal
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Pícaro
    requirements: 'Maestría Marcial & Senda del Bribón & Reflejos 5'
    description: >-
      _Has perfeccionado la fusión de la agilidad letal y la precisión marcial, donde cada paso es un golpe mortal._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Fusión Marcial:** Tu letalidad se integra en tu cadencia de combate. Cuando usas la acción de Atacar y te beneficias de la carta _Ataque Adicional_ o _Torrente de Acero_, puedes reemplazar uno de los ataques de esa acción por tu _Ataque Furtivo_ (siempre que cumplas las condiciones para el daño furtivo).<br>
      - **Réplica Precisa:** Cuando usas una Reacción defensiva del Pícaro (_Riposta_ o _Parada del Duelista_), obtienes Ventaja (+1d4) en tu próxima tirada de ataque contra el enemigo que activó tu reacción, antes del final de tu próximo turno.
    uses:
      type: null
      qty: 0

  # ------------------------------ 2. Combatiente + Sacerdote ------------------------------
  - name: Campeón Consagrado
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Sacerdote
    requirements: 'Maestría Marcial & Fe Inspiradora & Instinto 5'
    description: >-
      _Eres el faro de esperanza en el campo de batalla, un guerrero cuya fe es tan afilada como su acero._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Presencia Protectora:** Obtienes Ventaja (+1d4) en Tiradas de Salvación contra efectos de miedo y encantamiento. Los aliados a 3 metros de ti también se benefician.<br>
      - **Toque de Combate:** Puedes lanzar Toque Restaurador usando tu Interacción en lugar de tu Acción.<br>
      - **Castigo Imponente:** Cuando activas tu carta Golpe Divino, puedes elegir golpear el espíritu del enemigo en lugar de sus sentidos. Si lo haces, el objetivo debe superar una TS de Instinto (en lugar de Cuerpo). Si falla, queda Asustado hasta el final de tu próximo turno (en lugar de Cegado).
    uses:
      type: null
      qty: 0

  # ------------------------------ 3. Combatiente + Monje ------------------------------
  - name: Voluntad Indomable
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Monje
    requirements: 'Maestría Marcial & Disciplina Monástica & Instinto 5'
    description: >-
      _Tu disciplina marcial y tu fortaleza interior se fusionan en un estilo que ni el tiempo ni la fatiga pueden doblegar._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Defensa Mental y Física:** Como Reacción, cuando te ves obligado a realizar una Tirada de Salvación para resistir ser Aturdido, Encantado o Inmovilizado, puedes otorgarte Ventaja (+1d4) en esa tirada.<br>
      - **Mente de Acero:** Cuando fallas una Tirada de Salvación de Cuerpo o Instinto, puedes usar tu Reacción para volver a tirar el dado. Debes usar el nuevo resultado. Puedes usar esta habilidad una cantidad de veces igual a la mitad de tu Instinto (redondeado hacia abajo) por día de descanso.
    uses:
      type: null
      qty: 0

  # ------------------------------ 4. Combatiente + Arcanista ------------------------------
  - name: Maestría de la Hoja Arcana
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Arcanista
    requirements: 'Maestría Marcial & Afinidad Arcana & Cuerpo 5'
    description: >-
      _El acero de tu arma y la magia de los elementos se vuelven uno solo en tus manos letales._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Acero Elemental:** Al finalizar un día de descanso, eliges un tipo de daño elemental (Fuego, Frío o Eléctrico). Tus ataques con armas cuerpo a cuerpo infligen 1d4 de daño adicional de ese tipo hasta tu próximo descanso.<br>
      - **Desviar Energía:** Cuando recibes daño de Fuego, Frío o Eléctrico de un conjuro o efecto mágico, puedes usar tu Reacción. Ganas Resistencia (mitad de daño) contra ese daño específico. Además, tu próximo impacto con un arma cuerpo a melee antes del final de tu próximo turno inflige 1d4 de daño adicional del tipo absorbido. (Usos: 1 por Recarga 6+)
    uses:
      type: null
      qty: 0

  # ------------------------------ 5. Combatiente + Druida ------------------------------
  - name: Señor del Yermo Indomable
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Druida
    requirements: 'Maestría Marcial & Sintonía Primordial & Instinto 5'
    description: >-
      _Tu conexión con la naturaleza salvaje fortalece tu espíritu guerrero, convirtiéndote en el guardián de los bosques._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Piel de Corteza:** Mientras no lleves armadura pesada, obtienes un +1 a tu Mitigación Física y Mágica.<br>
      - **Golpe Enredante:** Una vez por turno, cuando impactas a un enemigo con un ataque con arma (cuerpo a cuerpo o a distancia), puedes hacer que broten espinas en el impacto. El objetivo queda Enredado hasta el inicio de tu próximo turno. Mientras esté enredado, sufre 1d4 de daño Perforante por cada 2 metros que se mueva.
    uses:
      type: null
      qty: 0

  # ------------------------------ 6. Combatiente + Bardo ------------------------------
  - name: Aura de Héroe
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Combatiente
      - Bardo
    requirements: 'Maestría Marcial & Don del Elocuente & Presencia 5'
    description: >-
      _Tu presencia inspira hazañas legendarias; lideras con el ejemplo y tus palabras resuenan como trompetas de victoria._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Presencia Inspiradora Mejorada:** El bonificador a las Tiradas de Salvación contra miedo otorgado por tu Presencia Inspiradora aumenta a +1d4.<br>
      - **Grito de Guerra Definitivo:** Cuando usas Grito de Guerra, los dados de Puntos de Salud temporales se maximizan (cada d4 cuenta como 4) y los aliados afectados obtienen Ventaja (+1d4) en su próxima tirada de ataque antes del final de su próximo turno.
    uses:
      type: null
      qty: 0

  # ------------------------------ 7. Pícaro + Sacerdote ------------------------------
  - name: Juicio Ineludible
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Pícaro
      - Sacerdote
    requirements: 'Senda del Bribón & Fe Inspiradora & Instinto 5'
    description: >-
      _Combinas el sigilo con la fe para purgar la oscuridad, acechando a los impíos desde las sombras consagradas._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Marca del Purgador:** Como Interacción, puedes marcar a una criatura impía (Infernal o No-muerta) durante 1 minuto (Concentración). Tus ataques con arma contra ella se benefician de Ataque Furtivo (sin condiciones).<br>
      - **Toque Purificador Sigiloso:** Puedes usar Toque Purificador (si lo tienes) usando tu Interacción en lugar de tu Acción.
    uses:
      type: null
      qty: 0

  # ------------------------------ 8. Pícaro + Monje ------------------------------
  - name: Camino del Viento Fantasma
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Pícaro
      - Monje
    requirements: 'Senda del Bribón & Disciplina Monástica & Reflejos 5'
    description: >-
      _Tu agilidad trasciende lo físico, fusionando el sigilo del pícaro con el control del Ki para volverte inalcanzable._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Acción Astuta Etérea:** Cuando usas Acción Astuta, puedes elegir teletransportarte hasta 3 metros a un espacio desocupado que puedas ver, en lugar de Correr o Esconderte.<br>
      - **Golpe desde el Vacío:** Inmediatamente después de usar Acción Astuta Etérea para teletransportarte, tu próxima tirada de ataque antes del final de tu turno obtiene Ventaja (+1d4).
    uses:
      type: null
      qty: 0

  # ------------------------------ 9. Pícaro + Arcanista ------------------------------
  - name: Maestría del Engaño Arcano
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Pícaro
      - Arcanista
    requirements: 'Senda del Bribón & Afinidad Arcana & Reflejos 5'
    description: >-
      _Entrelazas la perfección de la magia ilusoria con tu indudable destreza criminal._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Mano de Ladrón Experta:** Puedes realizar pruebas de Juego de Manos a través de tu Mano de Mago con Ventaja (+1d4), como si fueran tus propias manos.<br>
      - **Invisibilidad Ininterrumpida:** Cuando lanzas Invisibilidad sobre ti mismo, el conjuro ya no termina si atacas o lanzas otro conjuro. (Todavía requiere Concentración).
    uses:
      type: null
      qty: 0

  # ------------------------------ 10. Pícaro + Druida ------------------------------
  - name: Uno con la Naturaleza Salvaje
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Pícaro
      - Druida
    requirements: 'Senda del Bribón & Sintonía Primordial & Instinto 5'
    description: >-
      _Te fundes con el entorno, combinando el sigilo del depredador con el instinto natural para atacar sin ser visto._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Camuflaje Perfecto:** Mientras estés en terreno natural y no te muevas en tu turno, eres invisible para las criaturas que estén a más de 5 metros de ti.<br>
      - **Forma Furtiva:** Puedes aplicar tu Ataque Furtivo mientras estás en Forma Salvaje, siempre que cumplas las condiciones normales para hacerlo.
    uses:
      type: null
      qty: 0

  # ------------------------------ 11. Pícaro + Bardo ------------------------------
  - name: Golpe de Gracia Engañoso
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Pícaro
      - Bardo
    requirements: 'Senda del Bribón & Don del Elocuente & Presencia 5'
    description: >-
      _Tu letalidad se oculta tras una sonrisa encantadora, aprovechando la fascinación de tu público para dar el golpe final._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Filo Hipnótico:** Una vez por turno, al impactar con un arma, gasta un dado de Canto de Inspiración. Añade el resultado como daño Psíquico y fuerza TS Instinto (ND 5 + Presencia) vs Encantado (1 turno).<br>
      - **Explotar Confianza:** Puedes aplicar tu Ataque Furtivo contra criaturas Encantadas por ti, incluso si no cumples las condiciones normales.
    uses:
      type: null
      qty: 0

  # ------------------------------ 12. Monje + Arcanista ------------------------------
  - name: Voluntad Trascendente
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Monje
      - Arcanista
    requirements: 'Disciplina Monástica & Afinidad Arcana & Instinto 5'
    description: >-
      _Tu Ki y la Urdimbre arcana fluyen en perfecta armonía, transformando tus golpes en pura energía._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Golpes de Fuerza Pura:** Tus ataques desarmados se consideran mágicos y puedes elegir que su daño sea de Fuerza.<br>
      - **Fluir Arcano-Marcial:** Cuando usas Ráfaga de Golpes o Tormenta de Golpes, puedes reemplazar uno de los ataques desarmados adicionales para lanzar un conjuro de Arcanista de Nivel 1 que tengas activo y que requiera una Acción.
    uses:
      type: null
      qty: 0

  # ------------------------------ 13. Monje + Druida ------------------------------
  - name: Furia Silvana
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Monje
      - Druida
    requirements: 'Disciplina Monástica & Sintonía Primordial & Instinto 5'
    description: >-
      _Encarnas la furia indomable de la naturaleza, llevando la disciplina de tus golpes a las formas más salvajes del mundo._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Movimiento Primordial:** Puedes usar Paso Ligero y Paso Etéreo (si los tienes) incluso mientras estás en Forma Salvaje.<br>
      - **Ráfaga Salvaje:** Mientras estás en tu forma de combate de Aspecto Combativo o Maestría Salvaje, puedes usar las cartas Ráfaga de Golpes y Tormenta de Golpes (si las tienes).
    uses:
      type: null
      qty: 0

  # ------------------------------ 14. Arcanista + Sacerdote ------------------------------
  - name: Versatilidad Teúrgica
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Arcanista
      - Sacerdote
    requirements: 'Afinidad Arcana & Fe Inspiradora & Instinto 5'
    description: >-
      _Dominas tanto la rígida y calculadora lógica arcana como la fe divina más pura e inspiradora._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Doble Senda Mágica:** Cuando lanzas un conjuro de Arcanista o Sacerdote, puedes elegir usar tu Atributo Arcano o tu Instinto como tu atributo de lanzamiento.<br>
      - **Capacidad Expandida:** Ganas una Ranura de Carta Activa adicional que sirve para activar cualquier carta con las etiquetas _Conjuro_ y _Arcanista_ o _Sacerdote_.
    uses:
      type: null
      qty: 0

  # ------------------------------ 15. Arcanista + Druida ------------------------------
  - name: Maestría Elemental Compartida
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Arcanista
      - Druida
    requirements: 'Afinidad Arcana & Sintonía Primordial & Instinto 5'
    description: >-
      _Comandas tanto los elementos destructivos arcanos como la energía primordial pura de la naturaleza salvaje._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Control Preciso:** Cuando lanzas un conjuro con área de efecto del Druida, puedes elegir un número de criaturas igual a tu Atributo Arcano dentro del área para que no se vean afectadas.<br>
      - **Potencia Elemental:** Una vez por turno, cuando infliges daño de Fuego, Frío o Eléctrico con un conjuro de Arcanista o Druida, puedes añadir tu puntuación de Atributo Arcano o Instinto (la que sea más alta) a una de las tiradas de daño.
    uses:
      type: null
      qty: 0

  # ------------------------------ 16. Monje + Sacerdote ------------------------------
  - name: Mano Purgadora
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Monje
      - Sacerdote
    requirements: 'Disciplina Monástica & Fe Inspiradora & Instinto 5'
    description: >-
      _Tu Ki se purifica con fe, convirtiendo tus manos en instrumentos de juicio divino y sanación milagrosa._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Golpes Selladores:** Tus ataques desarmados son mágicos y pueden ser Radiantes. Si infligen daño Radiante, el objetivo no recupera PH 1 turno.<br>
      - **Oleada de Vida:** Cuando usas Ráfaga de Golpes o Tormenta de Golpes, puedes renunciar a uno de los ataques adicionales para lanzar Toque Restaurador (si lo tienes) sobre ti mismo o un aliado adyacente, sin gastar su uso de recarga.
    uses:
      type: null
      qty: 0

  # ------------------------------ 17. Sacerdote + Druida ------------------------------
  - name: Bendición de Ciclo Vital
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Sacerdote
      - Druida
    requirements: 'Fe Inspiradora & Sintonía Primordial & Instinto 5'
    description: >-
      _Canalizas la energía divina a través del ciclo natural de la vida y la muerte, donde cada final sagrado da paso a un nuevo renacer._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Regeneración Persistente:** Cuando restauras Puntos de Salud a una criatura con un conjuro instantáneo, esa criatura también recupera 1d4 PS al inicio de su próximo turno.<br>
      - **Refugio Sanador:** Tus conjuros de zona protegen la vida. Al inicio de cada uno de sus turnos, cualquier aliado que se encuentre dentro del área de tu Santuario o Santuario Silencioso gana Puntos de Salud Temporales igual a tu puntuación de Instinto.
    uses:
      type: null
      qty: 0

  # ------------------------------ 18. Sacerdote + Bardo ------------------------------
  - name: Palabras Divinas
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Sacerdote
      - Bardo
    requirements: 'Fe Inspiradora & Don del Elocuente & Presencia 5'
    description: >-
      _Tu voz es un conducto de inspiración divina y curación, entonando plegarias que resuenan en los corazones como verdaderos cánticos celestiales._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Inspiración Sanadora:** Cuando usas Canto de Inspiración en un aliado, este también recupera 1d4 Puntos de Salud.<br>
      - **Mandato Convincente:** Tu Palabra de Autoridad ahora puede dar órdenes ligeramente más complejas (una frase corta). Además, las criaturas normalmente inmunes al estado Encantado pueden ser afectadas, pero realizan su Tirada de Salvación con Ventaja (+1d4).
    uses:
      type: null
      qty: 0

  # ------------------------------ 19. Druida + Bardo ------------------------------
  - name: Forma del Cuentacuentos
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Druida
      - Bardo
    requirements: 'Sintonía Primordial & Don del Elocuente & Presencia 5'
    description: >-
      _Tu arte trasciende las formas, permitiéndote encantar incluso en tu aspecto salvaje, demostrando que la música del mundo resuena en todas las bestias._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Forma Salvaje Parlante:** Mientras estás en Forma Salvaje (combatiente o no), conservas la capacidad de hablar y puedes intentar usar habilidades de Presencia.<br>
      - **Actuación Primordial:** Mientras estás en Forma Salvaje, usa Acción para forzar TS Instinto (ND 5 + Presencia) a enemigos Cercanos o quedan Encantados 1 min (se rompe si actúas hostilmente).
    uses:
      type: null
      qty: 0

  # ------------------------------ 20. Arcanista + Bardo ------------------------------
  - name: Virtuosismo Arcano
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Arcanista
      - Bardo
    requirements: 'Afinidad Arcana & Don del Elocuente & Presencia 5'
    description: >-
      _Tus palabras son poder puro, desentrañando secretos mágicos y tejiendo maldiciones como si fueran simples canciones._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Secretos Arcanos Ampliados:** Tu carta _Secretos Mágicos_ (si la tienes) se vuelve mucho más poderosa.
      Ahora te permite elegir conjuros de hasta **Nivel 4**, con un presupuesto total de 4 niveles,
      siempre que los conjuros elegidos sean de la lista del **Arcanista**.<br>
      - **Marca de la Condena:** Añades la carta _Maledicción_ a tu colección.
      Para ti, esta carta no requiere Concentración y puedes lanzarla usando tu atributo de **Presencia**.
    uses:
      type: null
      qty: 0

  # ------------------------------ 21. Monje + Bardo ------------------------------
  - name: Danza del Ki Hipnótico
    level: 4
    type: efecto
    tags:
      - Sinergia
      - Monje
      - Bardo
    requirements: 'Disciplina Monástica & Don del Elocuente & Presencia 5'
    description: >-
      _Tu movimiento es una performance letal y tu Ki una melodía cautivadora que fascina a quienes intentan golpearte._<br><br>
      **Beneficio de Sinergia:**<br>
      - **Movimiento Fascinante:** Cuando un enemigo te falla c/c, usa Reacción para forzar TS Instinto (ND 5 + Presencia) vs Encantado (1 min, se rompe si hostil).<br>
      - **Ki Resonante:** Una vez por turno, puedes gastar un uso de tu Canto de Inspiración (sin necesidad de activarlo en un objetivo) para imbuir tus golpes. Si lo haces, todos tus ataques desarmados infligen 1d4 de daño Psíquico adicional hasta el inicio de tu próximo turno.
    uses:
      type: null
      qty: 0
