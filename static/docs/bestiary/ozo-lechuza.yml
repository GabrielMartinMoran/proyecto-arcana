        detail: Si el ozo-lechuza impacta a un objetivo con sus dos ataques de Garras en el mismo turno, puede usar su Interacción para iniciar una Tirada Enfrentada de su Cuerpo contra el Cuerpo del objetivo. Si gana, el objetivo queda Inmovilizado y recibe 1d6 de daño Contundente (3.5 prom) al inicio de cada uno de sus turnos mientras la presa se mantenga (el ozo-lechuza no necesita usar acciones para mantenerla). Una criatura Inmovilizada de esta forma puede usar su Acción para repetir la Tirada Enfrentada de su Cuerpo contra el Cuerpo del ozo-lechuza. Si tiene éxito, se libera.
    behavior: |
