        detail: El basilisco fija su mirada en una criatura a distancia Cercana que pueda verlo. El objetivo debe superar una Tirada de Salvación de Cuerpo (ND 13). Si falla por 4 puntos o menos, queda Inmovilizado (comienza a convertirse en piedra). Si falla por 5 puntos o más, queda Petrificado instantáneamente. Una criatura Inmovilizada por este efecto debe repetir la Tirada de Salvación al final de cada uno de sus turnos; si vuelve a fallar, queda Petrificada.
    reactions: []
    interactions: []
    behavior: |
      Una criatura lenta y territorial cuya principal arma es la pereza y el terror. No caza activamente; simplemente existe, y su Mirada Petrificadora es una defensa tan perfecta que rara vez necesita moverse. Fijará su mirada en el grupo, forzándolos a desviar la vista o arriesgarse a convertirse en piedra. Solo recurrirá a su mordisco si un enemigo es lo suficientemente valiente o estúpido como para entrar en su espacio personal.
