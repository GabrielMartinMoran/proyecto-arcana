      - name: Asalto Múltiple
        detail: El Thulu puede realizar dos ataques de Choque Psiónico con su Acción.
    actions:
      - name: Ráfaga Mental
        uses:
          type: RELOAD
          qty: 5
        detail: El Thulu emite una onda psíquica en un cono de 5 metros. Toda criatura en el rango debe superar una TS de Instinto (ND 14) o sufrir 4d8 de daño Psíquico y quedar Aturdida hasta el final del próximo turno del Thulu. Si tiene éxito, recibe la mitad del daño y no queda Aturdida.
      - name: Devorar Cerebro
        detail: Ataca a una criatura Inmovilizada por él. Impacto automático. El objetivo debe superar una TS de Mente (ND 14). Si falla, sufre 10d10 de daño Psíquico. Si esto reduce sus PS a 0, muere instantáneamente.
    reactions: []
