creatures:
  - name: Contemplador
    lineage: Aberración
    tier: 6

    attributes:
      body: 4
      reflexes: 5
      mind: 12
      instinct: 8
      presence: 6

    stats:
      maxHealth: 180
      evasion:
        value: 10
        note: null
      physicalMitigation:
        value: 2
        note: Campo de fuerza
      magicalMitigation:
        value: 1
        note: Campo psíquico
      speed:
        value: 6
        note: Levita

    languages:
      - Habla Profunda
      - Telepatía (Larga)

    attacks:
      - name: Mordida
        attack: 8
        damage: 4d8 Perforante
        note: El contemplador utiliza su Mordida cuando un enemigo se encuentra a distancia Inmediata.

    traits:
      - name: Habilidades con Ventaja
        detail: Conocimiento Arcano, Historia, Investigación, Percepción

      - name: Visión en la Oscuridad
        detail: El contemplador puede ver en penumbra como si fuera luz tenue y en oscuridad, incluso mágica, como si fuera penumbra hasta distancia Cercana.

      - name: Levitación
        detail: El contemplador vuela mediante levitación a una velocidad igual a su Velocidad y puede permanecer suspendido en el aire sin necesidad de apoyarse sobre una superficie.

    actions:
      - name: Rayo de Fascinación
        uses:
          type: RELOAD
          qty: 3
        detail: El primer ojo menor se abre con un brillo hipnótico. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Mente (ND 14). Si falla, queda Encantada respecto al contemplador hasta el inicio del siguiente turno del contemplador.

      - name: Rayo Vectorial
        uses:
          type: RELOAD
          qty: 4
        detail: El segundo ojo menor distorsiona violentamente el espacio. Una criatura u objeto visible de tamaño Grande o menor a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, el contemplador mueve el objetivo hasta 6 metros a un espacio visible. Si termina contra una superficie sólida o criatura, recibe 2d6 de daño Contundente.

      - name: Rayo de Lentitud
        uses:
          type: RELOAD
          qty: 4
        detail: El tercer ojo menor proyecta una luz viscosa que parece frenar el tiempo. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, su Movimiento se reduce a la mitad y no puede realizar Reacciones hasta el inicio del siguiente turno del contemplador.

      - name: Rayo de Pavor
        uses:
          type: RELOAD
          qty: 5
        detail: El cuarto ojo menor refleja los peores temores de su presa. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Instinto (ND 14). Si falla, queda Asustada hasta el inicio del siguiente turno del contemplador.

      - name: Rayo de Drenaje
        uses:
          type: RELOAD
          qty: 5
        detail: El quinto ojo menor absorbe el vigor vital en una corriente oscura. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, recibe 3d8 de daño Necrótico; con éxito, recibe la mitad.

      - name: Rayo de Anclaje
        uses:
          type: RELOAD
          qty: 6
        detail: El sexto ojo menor fija a la víctima en el espacio como si estuviera clavada al mundo. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, queda Inmovilizada hasta el inicio del siguiente turno del contemplador.

      - name: Rayo de Letargo
        uses:
          type: RELOAD
          qty: 6
        detail: El séptimo ojo menor emite un pulso opaco que apaga la consciencia. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Mente (ND 14). Si falla, queda Dormida hasta el inicio del siguiente turno del contemplador o hasta recibir daño.

      - name: Rayo de Calcificación
        uses:
          type: RELOAD
          qty: 8
        detail: El octavo ojo menor cubre a la presa con vetas pétreas que avanzan sobre su cuerpo. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, queda Inmovilizada y comienza a convertirse en piedra. Al final de su siguiente turno debe repetir la Tirada de Salvación. Si vuelve a fallar, queda Petrificada; si tiene éxito, termina el efecto.

      - name: Rayo de Disolución
        uses:
          type: RELOAD
          qty: 6
        detail: El noveno ojo menor dispara un haz blanco que deshace materia y magia por igual. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Reflejos (ND 14). Si falla, recibe 6d8 de daño de Fuerza; con éxito, recibe la mitad.

      - name: Rayo de Extinción
        uses:
          type: RELOAD
          qty: 8
        detail: El décimo ojo menor se contrae hasta volverse un punto negro antes de liberar un rayo mortal. Una criatura visible a distancia Media debe superar una Tirada de Salvación de Cuerpo (ND 14). Si falla, recibe 8d10 de daño Necrótico; con éxito, recibe la mitad. Si sus Puntos de Salud llegan a 0, queda Moribunda de forma normal.

    reactions:
      - name: Respuesta Ocular
        uses: null
        detail: Al final del turno de otra criatura, el contemplador puede usar su Reacción para utilizar Rayo de Fascinación, Rayo Vectorial, Rayo de Lentitud, Rayo de Pavor o Rayo de Drenaje, siempre que el rayo elegido esté disponible. Utilizarlo agota normalmente ese rayo.

    interactions:
      - name: Campo Antimágico
        uses: null
        detail: Como Interacción, el ojo central proyecta un cono de 10 metros hasta el inicio del siguiente turno del contemplador. Elige la orientación del cono al activarlo. Toda magia dentro del área queda suprimida, incluidos los propios rayos del contemplador si atraviesan o afectan un punto dentro del cono. El campo no disipa los efectos mágicos; simplemente dejan de funcionar mientras permanezcan dentro del área. El propio Campo Antimágico no se suprime a sí mismo.

      - name: Corte de Distancia
        uses:
          type: RELOAD
          qty: 5
        detail: Como Interacción, el ojo central parpadea y pliega momentáneamente el espacio alrededor del contemplador. El contemplador se teletransporta a un espacio desocupado que pueda ver a distancia Media.

    behavior: |
      Una aberración calculadora que contempla el campo de batalla desde el aire
      y utiliza cada uno de sus ojos para resolver un problema diferente.

      Mantiene el Campo Antimágico orientado hacia los principales lanzadores de
      conjuros, procurando dejar libres otros ángulos desde los que utilizar sus
      rayos. En su turno elige el rayo que mejor explote la situación: separa
      enemigos con Vector, neutraliza amenazas mediante control o utiliza sus
      rayos destructivos cuando necesita concentrar daño.

      Fuera de su turno utiliza Respuesta Ocular para mantener presión sobre el
      grupo. Cuando se utiliza como jefe con Reacciones adicionales, puede
      sacrificar alguna de esas oportunidades para reposicionarse mediante las
      Reacciones de Jefe generales.

    img: null
    size: Grande
