    reactions:
      - name: Paso Arbóreo
        uses:
          type: RELOAD
          qty: 5
        detail: Cuando un enemigo entra a distancia Inmediata, la Dríada puede moverse hasta la mitad de su velocidad por terreno natural sin provocar Reacciones.
