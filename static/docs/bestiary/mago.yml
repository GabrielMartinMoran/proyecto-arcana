        detail: El mago elige un punto a distancia Media. Todas las criaturas en un radio de 3 metros deben superar una TS de Reflejos (ND 12). Si fallan, reciben 3d6 de daño de Fuego. Si tienen éxito, reciben la mitad.
    reactions:
