          qty: 6
        detail: Como Reacción cuando ve a una criatura lanzar un conjuro a distancia Media, el mago realiza una Tirada Enfrentada de su Mente (+5) contra el atributo de lanzamiento del rival. Si gana, el conjuro falla y se disipa sin efecto.
    interactions:
      - name: Paso Brumoso
        uses:
          type: RELOAD
          qty: 4
        detail: El mago usa su Interacción para teletransportarse instantáneamente a un espacio desocupado que pueda ver a distancia Cercana.
    behavior: |
      Un intelectual táctico que controla el campo de batalla desde la retaguardia. Abre el combate con una Bola de Fuego para ablandar grupos, y luego elimina objetivos prioritarios con Virotes Arcanos. Nunca se queda quieto: usa Paso Brumoso para mantener la distancia y reserva su Reacción para Contraconjuro, intentando neutralizar la magia enemiga más peligrosa.
