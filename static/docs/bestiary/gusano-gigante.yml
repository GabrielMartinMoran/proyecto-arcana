      - name: Devorar al Intruso
        uses:
          type: RELOAD
          qty: 6
        detail: Una criatura a distancia Inmediata debe superar una Tirada de Salvación de Reflejos (ND 14). Si falla, queda dentro del gusano y este se mueve hasta su espacio. Solo puede contener una criatura. Al inicio de cada turno de la víctima, recibe 2d8 de daño Ácido sin salvación. Al final de cada turno, puede repetir una Tirada de Salvación de Cuerpo (ND 14); con éxito, sale a un espacio adyacente.
    reactions:
      - name: Sacudida de Cola
        detail: Cuando un enemigo termina su movimiento a distancia Inmediata, debe superar una Tirada de Salvación de Reflejos (ND 14) o recibir 2d6 de daño Contundente y quedar Derribado. Solo una vez por ronda.
    interactions: []
    behavior: |
      Un peligro de jefe que convierte el suelo en una amenaza. Desaparece bajo el terreno, divide al grupo con la amenaza de su mordida y emerge solo cuando puede aislar una presa.
