    actions: []
    reactions: []
    interactions:
      - name: Mirada Aterradora
        uses:
          type: RELOAD
          qty: 5
        detail: El espectro fija su mirada en un personaje a distancia Cercana. El objetivo debe superar una Tirada de Salvación de Instinto (ND 11) o quedar Asustado hasta el final del próximo turno del espectro. (ND vinculado al Ataque).
    behavior: |
      Una entidad de tormento y frío, consumida por el odio. Flota a través de obstáculos para aislar a la presa más vulnerable (a menudo la que tiene menor Instinto). Usa Mirada Aterradora para paralizar al más resuelto y luego se ceba en él, usando Toque Gélido para prolongar su macabra existencia.
    img: https://i.imgur.com/3LAtxZ4.png
