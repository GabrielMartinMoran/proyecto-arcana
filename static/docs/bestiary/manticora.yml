creatures:
  # Presupuesto PPF: S3(S90) + E3(Esq 10) + A4(+8) + D8(3d8+1 x3) + F1(MF 1) = 19
  # + Ataque de Oportunidad T1 (2 PPF) + Superioridad Aérea R1 (2 PPF) = 23/23
  - name: Mantícora
    lineage: Monstruosidad
    tier: 4
    attributes:
      body: 6
      reflexes: 6
      mind: 1
      instinct: 4
      presence: 3
    stats:
      maxHealth: 90
      evasion:
        value: 10
        note: null
      physicalMitigation:
        value: 1
        note: null
      magicalMitigation:
        value: 0
        note: null
      speed:
        value: 10
        note: Vuela
    languages:
      - Común (comprende)
    attacks:
      - name: Garras
        bonus: 8
        damage: 3d8+1 Cortante
        note: null
      - name: Mordisco
        bonus: 8
        damage: 3d8+1 Perforante
        note: null
    traits:
      - name: Habilidades con Ventaja
        detail: Percepción, Supervivencia, Intimidación
      - name: Asalto Múltiple (2 Garras, 1 Mordisco)
        detail: La mantícora puede realizar dos ataques de Garras y un ataque de Mordisco con su Acción.
      - name: Vuelo
        detail: La mantícora tiene una velocidad de Vuelo de 10 metros.
    actions:
      - name: Disparar Púas
        uses:
          type: RELOAD
          qty: 5
        detail: La mantícora dispara una andanada de púas de su cola. Realiza tres ataques a distancia (+8 para golpear) contra uno o varios objetivos a distancia Cercana. Cada púa que impacta inflige 3d6 de daño Perforante.
    reactions:
      - name: Ataque de Oportunidad
        detail: Como Reacción, cuando una criatura sale de estar a distancia Inmediata de la mantícora, esta puede realizar un único ataque de Garras contra él.
    interactions: []
    behavior: |
      Un depredador cruel que disfruta aterrorizando a su presa. Comienza el combate desde el aire, deleitándose en su invulnerabilidad mientras acribilla al grupo con las púas de su cola, a menudo enfocándose en el mismo objetivo para maximizar el dolor. Solo descenderá cuando un enemigo esté visiblemente herido o aislado, para saborear la muerte con sus garras y fauces.
    img: null
    size: Grande
