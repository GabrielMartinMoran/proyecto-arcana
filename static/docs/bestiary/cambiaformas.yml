creatures:
  - name: Cambiaformas
    lineage: Aberración
    tier: 2
    attributes:
      body: 2
      reflexes: 3
      mind: 1
      instinct: 5
      presence: 4
    stats:
      maxHealth: 35
      evasion:
        value: 9
        note: null
      physicalMitigation:
        value: 1
        note: Cuerpo modelable
      magicalMitigation:
        value: 0
        note: null
      speed:
        value: 9
        note: null
    languages:
      - Común
    attacks:
      - name: Tajo Metamorfo
        bonus: 5
        damage: 1d4+1 Cortante
        note: Una de sus extremidades toma la forma de una hoja afilada.
      - name: Puntada Metamorfa
        bonus: 5
        damage: 1d4+1 Perforante
        note: Una de sus extremidades toma la forma de una punta aguda.
      - name: Golpe Metamorfo
        bonus: 5
        damage: 1d4+1 Contundente
        note: Una de sus extremidades toma la forma de un mazo.
    traits:
      - name: Habilidades con Ventaja
        detail: Engaño, Perspicacia
      - name: Asalto Múltiple
        detail: El cambiaformas puede realizar dos ataques con su Acción.
      - name: Cuerpo Simulante
        detail: >-
          El cambiaformas puede adoptar la apariencia visual de una criatura de
          su tamaño que haya observado, incluyendo ropa, armadura, armas,
          herramientas y texturas. La copia no concede estadísticas,
          propiedades, peso, recuerdos, voz, habilidades ni efectos mágicos.
          Cualquier objeto que suelte es un fragmento inerte de su cuerpo: no
          puede usarse como equipo y puede reabsorberlo como Interacción si está
          a distancia Inmediata.
    actions: []
    reactions: []
    interactions:
      - name: Reabsorber Fragmento
        detail: Como Interacción, el cambiaformas reabsorbe un fragmento de su cuerpo que esté a distancia Inmediata. El fragmento no puede actuar ni generar efectos propios.
    behavior: |
      Un infiltrador aberrante que estudia a sus víctimas antes de adoptar su aspecto. Se mezcla con el grupo, deja que sus copias confundan la escena y ataca con extremidades convertidas en armas.
    img: null
    size: Mediano
