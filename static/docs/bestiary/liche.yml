    attacks:
      - name: Descarga Arcana
        bonus: 11
        damage: 4d8 Fuerza
        note: Alcance Media. Ataque de energía pura que no requiere recarga.
    traits:
      - name: Habilidades con Ventaja
        detail: Conocimiento Arcano, Historia, Investigación, Religión
      - name: Voluntad Antimagia
        detail: Ventaja (+1d4) en Tiradas de Salvación contra conjuros y efectos mágicos.
      - name: Inmunidades al Daño
        detail: Veneno, Frío
      - name: Inmunidades a Estados
        detail: Encantado, Envenenado, Dormido
      - name: Mente Dividida
        detail: La mente fragmentada del Liche le permite procesar múltiples amenazas. Tiene 3 Reacciones por ronda de combate en lugar de una.
      - name: Vuelo Arcano
        detail: El Liche levita permanentemente y tiene una velocidad de Vuelo igual a su velocidad terrestre.
      - name: Rejuvenecimiento
        detail: Si muere, reaparece junto a su filacteria en 1d6 días.
    actions:
      - name: Maestro de la Magia Prohibida
        detail: El Liche tiene acceso a la lista de conjuros de Arcanista. Puede lanzar conjuros de hasta Nivel 5 como Acción. Debe respetar los tiempos de recarga o usos limitados de cada conjuro individualmente.
    reactions:
      - name: Conjuro de Oportunidad
        detail: |
          Como Reacción al final del turno de otra criatura, el Liche elige una opción:
          - Realizar un ataque de Descarga Arcana.
          - Lanzar un conjuro de Arcanista de Nivel 3 o inferior (debe respetar la recarga).
      - name: Recarga Mental
        detail: Como Reacción al final del turno de cualquier criatura, el Liche realiza una tirada de recarga (1d8) para intentar recuperar el uso de una habilidad o conjuro agotado.
    interactions: []
    behavior: Un archimago no-muerto con un estilo muy táctico. Su estrategia se basa en la economía de acción superior. Flota fuera de alcance, bombardeando con magia de Nivel 5 en su turno. Entre turnos enemigos, usa sus reacciones para mantener la presión constante lanzando Descargas Arcanas, hechizos rápidos o intentando recuperar sus poderes más letales con Recarga Mental. Su objetivo no es solo ganar, es demostrar su abrumadora superioridad intelectual y mágica en cada instante del combate.
    img: null
    size: Mediano
