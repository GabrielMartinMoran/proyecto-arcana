creatures:
  - name: Liche
    lineage: No-muerto
    tier: 6
    attributes:
      body: 3
      reflexes: 5
      mind: 12
      instinct: 8
      presence: 7
    stats:
      maxHealth: 195
      evasion:
        value: 10
        note: null
      physicalMitigation:
        value: 0
        note: null
      magicalMitigation:
        value: 0
        note: null
      speed:
        value: 9
        note: Levita
    languages:
      - Común
      - Dracónico
      - Abisal
      - Umbral
      - Arcaico
    attacks:
      - name: Descarga Arcana
        bonus: 11
        damage: 3d8 Fuerza
        note: Alcance Media. Ataque de energía arcana pura que no posee Recarga ni usos limitados.
    traits:
      - name: Habilidades con Ventaja
        detail: Conocimiento Arcano, Historia, Investigación, Perspicacia
      - name: Voluntad Antimagia
        detail: Ventaja (+1d4) en Tiradas de Salvación contra conjuros y efectos mágicos.
      - name: Inmunidades al Daño
        detail: Veneno
      - name: Resistencias al Daño
        detail: Necrótico; Contundente, Cortante y Perforante de fuentes no mágicas
      - name: Inmunidades a Estados
        detail: Encantado, Envenenado, Dormido
      - name: Vuelo Arcano
        detail: El Liche levita permanentemente y tiene una velocidad de Vuelo igual a su Velocidad terrestre.
      - name: Rejuvenecimiento
        detail: Si muere mientras su filacteria permanezca intacta, el Liche vuelve a formarse junto a ella en 1d6 días.
    actions:
      - name: Maestro de la Magia Prohibida
        detail: |
          El Liche tiene acceso a las listas de conjuros de Mago y Arcanista de Nivel 5 o inferior y puede utilizarlos respetando el recurso indicado por cada conjuro.

          Cuando un conjuro requiera una Tirada de Ataque, utiliza +11. Cuando provoque una Tirada de Salvación, utiliza ND 16.

          Cada conjuro conserva normalmente sus efectos, Recarga, usos limitados y demás requisitos.
    reactions:
      - name: Conjuro de Oportunidad
        detail: |
          El Liche puede usar su Reacción para elegir una opción:
          - Realizar un ataque de Descarga Arcana, infligiendo su daño completo.
          - Utilizar un conjuro de Mago o Arcanista de Nivel 3 o inferior.

          Si el conjuro normalmente requiere una Acción o Interacción, puede utilizarlo al final del turno de otra criatura. Si el conjuro ya posee su propio desencadenante de Reacción, puede utilizarlo cuando ese desencadenante ocurra.

          El conjuro debe estar disponible y conserva normalmente sus efectos, Recarga, usos limitados y demás requisitos.
      - name: Recarga Mental
        detail: Como Reacción al final del turno de otra criatura, el Liche realiza una tirada de Recarga (1d8) para intentar recuperar el uso de uno de sus conjuros agotados.
    interactions: []
    behavior: Un archimago no-muerto de siglos de experiencia que adapta constantemente su magia a las amenazas del campo de batalla. Se mantiene fuera del alcance mediante Vuelo Arcano y utiliza su enorme repertorio de conjuros para alternar entre daño, control, defensa y utilidad. Fuera de su turno emplea Conjuro de Oportunidad para mantener la presión, responder con magia defensiva o lanzar Descargas Arcanas, y utiliza Recarga Mental cuando necesita recuperar uno de sus poderes más importantes. Cuando se utiliza como jefe, las Reacciones adicionales adquiridas al construir el encuentro convierten su versatilidad mágica en una economía de acciones extremadamente peligrosa.
    img: null
    size: Mediano
