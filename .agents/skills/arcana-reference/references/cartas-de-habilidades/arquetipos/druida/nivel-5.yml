cards:
  - id: a628fa77d6a3f40aa2d67034eb1fd5f35a1c5aa9
    name: Mil Formas
    level: 5
    type: efecto
    tags:
      - Druida
    requirements: Forma Salvaje Mayor & Instinto 6
    uses:
      type: null
      qty: 0
    description: >-
      _Ya no eres un prisionero de tu propia carne; fluyes entre formas titánicas y conjuros elementales con una
      facilidad aterradora._<br><br> Tu dominio de la metamorfosis es absoluto. Ganas los siguientes beneficios:<br> -
      **Mente Dual:** Puedes mantener la concentración en _Forma Salvaje_ y en otro conjuro de Druida simultáneamente
      (las TS para mantenerla se realizan por separado para cada habilidad).<br> - **Sintonía Natural:** Puedes realizar
      un ritual de meditación de 10 minutos. Al finalizarlo, recuperas todos los usos gastados de tu _Forma
      Salvaje_.<br> - **Avatar Titánico:** Cuando usas tu _Forma Salvaje_, puedes transformarte en bestias de tamaño
      Enorme.<br> - **Ferocidad Imparable:** Tus ataques en _Forma Salvaje_ ignoran una cantidad de puntos de Mitigación
      Física igual a tu puntuación de Instinto.
    slug: mil-formas
  - id: 1297449cb7af1276e22edbc07dff87140a4dfc7d
    name: Ira de la Naturaleza
    level: 5
    type: activable
    tags:
      - Druida
      - Conjuro
      - Concentración
    requirements: Manifestar Naturaleza & Dominio del Clima & Instinto 6
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Desatas el cataclismo final: tormentas, terremotos y zarzas se alzan en un torbellino indiscriminado de
      destrucción natural._<br><br> Como Acción, invocas la furia de la naturaleza en un radio de 20 metros a distancia
      Larga durante 1 minuto.<br> El terreno se vuelve difícil, la visibilidad se reduce a penumbra.<br> Al final de
      cada turno de una criatura hostil en el área, esta es azotada por relámpagos, raíces o vientos (a tu elección),
      recibiendo 3d8 de daño (TS de Reflejos ND 5 + Instinto para mitad de daño) y debe superar una TS de Cuerpo
      adicional o quedará Derribada.
    slug: ira-de-la-naturaleza
  - id: df93e86bf7424e597b25a536e1571d3985d997e2
    name: Reencarnar
    level: 5
    type: activable
    tags:
      - Druida
      - Conjuro
    requirements: Sintonía Primordial & Instinto 6
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _La naturaleza no devuelve aquello que murió exactamente como era; toma el alma, la envuelve en carne nueva y
      obliga al ciclo a comenzar otra vez._<br><br> Como Acción, comienzas un rito que requiere 1 hora ininterrumpida
      junto al cadáver de una criatura que haya muerto durante los últimos 7 días.<br> Si el alma está libre y desea
      regresar, la criatura vuelve a la vida con 1 Punto de Salud dentro de un nuevo cuerpo adulto y sano de un linaje
      humanoide apropiado para el mundo de juego.<br> El nuevo cuerpo puede ser elegido de común acuerdo entre jugador y
      DJ o determinarse al azar.<br> Al regresar a la vida, la criatura reemplaza sus cartas de Linaje por la misma
      cantidad de cartas de Linaje que poseía antes de morir, elegidas nuevamente para representar su nuevo cuerpo. Para
      esta elección puede ignorar el requerimiento *Solo Creación de Personaje*, pero sigue limitada a un máximo de 2
      cartas de Linaje.<br> Sus atributos, Puntos de Progreso y todas sus demás cartas permanecen sin cambios.<br> Este
      conjuro no puede devolver a la vida a una criatura cuya alma haya sido destruida, aprisionada o se niegue a
      regresar.
    slug: reencarnar
