cards:
  - id: c4d26bf4557258252efab5c292dc04ebdc68e63b
    name: Fórmula del Archimago
    level: 5
    type: activable
    tags:
      - Mago
    requirements: Estudios Mágicos & Mente 6
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Has descifrado el código fuente de la realidad; con un solo gesto, alteras la urdimbre sin esfuerzo
      aparente._<br><br> Como Acción, eliges cualquier carta de _Conjuro_ de _Arcanista_ que poseas en tu Colección,
      incluso si no está equipada en tus Ranuras de Cartas Activas, y la lanzas instantáneamente.<br> Este lanzamiento
      magistral no requiere componentes verbales ni somáticos, no consume ningún uso de la carta elegida y maximiza una
      de las tiradas de dados de la carta.<br> El conjuro continúa respetando sus demás reglas, incluyendo
      Concentración, duración y efectos Sostenidos cuando corresponda.
    slug: formula-del-archimago
