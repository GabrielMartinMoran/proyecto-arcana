cards:
  - id: 391d1924342f5b488f5f20af17d80221d618b3a5
    name: Contingencia Arcana
    level: 4
    type: activable
    tags:
      - Mago
      - Ritual
    requirements: Estudios Mágicos & Mente 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Preparas una trampa mágica ligada a tu propia seguridad, lista para saltar cuando más la necesites._<br><br>
      Inviertes 10 minutos para anclar un conjuro de Arcanista de Nivel 1, 2 o 3 (que requiera Acción o Interacción) a
      una condición específica (ej: "Si recibo daño", "Si caigo al agua"). Debes gastar un uso del conjuro en este
      momento. Cuando la condición se cumple, el conjuro se lanza automáticamente.<br> Solo puedes tener una
      contingencia activa a la vez.
    slug: contingencia-arcana
  - id: 94a6c6aa38af719963b6eba03b16bc0a773e8faf
    name: Escrutinio Arcano
    level: 4
    type: activable
    tags:
      - Mago
      - Conjuro
      - Concentración
    requirements: Visión Remota & Estudios Mágicos & Mente 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Tu sensor arcano deja de estar limitado por la distancia visible: buscas un hilo conocido en la Urdimbre y
      observas aquello que se encuentra en el otro extremo._<br><br> Como Acción, comienzas un escrutinio que requiere
      10 minutos de concentración ininterrumpida. Al finalizar, eliges una criatura que conozcas o un lugar concreto del
      mismo plano cuya ubicación puedas identificar razonablemente.<br> Creas un sensor invisible e intangible a
      distancia Inmediata del objetivo o en un punto apropiado del lugar elegido. Durante un máximo de 10 minutos, ves y
      oyes a través de él como si estuvieras allí.<br> Si eliges una criatura, esta realiza una TS de Instinto (ND 5 +
      Mente):<br> - Si apenas la conoces o solo dispones de una descripción, obtiene Ventaja (+1d4) en la tirada.<br> -
      Si la conoces personalmente, realiza la tirada normalmente.<br> - Si posees un objeto íntimamente vinculado a ella
      —como una posesión personal importante, un mechón de cabello o una muestra similar— realiza la tirada con
      Desventaja (-1d4).<br> Si supera la TS, el conjuro falla y no obtienes información sobre su ubicación.<br> El
      sensor puede ser detectado mediante efectos capaces de percibir magia o criaturas invisibles.
    slug: escrutinio-arcano
