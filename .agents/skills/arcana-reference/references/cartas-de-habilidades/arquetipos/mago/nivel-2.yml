cards:
  - id: fd2d3e54927d15e5b0f0d19ed88884f231eb44b0
    name: Fórmulas de Combate
    level: 2
    type: activable
    tags:
      - Mago
      - Conjuro
    requirements: Estudios Mágicos & Atributo Arcano 3
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Has aprendido a inscribir fórmulas de transformación sobre tus movimientos, alterando la naturaleza de un impacto
      en el instante preciso en que tu arma encuentra a su objetivo._<br><br> Cuando impactas a una criatura con un
      ataque usando un arma preparada como Foco, puedes usar tu Interacción y gastar el uso de esta carta para aplicar
      una de las siguientes fórmulas.<br> La fórmula solo modifica el daño base del arma. Todo daño adicional procedente
      de otras cartas, objetos o efectos conserva su tipo original.<br> - **Combustión (Fuego):** El daño base del arma
      se convierte en Fuego. Al inicio del próximo turno del objetivo, este recibe 1d4 de daño de Fuego.<br> -
      **Congelación (Frío):** El daño base del arma se convierte en Frío. La Velocidad del objetivo se reduce a la mitad
      hasta el final de su próximo turno.<br> - **Sobrecarga Nerviosa (Eléctrico):** El daño base del arma se convierte
      en Eléctrico. El objetivo sufre -1 a su Esquiva hasta el inicio de tu próximo turno.<br> - **Conversión Cinética
      (Fuerza):** El daño base del arma se convierte en Fuerza. Antes de aplicar el daño, puedes reducir su resultado
      hasta una cantidad igual a tu Atributo Arcano. Por cada punto de daño sacrificado de esta forma, obtienes 2 Puntos
      de Salud temporales durante 1 minuto.<br> - **Resonancia (Psíquico):** El daño base del arma se convierte en
      Psíquico. La próxima Tirada de Salvación que el objetivo realice contra uno de tus _Conjuros_ antes del final de
      tu próximo turno sufre Desventaja (-1d4).<br> - **Entropía (Necrótico):** El daño base del arma se convierte en
      Necrótico. El objetivo no puede recuperar Puntos de Salud hasta el final de tu próximo turno.
    slug: formulas-de-combate
  - id: 1ca9045b448eeee24d9937eb1cc600beafa581c2
    name: Familiar Arcano
    level: 2
    type: activable
    tags:
      - Mago
      - Ritual
    requirements: Estudios Mágicos & Atributo Arcano 3
    uses:
      type: null
      qty: 0
    description: >-
      _Invocas a un pequeño espíritu mágico que actúa como tus ojos, oídos y conducto en el mundo físico._<br><br> Tras
      1 hora de ritual, invocas un espíritu mágico menor encarnado en el cuerpo de un animal pequeño (cuervo, gato,
      sapo, etc.).<br> Su Salud es igual a tu puntuación de Mente, y su Esquiva es 10 + tu puntuación de Mente. El
      familiar no puede atacar.<br> Mientras te encuentres a una distancia Larga o menor del familiar, obtienes los
      siguientes beneficios:<br> - **Comando a Distancia**: Puedes darle ordenes telepáticamente a tu familiar.<br> -
      **Vínculo Sensorial:** Como Interacción, puedes trasladar tu consciencia al familiar. Hasta el inicio de tu
      próximo turno, ves y oyes a través de sus sentidos (quedando tú ciego y sordo a tu propio entorno).<br> -
      **Canalizador de Conjuros:** Cuando lanzas un _Conjuro_ de _Arcanista_ que requiera una tirada de ataque de toque
      o tenga alcance Inmediata, el familiar puede realizar el contacto por ti (usando tu tirada de ataque).<br> -
      **Batería de Emergencia:** Como Interacción, puedes consumir la esencia de tu familiar, reduciendo sus Puntos de
      Salud a 0 y desvaneciéndolo. Al hacerlo, recargas inmediatamente una carta agotada que poseas cuyo Nivel sea igual
      o inferior a la mitad de tu puntuación de Mente (redondeado hacia abajo, mínimo Nivel 1).
    slug: familiar-arcano
