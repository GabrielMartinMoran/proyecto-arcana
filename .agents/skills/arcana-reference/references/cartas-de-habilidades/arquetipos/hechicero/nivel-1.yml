cards:
  - id: 88b234b2894c0f8fd683481992f7be0b014182da
    name: Sangre Mágica
    level: 1
    type: efecto
    tags:
      - Hechicero
    requirements: Herencia Sobrenatural
    uses:
      type: null
      qty: 0
    description: >-
      _Utilizas tu propia vitalidad como combustible, sacrificando tu cuerpo para potenciar tu inestable poder
      arcano._<br><br> Una vez por ronda, puedes sacrificar vitalidad para alterar tus conjuros de _Arcanista_ o de
      _Hechicero_. Los Puntos de Salud sacrificados de esta forma se pierden directamente, no pueden ser mitigados ni
      pagados con Puntos de Salud temporales. Este sacrificio puede reducir tus Puntos de Salud a 0.<br><br> -
      **Sacrificio:** Cuando fallas una tirada de Recarga, siempre que el dado no haya obtenido un 1 natural, puedes
      sacrificar 3 PS por cada punto que quieras sumar al resultado.<br> - **Potencia:** Cuando realizas una tirada de
      daño de un conjuro, puedes sacrificar una cantidad de PS igual a 2 × el Nivel del conjuro para volver a tirar
      hasta un número de sus dados de daño igual a tu Presencia. Debes conservar los nuevos resultados.<br> -
      **Celeridad:** Cuando lanzas un conjuro de Nivel 1 o 2 cuyo tiempo de lanzamiento sea una Acción, puedes lanzarlo
      como Interacción en su lugar. Para hacerlo, sacrificas una cantidad de PS igual a 3 + el Nivel del conjuro.
    slug: sangre-magica
  - id: 2bfe0e47046da80a8ce040852ab0d28418c840c1
    name: Ráfaga Inestable
    level: 1
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: Herencia Sobrenatural
    uses:
      type: RELOAD
      qty: 3
    description: >-
      _Liberas una descarga de la energía sobrenatural que, al impactar, puede desbordarse en una cascada de destrucción
      impredecible._<br><br> Realizas un ataque de conjuro (1d8e + Atributo Arcano) a distancia Cercana contra un
      objetivo. Si impactas, infliges 1d6 de _Daño de Herencia_.<br> - **Cascada Menor:** Si el dado de daño resulta en
      un 6 natural, la energía se desborda: tiras 1d6 adicional y lo sumas al daño total. Este dado también puede
      generar otro dado adicional si obtiene un 6.
    slug: rafaga-inestable
  - id: b3e959eef16b6d53ed1620ded09194360b805062
    name: Sangre Despierta
    level: 1
    type: efecto
    tags:
      - Hechicero
    requirements: Herencia Sobrenatural
    uses:
      type: null
      qty: 0
    description: >-
      _La esencia sobrenatural que corre por tus venas ha comenzado a manifestarse más allá de tu magia. Tu cuerpo, tu
      mente y los conjuros que canalizas reflejan cada vez con mayor intensidad la verdadera naturaleza de tu
      herencia._<br><br> Obtienes el siguiente beneficio según tu _Daño de Herencia_:<br> - **Ácido — Corrosión
      Arcana:** Cuando infliges tu _Daño de Herencia_, ignoras una cantidad de Mitigación Mágica del objetivo igual a la
      mitad de tu Presencia (redondeado hacia abajo).<br> - **Eléctrico — Descarga Encadenada:** Una vez por turno,
      cuando infliges tu _Daño de Herencia_, puedes elegir una de las criaturas dañadas como origen de una descarga
      eléctrica. Desde ella, la descarga puede saltar a otra criatura situada a 3 metros o menos, y continuar saltando
      desde cada nueva criatura alcanzada hacia otra criatura situada a 3 metros o menos, hasta realizar un máximo de
      saltos igual a tu Presencia. Cada criatura alcanzada por un salto recibe 1d4 de daño Eléctrico. Una misma criatura
      no puede ser alcanzada más de una vez por esta descarga.<br> - **Frío — Frío Entumecedor:** Cuando una criatura
      recibe tu _Daño de Herencia_, su Velocidad se reduce en una cantidad de metros igual a la mitad de tu Presencia
      (redondeado hacia arriba) hasta el inicio de tu próximo turno. Varias aplicaciones de este efecto no se
      acumulan.<br> - **Fuego — Combustión Sobrenatural:** Una vez por turno, cuando infliges tu _Daño de Herencia_
      mediante una carta con la etiqueta _Conjuro_, añades 1d4 de daño de Fuego a su tirada de daño.<br> - **Fuerza —
      Campo Inercial:** Cuando utilizas una carta con la etiqueta _Conjuro_ que inflige tu _Daño de Herencia_, la
      energía residual se condensa alrededor de tu cuerpo. Hasta el inicio de tu próximo turno, obtienes +1 a tu
      Mitigación Física y Mágica. Si tu Presencia es 5 o superior, este bono aumenta a +2.<br> - **Necrótico — Marca de
      Extinción:** Cuando infliges tu _Daño de Herencia_ a una criatura hostil, esta queda marcada hasta el inicio de tu
      próximo turno. Si una criatura marcada es reducida a 0 Puntos de Salud mientras permanece marcada, recuperas una
      cantidad de Puntos de Salud igual a la mitad de tu Presencia (redondeado hacia abajo).<br> - **Psíquico — Mente
      Sin Fronteras:** Puedes comunicarte telepáticamente de forma bidireccional con criaturas que puedas percibir o que
      sepas que se encuentren a distancia Media. Esta comunicación transmite directamente pensamientos y conceptos, por
      lo que no requiere compartir una lengua. Si ya posees telepatía por otra fuente, su alcance aumenta en un
      rango.<br> - **Radiante — Marca Luminosa:** Cuando una criatura recibe tu _Daño de Herencia_, queda envuelta en un
      resplandor sobrenatural hasta el final de tu próximo turno. Mientras permanezca iluminada, no puede beneficiarse
      de Invisibilidad ni Esconderse, y la siguiente tirada de ataque realizada contra ella obtiene Ventaja (+1d4). La
      Ventaja se consume después de esa tirada, aunque el resplandor permanece hasta finalizar su duración.<br> -
      **Veneno — Metabolismo Tóxico:** Eres inmune al estado Envenenado. Además, cuando una criatura recibe tu _Daño de
      Herencia_ mediante una carta con la etiqueta _Conjuro_, queda intoxicada hasta el inicio de su próximo turno. Al
      inicio de ese turno, recibe 1d6 de daño de Veneno. Una criatura no puede tener más de una instancia de este efecto
      al mismo tiempo.
    slug: sangre-despierta
