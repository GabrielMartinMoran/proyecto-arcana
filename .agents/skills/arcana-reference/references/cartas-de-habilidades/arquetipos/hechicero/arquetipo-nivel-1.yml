cards:
  - id: f2155188b259ef1eda3978310bb1ad4df86f566c
    name: Herencia Sobrenatural
    level: 1
    type: efecto
    tags:
      - Hechicero
      - Arquetipo
      - Arcanista
    requirements: Presencia 2
    uses:
      type: null
      qty: 0
    description: >-
      _La magia no es algo que aprendiste, es algo que eres. Un fuego antiguo, una estirpe sobrenatural o la influencia
      de fuerzas imposibles late en tu interior, esperando ser liberada por tu voluntad._<br><br> Obtienes Ventaja
      (+1d4) en pruebas de Persuasión e Intimidación.<br> Adquieres la carta _Afinidad Arcana_, y puedes usar Presencia
      como tu Atributo Arcano para las cartas de _Arcanista_.<br><br> Al adquirir esta carta, determina el origen de tu
      poder sobrenatural y elige uno de los siguientes tipos de daño que sea apropiado para tu herencia: Ácido,
      Eléctrico, Frío, Fuego, Fuerza, Necrótico, Psíquico, Radiante o Veneno.<br> Esta elección es permanente y se
      convierte en tu _Daño de Herencia_. Siempre que una carta haga referencia a tu _Daño de Herencia_, utiliza el tipo
      elegido.<br><br> **Beneficio de Arquetipo:** Mientras este sea tu Beneficio de Arquetipo activo, añades la carta
      _Sangre Mágica_ a tu colección.<br> Adicionalmente, tu Salud máxima aumenta en +3, aprendes un idioma apropiado
      para el origen de tu poder y ganas un bono a tus Puntos de Salud igual a 5 PS por cada 10 PP que hayas gastado.
    slug: herencia-sobrenatural
