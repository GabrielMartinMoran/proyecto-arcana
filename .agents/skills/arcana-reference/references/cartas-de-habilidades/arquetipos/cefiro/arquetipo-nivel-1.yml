    name: Sintonía Fluida
    level: 1
    type: efecto
    tags:
      - Céfiro
      - Arquetipo
      - Combatiente
    requirements: Reflejos 2
    uses:
      type: null
      qty: 0
    description: >-
      _Eres como el viento entre las hojas: inalcanzable, veloz y capaz de golpear con precisión antes de desaparecer de
      la vista de tus rivales._<br><br> Obtienes Ventaja (+1d4) en Pruebas de Acrobacias y Supervivencia.<br><br>
      Adquieres la carta _Maestría Marcial_ y usas Reflejos como tu Atributo Marcial para las cartas de
      _Combatiente_.<br><br> **Beneficio de Arquetipo:**<br> - **Manos Diestras:** Para ti, Espadas Largas, Lanzas y
      Hachas de Mano adquieren la propiedad Precisa. El DJ puede extender este beneficio a otras armas de
      características similares.<br> - **Postura Fluida:** Ignoras una cantidad de la penalización a la Esquiva de tu
      armadura igual a tu puntuación de Reflejos dividida por 3 (redondeando hacia abajo, mínimo 1), siempre que cumplas
      el requisito de atributo de la armadura.<br> Adicionalmente, tu Salud máxima aumenta en +5 y ganas un bono a tus
      Puntos de Salud igual a 6 PS por cada 10 PP que hayas gastado.
    slug: sintonia-fluida
