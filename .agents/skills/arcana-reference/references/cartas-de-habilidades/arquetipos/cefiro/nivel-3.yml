cards:
  - id: 1b6c0b574dc90e1840a85ff892e5632ab4bc7f38
    name: Torbellino de Acero
    level: 3
    type: activable
    tags:
      - Céfiro
    requirements: Precisión Letal & Reflejos 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Te conviertes en un ciclón de filos que barre todo lo que te rodea, dejando un rastro de destrucción a tu
      paso._<br><br> Como Acción, desatas una ráfaga ineludible.<br> Si usas un arma a distancia, eliges un punto a
      distancia Larga. Si usas un arma cuerpo a cuerpo Precisa, el punto eres tú mismo.<br> Todas las criaturas a 3
      metros del punto elegido deben superar una TS de Reflejos (ND 5 + Reflejos) o recibir 3d6 de daño (del mismo tipo
      que tu arma) en caso de fallo, o la mitad en caso de éxito.
    slug: torbellino-de-acero
  - id: de38f8080dede3a35aa76b5777b75dc5ba46abb9
    name: Memoria Muscular
    level: 3
    type: efecto
    tags:
      - Céfiro
    requirements: Sintonía Fluida & Reflejos 4
    uses:
      type: null
      qty: 0
    description: >-
      _Tu cuerpo aprende el ritmo de tus adversarios incluso antes de que tu mente lo procese por completo. Cada
      movimiento observado te vuelve más difícil de alcanzar con el siguiente._<br> Cada vez que una criatura realiza un
      ataque contra ti, después de resolverlo obtienes un +1 acumulativo a tu Esquiva contra los siguientes ataques de
      esa misma criatura, hasta un máximo de +3.<br> Este bonificador dura hasta el inicio de tu próximo turno.
    slug: memoria-muscular
