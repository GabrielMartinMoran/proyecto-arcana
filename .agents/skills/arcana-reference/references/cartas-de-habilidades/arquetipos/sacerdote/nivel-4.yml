cards:
  - id: bd071f66c9136e3d07a8a825fe5a06858f74340c
    name: Sanación Verdadera
    level: 4
    type: activable
    tags:
      - Sacerdote
      - Conjuro
    requirements: Curar & Instinto 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _El poder absoluto de tu fe se manifiesta, limpiando toda impureza y devolviendo la vitalidad perdida al
      instante._<br><br> Como Acción, tocas a una criatura voluntaria. Recupera 4d6 + tu Instinto en Puntos de Salud.
      Además, eliminas todas las condiciones y efectos mágicos negativos que la afecten que no sean maldiciones ni
      petrificación.
    slug: sanacion-verdadera
  - id: 89845f43e5e3f420b68558592ff2b3eba98c0dd9
    name: Destruir Impíos
    level: 4
    type: efecto
    tags:
      - Sacerdote
    requirements: Ritos Sagrados & Instinto 5
    uses:
      type: null
      qty: 0
    description: >-
      _Tu luz se vuelve tan abrumadora que las criaturas de la noche se desintegran al entrar en contacto con
      ella._<br><br> Tu carta Expulsar Impíos se potencia. Cuando una criatura Infernal o No-muerta de NA 2 o inferior
      falla su Tirada de Salvación contra tu Expulsar Impíos, es destruida instantáneamente.
    slug: destruir-impios
  - id: 56d14fc55ca28ba533bc5123bb54fb1e71e9240f
    name: Cadenas de Luz
    level: 4
    type: activable
    tags:
      - Sacerdote
      - Conjuro
      - Concentración
    requirements: Fe Inspiradora & Instinto 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Grilletes forjados con pura luz divina brotan del suelo, apresando y quemando a quienes se resisten a la
      justicia._<br><br> Invocas cadenas de luz sólida que brotan del suelo en un radio de 5 metros a distancia Media.
      Las criaturas en el área deben superar una TS de Reflejos (ND 5 + Instinto). Si fallan, reciben 4d8 de daño
      Radiante y quedan Inmovilizadas por las cadenas durante 1 minuto. Si tienen éxito en la salvación inicial, reciben
      la mitad del daño y no quedan atrapadas.<br> Una criatura inmovilizada puede usar su Acción para realizar una
      prueba de Cuerpo (ND 5 + Instinto) para tratar de liberarse.
    slug: cadenas-de-luz
  - id: 413ac28f71a497b48e10b3e0218c82234d804dfa
    name: Arma Espiritual
    level: 4
    type: activable
    tags:
      - Sacerdote
      - Conjuro
    requirements: Fe Inspiradora & Instinto 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Das forma a tu fe en la figura de un arma incorpórea que asesta golpes dictados por tu inquebrantable
      voluntad._<br><br> Invocas un arma de energía pura que flota en el aire a distancia Cercana durante 1 minuto.<br>
      Cuando lanzas el conjuro, y en cada uno de tus turnos subsiguientes usando tu Interacción, puedes mover el arma
      hasta 10 metros y realizar un ataque de conjuro (1d8e + Instinto) contra una criatura Inmediata a ella. Si
      impactas, infliges 2d8 de daño de Fuerza.<br> - **Canalizar Castigo:** Cando impactas un ataque con el arma
      espiritual, si tienes _Golpe Divino_ activa y disponible para usar, puedes usarla como parte de la misma
      Interacción.
    slug: arma-espiritual
  - id: 8e203ce6d413c18333301f74c073e6c0a3904780
    name: Poder Sagrado
    level: 4
    type: efecto
    tags:
      - Sacerdote
    requirements: Fe Inspiradora & Instinto 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Tu fervor alcanza un nuevo límite, convirtiendo tus milagros ofensivos más simples en manifestaciones de poder
      abrumador._<br><br> Cuando infliges daño con una carta que tenga las etiquetas _Sacerdote_ y _Conjuro_ (ambas) de
      Nivel 1 o 2, duplicas el daño base de la carta.
    slug: poder-sagrado
  - id: c3a179b2e2208c06c74178cc9a9d54519af9b212
    name: Restitución Divina
    level: 4
    type: activable
    tags:
      - Sacerdote
      - Conjuro
    requirements: Fe Inspiradora & Instinto 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Pronuncias los nombres sagrados que rompen cadenas invisibles, expulsando aquellas corrupciones que la medicina y
      la sanación ordinaria no pueden alcanzar._<br><br> Como Acción, tocas a una criatura o un objeto y eliges uno de
      los siguientes efectos:<br> - **Liberar:** Eliges una Maldición, Petrificación o Posesión sobrenatural que afecte
      al objetivo. Realizas una Prueba de Instinto contra el atributo de lanzamiento o ND del efecto original. Si el
      efecto no posee un valor adecuado, el DJ establece la ND según su poder y procedencia. Si tienes éxito, el efecto
      termina permanentemente sobre el objetivo.<br> - **Restaurar:** Eliges un atributo del objetivo que haya sido
      reducido por una enfermedad, veneno, maldición, conjuro u otro efecto externo. El atributo recupera su valor
      normal. Este efecto no puede aumentar un atributo por encima de su valor habitual ni recuperar reducciones
      permanentes realizadas voluntariamente como coste o sacrificio.<br> - **Restaurar Miembro:** Vuelves a unir al
      cuerpo una parte amputada que pertenezca al objetivo, siempre que la parte esté presente y suficientemente
      intacta. La extremidad u órgano recupera su funcionalidad normal al finalizar el conjuro. Este efecto no restaura
      Puntos de Salud ni puede recrear partes del cuerpo que hayan sido destruidas o se hayan perdido. Este conjuro no
      restaura Puntos de Salud ni elimina otras condiciones o efectos negativos; para ello siguen siendo necesarias
      cartas como _Curar_ o _Sanación Verdadera_.
    slug: restitucion-divina
  - id: cc5669bd69af68fd17edf3e6b366de945c52bbf4
    name: Retorno Consagrado
    level: 4
    type: activable
    tags:
      - Sacerdote
      - Conjuro
    requirements: Santuario & Instinto 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Tu fe convierte un lugar consagrado en un faro imposible de perder; sin importar cuán lejos viajes, siempre
      puedes encontrar el camino de regreso._<br><br> Mientras esta carta se encuentre activa, cada vez que utilizas
      _Santuario_ puedes designar el círculo creado como tu Punto de Retorno. Solo puedes mantener un Punto de Retorno a
      la vez, y permanece vinculado a ti hasta que designes uno nuevo o esta carta deje de estar activa.<br> Como
      Acción, puedes utilizar esta carta para transportarte instantáneamente junto con un número de criaturas
      voluntarias a distancia Inmediata igual a tu puntuación de Instinto hasta el centro de tu Punto de Retorno.<br>
      Todas las criaturas transportadas deben encontrarse en el mismo plano de existencia que el Punto de Retorno.
    slug: retorno-consagrado
