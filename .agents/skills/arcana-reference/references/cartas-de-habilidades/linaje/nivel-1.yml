cards:
  - id: 161a4290d194746de99f60f5aeceabdd27695146
    name: Talento de Familia
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Las lecciones de tu hogar y tu crianza te han dejado marcas imborrables que aplicas instintivamente en tu día a
      día._<br><br> Elige tres habilidades (como Atletismo, Persuasión, etc.) que representen tu crianza. Obtienes
      Ventaja (+1d4) en todas las pruebas relacionadas con esas tres habilidades.
    slug: talento-de-familia
  - id: 136f99fe4c4291312833060eb707266267fe397c
    name: Enfoque Adaptable
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu mente es flexible y se adapta rápidamente a nuevos desafíos._<br><br> Adquieres los siguientes beneficios:<br>
      - Una vez por día de descanso, puedes tomarte 10 minutos para cambiar una de tus cartas activas por otra de tu
      Colección.<br> - Una vez por día de descanso, puedes utilizar una carta Activable de **Nivel 1 o 2** que no tengas
      activada pero que poseas en tu Colección.
    slug: enfoque-adaptable
  - id: b617383dcfbbf09eae656d937aa80fd5befb36c5
    name: Líder Nato
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu presencia inspira confianza y coordinación en el campo de batalla._<br><br> Cuando usas la acción de Ayuda
      para otorgar Ventaja a un aliado en una prueba de habilidad o tirada de ataque, ese aliado también suma un +1 al
      resultado final de su tirada.
    slug: lider-nato
  - id: d462b017e70c2b5023d80e51de3efaf92acdfb62
    name: Gracia Élfica
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Te mueves y reaccionas al peligro con una celeridad antinatural, anticipando las amenazas antes de que se
      manifiesten._<br><br> Tu velocidad de movimiento aumenta en 1 metro, obtienes Ventaja (+1d4) en todas tus tiradas
      de Iniciativa, y no pueden sorprenderte mientras estás consciente.
    slug: gracia-elfica
  - id: 0eee19daea755106dd7738b99258ab731d9d9133
    name: Trance Élfico
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu linaje te conecta con un estado de conciencia profunda capaz de restaurar tu cuerpo y tus energías._<br><br>
      No necesitas dormir. Puedes entrar en un estado de meditación durante 4 horas para obtener los beneficios de un
      día de descanso. Además, la magia y los venenos no pueden dormirte.<br> Además, al finalizar tu trance, elige una
      habilidad en la que no tengas Ventaja. Adquieres Ventaja (+1d4) en pruebas relacionadas esa habilidad.
    slug: trance-elfico
  - id: a703e29747d72a8019fbc45f8ecfb9c8f1a2ef64
    name: Mirada Estelar
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tus ojos ven más allá de la simple luz y la sombra._<br><br> Obtienes Visión en la Oscuridad hasta distancia
      Cercana.<br> Además, puedes usar tu Acción para abrir tus sentidos al mundo invisible durante 1 minuto,
      volviéndote consciente de la presencia y ubicación de cualquier criatura invisible o escondida a 10 metros de ti.
      Puedes usar esta habilidad un número de veces igual a tu puntuación de Mente por día de descanso.
    slug: mirada-estelar
  - id: 91512235fcc1bea02da707a1e385dd2b9b6d781c
    name: Sangre Resistente
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu herencia te otorga una constitución inquebrantable. Tu sangre purga las toxinas con facilidad y tu capacidad
      para sobreponerte al dolor físico es legendaria._<br><br> Obtienes Ventaja (+1d4) en Tiradas de Salvación de
      Cuerpo contra venenos y enfermedades.<br> Además, tu capacidad para sobreponerte al dolor es legendaria. Una vez
      por día de descanso, al final de tu turno, si estás bajo un efecto causado por una Tirada de Salvación de Cuerpo
      fallida, y dicho efecto permita realizar otra Tirada de Salvación de Cuerpo para finalizarlo, puedes terminar el
      efecto sobre ti inmediatamente.
    slug: sangre-resistente
  - id: c8e35358933b4ea6f4547d28bcb235ad205acd37
    name: Acorazado
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Estás acostumbrado a la carga y el peso de las armaduras._<br><br> El requisito de Cuerpo de cualquier armadura
      que vistas se reduce en 1 (hasta un mínimo de 1).
    slug: acorazado
  - id: 78492397e0343be2cc92cf1213936087d61efc7f
    name: Eco de la Roca
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu conexión con la piedra es tan profunda que puedes sentir las vibraciones a través de ella._<br><br> Obtienes
      Visión en la Oscuridad hasta distancia Cercana.<br> Además, mientras estés en contacto con una superficie de
      piedra o tierra, puedes usar tu Interacción para "escuchar" el suelo. Hasta el inicio de tu próximo turno, eres
      consciente de la ubicación y movimiento de cualquier criatura en contacto con la misma superficie a 10 metros de
      ti. Puedes usar esta habilidad un número de veces igual a tu puntuación de Instinto por día de descanso.
    slug: eco-de-la-roca
  - id: 69edbca2bf5bf7c82bb676a4ec24791629cbf907
    name: Mente Curiosa
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu mente nunca deja de trabajar._<br><br> Cuando realizas una prueba de Mente para recordar información sobre
      historia, conocimiento arcano o para investigar algo y fallas la tirada, aun así obtienes una pieza de información
      verdadera, aunque incompleta o críptica, a discreción del DJ.
    slug: mente-curiosa
  - id: ada1d5bfde52b49a717ba74dd6de42f9af237d79
    name: Paso Escurridizo
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
      - Reacción
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Eres excepcionalmente difícil de acorralar._<br><br> Cuando un enemigo te falla un ataque cuerpo a cuerpo, puedes
      usar tu Reacción para moverte una distancia en metros igual a la mitad de tu puntuación de Reflejos (redondeando
      hacia arriba). Este movimiento no provoca ataques de oportunidad.
    slug: paso-escurridizo
  - id: b2abf7e726fa796f3eb951bb56058b309f041a97
    name: Parpadeo Ilusorio
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
      - Reacción
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Eres un maestro en el arte de la distracción._<br><br> Obtienes Visión en la Oscuridad hasta distancia
      Cercana.<br> Además, cuando un enemigo declara un ataque contra ti pero antes de que realice la tirada, puedes
      usar tu Reacción para crear una breve ilusión de ti mismo. El enemigo debe superar una TS de Instinto (ND 5 +
      Mente). Si falla, el ataque se redirige a la ilusión y falla. Puedes usar esta habilidad un número de veces igual
      a tu puntuación de Mente por día de descanso.
    slug: parpadeo-ilusorio
  - id: 9966cd23ee07dbfd580ce4501269c57601fb932b
    name: Afortunado
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _El destino parece sonreírte incluso en tus peores momentos, convirtiendo los tropiezos en nuevas
      oportunidades._<br><br> Cuando sacas un 1 natural en una tirada de un dado que pueda explotar, ganas un Punto de
      Suerte.
    slug: afortunado
  - id: 1c41f684a1192b61c80644d0e9c5e7044840d444
    name: Pies Ligeros
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Eres un experto en escurrirte por los lugares mas estrechos y pasar desapercibido._<br><br> Puedes moverte a
      través del espacio de cualquier criatura que sea de un tamaño mayor que el tuyo. Además, puedes intentar
      esconderte (usar la habilidad de Sigilo) incluso cuando solo te oculta una criatura aliada que sea más grande que
      tú.
    slug: pies-ligeros
  - id: 6eeb96d5c2f8192a643aa849a4eb93123dcbc51a
    name: Compartir Fortuna
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
      - Reacción
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu buena fortuna es tan grande que puedes compartirla._<br><br> Después de que un aliado a distancia Cercana que
      puedas ver realice una tirada de ataque, prueba de habilidad o tirada de salvación, puedes usar tu Reacción para
      gastar cualquier cantidad de tus Puntos de Suerte. El resultado de la tirada de tu aliado aumenta en +1 por cada
      Punto de Suerte que hayas gastado.
    slug: compartir-fortuna
  - id: fc897b218795f6390450daa8f46fa6db45f6cc19
    name: Reprensión Infernal
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
      - Reacción
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu sangre infernal responde al dolor con una reprimenda infernal._<br><br> Cuando una criatura que puedas ver a
      distancia Cercana te inflige daño, puedes usar tu Reacción para desatar una descarga de Fuego, Frío o Electricidad
      contra ella (elijes el tipo de daño al escoger esta carta).<br> El atacante debe superar una Tirada de Salvación
      de Reflejos (ND 5 + Presencia). Si falla, recibe 1d6 de daño de Fuego. Si tiene éxito, recibe la mitad del
      daño.<br> Puedes usar esta habilidad un número de veces por día de descanso igual a tu puntuación de Presencia.
    slug: reprension-infernal
  - id: 539ba0cdebd9f63e02a64aefcdc7e3fbeb19be78
    name: Pacto de Sangre
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tus tratos y acuerdos tienen un peso especial, sellados con la sangre de tu linaje._<br><br> Si una criatura hace
      un juramento verbal directamente contigo y lo sella con un gesto simbólico, se crea un vínculo entre ambos. Si esa
      criatura rompe el juramento, tú lo sabes instintivamente y puedes desatar una de las siguientes maldiciones sobre
      ella (la elección es permanente para ese traidor y no requiere acción para activarse):<br> - **Marca del
      Cazador:** Obtienes Ventaja (+1d4) en todas las tiradas de ataque que realices contra él.<br> - **Marca del
      Paria:** El traidor sufre Desventaja (-1d4) en todas las tiradas de ataque que realice contra ti.<br> - **Marca de
      la Debilidad:** Obtienes Ventaja (+1d4) en todas las pruebas de habilidad que realices contra él.<br> La marca
      dura hasta que el traidor repare su falta de una manera significativa (a discreción del DJ), o hasta que tú
      decidas liberarlo del juramento.
    slug: pacto-de-sangre
  - id: b18ca696be1521b220623a1f4a0872003e6886fd
    name: Pacto Oscuro
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Puedes hacer un pacto con tu propia sangre para forzar el destino cuando más lo necesites._<br><br> Obtienes
      Visión en la Oscuridad hasta distancia Cercana.<br> Además, una vez por día de descanso, puedes elegir sacar un 8
      automático (sin explosión ni obtención de suerte) en el dado de una tirada de ataque, prueba de habilidad o tirada
      de salvación (puedes decidirlo después de ver el resultado del dado real).<br> Al hacerlo, obtienes un "Dado de
      Deuda" (un d6). Mientras tengas este dado, la próxima vez que debas realizar una tirada de ataque, prueba de
      habilidad o tirada de salvación, debes lanzar el Dado de Deuda junto con tu tirada normal.<br> - Si el Dado de
      Deuda resulta en un 1, tu tirada se considera un fallo crítico independientemente de tu resultado, y la deuda se
      salda (el dado se retira).<br> - Si el resultado es cualquier otro número, no ocurre nada adicional y conservas el
      Dado de Deuda para tu siguiente tirada.
    slug: pacto-oscuro
  - id: 465239038da5be2412587f4cfe0e10d0778231f8
    name: Fortaleza Rocosa
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu linaje de te ha dotado de una resistencia física excepcional._<br><br> Tu Salud máxima aumenta permanentemente
      en +3. Además, tienes Ventaja para resistir cualquier intento de ser Derribado o movido contra tu voluntad.
    slug: fortaleza-rocosa
  - id: 0f1e85e350cd29913d2f9aeeb5d5c8a1edf24075
    name: Porte de Gigante
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu estatura y físico imponentes son un arma en sí mismos._<br><br> Puedes cargar el doble de peso de lo que
      podrías normalmente.<br> Además, una vez por turno, si te mueves por lo menos 5 metros para llegar a un enemigo de
      tamaño Grande o inferior y atacarlo, en caso de que el ataque impacte, puedes forzar al objetivo a superar una
      Tirada de Salvación de Cuerpo (ND 5 + Cuerpo) o caer Derribado.
    slug: porte-de-gigante
  - id: 251cb667b75ab6ee802202ba51c7345be7f3040f
    name: Adaptación Climática
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu linaje te ha adaptado a los entornos más extremos._<br><br> Al elegir este linaje, selecciona un clima: Frío o
      Calor. Obtienes Resistencia al tipo de daño elemental correspondiente (Frío o Fuego).<br> Además, no sufres los
      efectos negativos de las temperaturas extremas asociadas a tu clima elegido.
    slug: adaptacion-climatica
  - id: 47b5e4d1c63ad4c16ae95dada06b2b83dfc9939f
    name: Mirada Dracónica
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tus ojos brillan con una intensidad de otro mundo._<br><br> Obtienes Visión en la Oscuridad hasta distancia
      Cercana.<br> Adicionalmente, tu mirada refleja la ancestral sabiduría y poder de tu linaje. Al finalizar un día de
      descanso, eliges uno de los siguientes focos para tu mirada. Hasta tu próximo día de descanso, obtienes Ventaja
      (+1d4) en todas las pruebas de habilidad de la pericia elegida:<br> - **Foco del Terror:** Intimidación.<br> -
      **Foco de la Verdad:** Perspicacia.<br> - **Foco del Cazador:** Percepción.
    slug: mirada-draconica
  - id: 4afc1e3fce719100a9ac3fdced210cf4ce6f0d8e
    name: Herencia Draconiana
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu linaje te ha otorgado una resistencia innata al elementos que tus ancestros dominaban._<br><br> Al elegir esta
      carta, seleccionas un tipo de ancestro dracónico de la siguiente lista. Obtienes Resistencia al tipo de daño
      asociado:<br> - **Rojo, Dorado o Latón:** Fuego<br> - **Azul o Bronce:** Eléctrico<br> - **Blanco o Plateado:**
      Frío<br> - **Negro o Cobre:** Ácido<br> - **Verde:** Veneno
    slug: herencia-draconiana
  - id: f4fc0cd08c0b3f2d91a3192cebfc6a9edfd0eaa9
    name: Castigo Elemental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Puedes canalizar la energía de tus ancestros para castigar a tus enemigos._<br><br> Al elegir esta carta, debes
      seleccionar un tipo de ancestro dracónico de la siguiente lista para determinar tu tipo de daño.<br> - **Rojo,
      Dorado o Latón:** Fuego<br> - **Azul o Bronce:** Eléctrico<br> - **Blanco o Plateado:** Frío<br> - **Negro o
      Cobre:** Ácido<br> - **Verde:** Veneno<br> Cuando impactas a un objetivo con un ataque cuerpo a cuerpo, puedes
      decidir imbuir el golpe con energía elemental, infligiendo 1d6 de daño adicional del tipo elemental elegido.
      Puedes usar esta habilidad un número de veces igual a tu puntuación de Cuerpo por día de descanso.
    slug: castigo-elemental
  - id: c3d767081609c86e166fe64b5ccdc28ddf7b6f1e
    name: Naturaleza Anfibia
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tritón
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu cuerpo pertenece tanto al mar como a la superficie._<br><br> Puedes respirar tanto aire como agua y obtienes
      una velocidad de nado igual a tu Velocidad normal.
    slug: naturaleza-anfibia
  - id: b27cb495dbb591617456765d7771bc18858f430e
    name: Ojos Abisales
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tritón
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tus ojos están hechos para profundidades donde la luz es apenas un recuerdo._<br><br> Obtienes Visión en la
      Oscuridad hasta distancia Cercana.<br><br> Además, obtienes Ventaja (+1d4) en Tiradas de Salvación para resistir
      efectos que pudieran dejarte Cegado.
    slug: ojos-abisales
  - id: c8e19b92403ab5b73f92c4c802794b07fa71d705
    name: Heraldo de las Mareas
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tritón
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _El mar reconoce tu presencia, y las criaturas que lo habitan perciben en ti algo familiar._<br><br> Puedes
      comunicarte verbalmente con Bestias que tengan una velocidad de nado, aunque no compartan una lengua. La
      información que puedes intercambiar está limitada por la inteligencia y los sentidos de la criatura. Esta
      capacidad no modifica su actitud hacia ti ni la obliga a obedecerte.<br><br> Además, como Interacción, puedes
      manipular de forma menor agua no mágica que puedas ver a distancia Cercana: puedes hacer que se agite, se aquiete,
      fluya lentamente o adopte una forma simple. Esta manipulación no puede infligir daño, desplazar criaturas, crear
      cobertura ni reproducir los efectos de una carta.
    slug: heraldo-de-las-mareas
  - id: 17be69d865e0b99ad5469328b065307bdf85262b
    name: Adaptación Elemental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Genasi
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _La esencia elemental que corre por tu cuerpo ha transformado tu fisiología, permitiéndote existir allí donde
      otros apenas podrían sobrevivir._<br><br> Al elegir esta carta, aplica el beneficio correspondiente a tu
      manifestación elemental:<br> - **Aire — Aliento del Viento:** No necesitas respirar y no recibes daño por
      caída.<br> - **Tierra — Cuerpo Pétreo:** Cuando recibes daño Físico o Elemental, puedes obtener Resistencia contra
      esa instancia de daño. Puedes utilizar este beneficio un número de veces igual a la mitad de tu puntuación de
      Cuerpo, redondeando hacia abajo (mínimo 1), por día de descanso. Además, el terreno difícil natural compuesto
      principalmente de tierra, piedra, arena o escombros no te cuesta movimiento adicional.<br> - **Fuego — Corazón de
      Brasa:** Obtienes Resistencia al daño de Fuego y no sufres los efectos negativos de temperaturas ambientales
      extremadamente altas.<br> - **Agua — Naturaleza Anfibia:** Puedes respirar tanto aire como agua y obtienes una
      velocidad de nado igual a tu Velocidad normal.
    slug: adaptacion-elemental
  - id: 6e81304e1f9069e95ca8f4d88efcd16718e54ff6
    name: Mirada Elemental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Genasi
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tus sentidos están impregnados por la esencia de tu elemento y perciben aspectos del mundo que permanecen ocultos
      para los demás._<br><br> Al elegir esta carta, obtienes el sentido correspondiente a tu manifestación
      elemental:<br> - **Aire — Percepción Eólica:** Percibes la ubicación y movimiento de criaturas y objetos
      materiales a 5 metros mediante las alteraciones que producen en el aire, incluso aunque sean invisibles o no
      puedas verlos. Esta percepción requiere que el aire pueda circular entre tú y aquello que percibes y no atraviesa
      barreras sólidas. No reemplaza la visión normal.<br> - **Tierra — Percepción Sísmica:** Mientras estés en contacto
      con una superficie de tierra o piedra, percibes la ubicación y movimiento de cualquier criatura a 5 metros que
      esté en contacto con la misma superficie continua. Esta percepción no reemplaza la visión normal.<br> - **Fuego —
      Visión Térmica:** Percibes fuentes de calor y la ubicación y silueta de criaturas que emitan calor hasta distancia
      Cercana, incluso en oscuridad, aunque sean invisibles o aunque humo, niebla u otras obstrucciones puramente
      visuales impidan verlas normalmente. Esta visión no atraviesa barreras sólidas ni te permite percibir detalles que
      no puedan distinguirse mediante el calor.<br> - **Agua — Visión Abisal:** Obtienes Visión en la Oscuridad hasta
      distancia Cercana. Mientras estés sumergido, su alcance aumenta a distancia Media.
    slug: mirada-elemental
  - id: bf1976ad9e141aeb18512ec7357e5c275c0e3183
    name: Movilidad Elemental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Genasi
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Por unos instantes, tu cuerpo abandona las limitaciones de la carne y adopta las propiedades del elemento que
      corre por tus venas._<br><br> Puedes utilizar la capacidad correspondiente a tu manifestación elemental un número
      de veces igual a la mitad de tu puntuación de Reflejos, redondeando hacia abajo (mínimo 1), por día de
      descanso:<br> - **Aire — Corriente Ascendente:** Como Interacción, hasta el final de tu turno obtienes una
      velocidad de vuelo igual a tu Velocidad y tu movimiento no provoca Reacciones. Si al finalizar tu turno continúas
      en el aire, desciendes suavemente hasta la primera superficie capaz de sostenerte que se encuentre debajo de ti,
      sin recibir daño por caída.<br> - **Tierra — Fundirse con la Tierra:** Como Interacción, te fundes con una
      superficie de tierra o piedra natural que estés tocando y reapareces en un espacio desocupado que puedas ver a una
      distancia máxima igual a tu Velocidad, siempre que el destino esté en contacto con la misma superficie continua de
      tierra o piedra. Este desplazamiento es una teletransportación y no provoca Reacciones.<br> - **Fuego — Salto
      Ígneo:** Como Interacción, tu cuerpo se deshace momentáneamente en llamas y reapareces en un espacio desocupado
      que puedas ver a una distancia máxima igual a tu Velocidad. Este desplazamiento es una teletransportación y no
      provoca Reacciones.<br> - **Agua — Forma Fluida:** Como Interacción, hasta el final de tu turno tu cuerpo adquiere
      una consistencia líquida. Durante ese tiempo puedes moverte a través del espacio ocupado por otras criaturas,
      ignoras terreno difícil, tu movimiento no provoca Reacciones y puedes atravesar aberturas suficientemente grandes
      para permitir el paso del volumen de agua que compone tu cuerpo.
    slug: movilidad-elemental
  - id: d23d7bd814434cdbfb26620a9c6f752066cbe7ec
    name: Mente Inquebrantable
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gith
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Siglos de disciplina psiónica y resistencia a la dominación han convertido tu mente en una fortaleza difícil de
      quebrar._<br><br> Obtienes Resistencia al daño Psíquico.<br><br> Además, obtienes Ventaja (+1d4) en las Tiradas de
      Salvación para evitar quedar Encantado.
    slug: mente-inquebrantable
  - id: ea1bf8e4b2397f6049e887a5d598f5ff2e2c34ad
    name: Mente Psiónica
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gith
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu voluntad puede ejercer fuerza sobre el mundo físico, desplazando materia sin necesidad de tocarla._<br><br>
      Puedes usar tu Interacción para manipular telequinéticamente un objeto que puedas ver a distancia Cercana, siempre
      que ninguna criatura lo esté sosteniendo, llevando puesto o transportando y que no pese más de 5 kg. Puedes
      moverlo hasta 5 metros, recogerlo, dejarlo, abrir o cerrar mecanismos sencillos y realizar otras manipulaciones
      que razonablemente podrían hacerse con una mano. Esta capacidad no puede utilizarse para realizar ataques ni
      activar objetos mágicos.<br><br> Además, como Interacción, puedes ejercer una descarga de fuerza telequinética
      sobre una criatura que puedas ver a distancia Cercana. El objetivo debe superar una Tirada de Salvación de Cuerpo
      (ND 5 + Mente) o ser empujado o atraído hasta 2 metros en línea recta.<br><br> Puedes utilizar esta descarga una
      cantidad de veces igual a la mitad de tu puntuación de Mente, redondeando hacia abajo (mínimo 1), por día de
      descanso.
    slug: mente-psionica
  - id: 7f6c19e79816b48c48b6149978d44dd9c0a555ea
    name: Vínculo Mental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gith
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Para los tuyos, la distancia entre dos mentes es una barrera mucho menos sólida que la distancia entre dos
      cuerpos._<br><br> Puedes comunicarte telepáticamente con una criatura que puedas ver a distancia Cercana, siempre
      que esta conozca al menos una lengua. La criatura puede responderte telepáticamente mientras permanezca dentro del
      alcance.<br><br> Además, puedes usar tu Interacción para establecer un vínculo mental con una criatura voluntaria
      a distancia Cercana. Durante 10 minutos, mientras ambos permanezcan a distancia Media uno del otro, conocen
      intuitivamente la dirección en la que se encuentra el otro y pueden comunicarse telepáticamente aunque no puedan
      verse.<br><br> Solo puedes mantener un vínculo mental de este tipo a la vez.
    slug: vinculo-mental
  - id: c3c6e00078caa801af5c23d55c8f716a73ad56f3
    name: Caparazón Natural
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tortle
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu caparazón desvía impactos que destrozarían el cuerpo de otras criaturas._<br><br> La primera vez en cada ronda
      que un ataque que te impacte sea un golpe crítico, recibes daño normal de ese ataque. El ataque sigue
      considerándose un golpe crítico a efectos de cualquier otro efecto.
    slug: caparazon-natural
  - id: 670f9fb0c252a43a4d854e21e97d0b9200b370b8
    name: Defensa de Caparazón
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tortle
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Puedes desaparecer por completo dentro de tu caparazón, convirtiéndolo tanto en una fortaleza como en tu refugio
      natural._<br><br> Como Acción, retraes tu cabeza y extremidades dentro de tu caparazón. Permaneces retraído hasta
      que uses una Interacción para emerger.<br><br> Mientras estás retraído:<br> - Obtienes Resistencia al daño Físico
      y Elemental.<br> - Obtienes Ventaja (+1d4) en Tiradas de Salvación de Cuerpo.<br> - Sufres Desventaja (-1d4) en
      Tiradas de Salvación de Reflejos.<br> - Tu Velocidad es 0.<br> - No puedes realizar Acciones, Interacciones ni
      Reacciones, excepto usar una Interacción para emerger.<br><br> Además, mientras descansas retraído dentro de tu
      caparazón, no necesitas refugio frente a condiciones ambientales ordinarias, como lluvia, viento o humedad. Si
      completas un día de descanso de esta manera, recuperas una cantidad adicional de Salud igual a tu puntuación de
      Cuerpo.
    slug: defensa-de-caparazon
  - id: 65022a00dcffdfc149b84b9977609c3e98cf5472
    name: Anatomía Migratoria
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tortle
    requirements: Solo Creación de Personaje
    uses:
      type: null
      qty: 0
    description: >-
      _Tu organismo está adaptado a recorrer enormes distancias y sobrevivir durante largos períodos lejos de cualquier
      asentamiento._<br><br> Obtienes los siguientes beneficios:<br> - **Aliento Prolongado:** Puedes contener la
      respiración durante 1 hora.<br> - **Metabolismo Eficiente:** Necesitas consumir solamente la mitad de la comida y
      el agua que requeriría normalmente una criatura de tu tamaño.<br> - **Orientación Migratoria:** Siempre conoces
      intuitivamente los puntos cardinales y recuerdas con precisión general el camino que has recorrido, por lo que
      puedes desandar una ruta recorrida sin perderte por medios naturales. Esto no te permite conocer rutas
      desconocidas, encontrar automáticamente el camino más seguro ni detectar peligros.<br> - **Resistencia del
      Viajero:** Una vez por día de descanso, cuando falles una Prueba de Cuerpo (Aguante) o una Tirada de Salvación de
      Cuerpo provocada por una marcha prolongada, hambre, sed, cansancio o una condición ambiental natural, puedes
      considerar que la tirada fue exitosa en su lugar, a menos que el fallo haya sido una pifia.
    slug: anatomia-migratoria
