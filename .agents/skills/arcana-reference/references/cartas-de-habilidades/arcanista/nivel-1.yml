cards:
  - id: eb9c2d46aad820f60cd4281130cb64f266942ec6
    name: Afinidad Arcana
    level: 1
    type: efecto
    tags:
      - Arcanista
    requirements: Estudios Mágicos | Pacto Supremo | Herencia Sobrenatural
    uses:
      type: null
      qty: 0
    description: >-
      _La magia no es un misterio para ti, sino una herramienta, un pacto o un derecho de nacimiento. Al sintonizarte
      con las corrientes de poder que recorren el mundo, eres capaz de manifestar lo imposible._<br><br> Tienes acceso a
      la lista de cartas de _Arcanista_ y usas tu Atributo Arcano para los requerimientos y efectos de estas.
    slug: afinidad-arcana
  - id: 44342205841c3f4555d30ee1f77e4381fbd253a7
    name: Trucos Arcanos
    level: 1
    type: efecto
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana
    uses:
      type: null
      qty: 0
    description: >-
      _Dominas los rudimentos de la magia, permitiéndote realizar pequeñas proezas que, aunque simples, demuestran tu
      control sobre la Urdimbre._<br><br> Puedes ejecutar los siguientes trucos arcanos:<br> - **Efectos mágicos
      menores:** Como Acción, produces una manifestación mágica menor: creas una fuente de luz, un sonido u olor,
      limpias o ensucias un objeto, enciendes o apagas una llama pequeña, generas una brisa breve, produces una chispa,
      enfrías o calientas levemente un objeto, formas escarcha superficial, haces ondular una pequeña cantidad de agua o
      agitas polvo, arena o pequeños fragmentos sueltos, etc. Estos efectos no pueden infligir daño, desplazar
      criaturas, crear cobertura, alterar terreno ni reproducir los efectos de otra carta.<br> - **Mano espectral:**
      Como Acción, creas una mano espectral flotante en un punto a distancia Cercana que dura 1 minuto. Puedes usar tu
      Interacción para mover la mano hasta 5 metros y hacer que manipule un objeto, abra una puerta o tire de una
      palanca. La mano no puede atacar ni activar objetos mágicos, y solo puede levantar hasta 5 Kg.
    slug: trucos-arcanos
  - id: 3997f12d630bad5c1e96a339afdb8c0567f1d609
    name: Moldeo Elemental
    level: 1
    type: efecto
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana
    uses:
      type: null
      qty: 0
    description: >-
      _Has aprendido a percibir la estructura fundamental de los elementos y a reorganizarla mediante la Urdimbre,
      alterando su forma y comportamiento sin cambiar su naturaleza._<br><br> Como Acción, eliges hasta 1 metro cúbico
      de agua, fuego, aire o materia mineral no mágica que puedas ver a distancia Cercana. Puedes manipularla de una de
      las siguientes formas:<br> - **Agua:** Puedes desplazarla lentamente hasta 3 metros, alterar su flujo, agitarla,
      aquietarla o hacer que adopte una forma simple. También puedes congelarla o descongelar hielo dentro del volumen
      permitido.<br> - **Tierra:** Puedes mover, excavar, compactar, aflojar o dar forma a tierra, arena, barro,
      arcilla, grava o piedra suelta. No puedes moldear directamente piedra sólida ni materiales manufacturados.<br> -
      **Fuego:** Puedes avivar, reducir, extinguir, desplazar o alterar la forma de una llama existente dentro del
      volumen permitido. No puedes crear fuego donde no exista una fuente de combustión.<br> - **Aire:** Puedes generar
      o redirigir corrientes de aire dentro del volumen permitido, suficientes para mover humo, niebla, vapores, polvo u
      objetos Diminutos que no estén asegurados.<br> Los cambios que puedan mantenerse naturalmente permanecen después
      de la manipulación, como tierra excavada, agua congelada o una llama extinguida. Cualquier forma o movimiento que
      requiera sostenerse mágicamente termina al inicio de tu próximo turno, salvo que vuelvas a utilizar esta carta
      para mantenerlo.<br> Esta carta no puede utilizarse para infligir daño directamente, desplazar criaturas, imponer
      estados ni transformar una sustancia en otra diferente.
    slug: moldeo-elemental
  - id: e6dd796221eaecac504f9d928e19651064802215
    name: Descarga Elemental
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 3
    description: >-
      _Canalizas la energía pura de los elementos en un proyectil inestable que lanzas contra tus oponentes._<br><br>
      Eliges un tipo de daño: Fuego, Frío o Eléctrico. Realizas un ataque de conjuro (1d8e + Atributo Arcano) a
      distancia Cercana contra un objetivo. Si impactas, infliges 1d8 de daño del tipo elegido.
    slug: descarga-elemental
  - id: 351aec8119cb212a3354ab9229ec09bc4e97130e
    name: Rayo Entrópico
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 3
    description: >-
      _Proyectas un haz de energía oscura y corrosiva que marchita la vitalidad de tu objetivo.._<br><br> Realizas un
      ataque de conjuro (1d8e + Atributo Arcano) a distancia Cercana contra un objetivo.<br> Si impactas, infliges 1d6
      de daño Necrótico y el objetivo no puede recuperar Puntos de Salud hasta el final de tu próximo turno.
    slug: rayo-entropico
  - id: 85aadf739b6f4645e5a6efb2ae99a3592129326a
    name: Comprender Lenguas
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 4
    description: >-
      _Sintonizas tu mente con las estructuras universales del pensamiento, permitiéndote descifrar cualquier
      comunicación._<br><br> Durante 1 hora, obtienes la capacidad de comprender el significado literal de cualquier
      lenguaje hablado que escuches y cualquier texto escrito que leas. Este efecto no te permite hablar ni escribir en
      idiomas que no conoces.
    slug: comprender-lenguas
  - id: b6a69767095559ee434f15d81faa040f1b4b7624
    name: Alarma Mágica
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 4
    description: >-
      _Tejes una red de hilos invisibles de poder arcano que te alertan ante cualquier intrusión en tu
      territorio._<br><br> Creas una alarma mágica e invisible que protege un área a tu elección dentro de una distancia
      Cercana. El área protegida no puede ser mayor a un cubo de 5 metros de lado y la alarma permanece activa durante 8
      horas.<br> Al lanzar el conjuro, designas cualquier número de criaturas que no activarán la alarma. También eliges
      si la alarma será audible o mental:<br> - **Alarma Audible:** Una campana espectral suena con fuerza durante 6
      segundos. El sonido puede oírse a una distancia de hasta 20 metros.<br> - **Alarma Mental:** Recibes un pulso de
      alerta en tu mente si te encuentras a menos de 1 kilómetro de la alarma. La alerta te despierta si estás
      durmiendo.<br> La alarma se activa si cualquier criatura que no hayas designado como segura entra en el área
      protegida.
    slug: alarma-magica
  - id: 910d28eeaef78e9279233c7ff30ee21157e18a9f
    name: Visión Arcana
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 4
    description: >-
      _Tus ojos resplandecen con un brillo místico que revela las corrientes ocultas de la magia a tu
      alrededor._<br><br> Durante 10 minutos, puedes percibir un aura tenue alrededor de cualquier criatura u objeto
      visible a distancia Cercana que porte magia.<br> Además, como Acción, mientras dure el efecto, puedes concentrarte
      en un objeto, criatura o área visible a distancia Inmediata. Tras 1 minuto de análisis ininterrumpido, realizas
      una Prueba de Atributo Arcano (Conocimiento Arcano) para desvelar la naturaleza de cualquier magia presente.<br>
      El Nivel de Dificultad (ND) lo establece el DJ, basándose en el poder de la magia.<br> - **Con un Éxito:**
      Aprendes la función general de la fuente de magia.<br> - **Con un Éxito Excepcional:** Obtienes información
      detallada, como las propiedades exactas de un objeto mágico o el nombre del conjuro activo.
    slug: vision-arcana
  - id: 8f75b7197e75e847564e7637f9b63aab55a4fec2
    name: Coraza Vital
    level: 1
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana
    uses:
      type: RELOAD
      qty: 4
    description: >-
      _Envuelves tu cuerpo en una coraza espectral de energía defensiva que mitiga los golpes antes de que alcancen tu
      carne._<br><br> Durante 1 hora, obtienes una cantidad de Puntos de Salud temporales igual 1d4 + tu Atributo
      Arcano.
    slug: coraza-vital
