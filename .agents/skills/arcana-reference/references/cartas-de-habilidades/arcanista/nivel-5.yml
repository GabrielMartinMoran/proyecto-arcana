cards:
  - id: cc697a7198fa8190d24b289527f2d1085768ef9e
    name: Rayo Desintegrador
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 8
    description: >-
      _Un haz de energía verde esmeralda brota de tu dedo para reducir la materia de tu objetivo a cenizas._<br><br>
      Elije un objetivo a distancia Media. Este debe superar una TS de Reflejos (ND 5 + Atributo Arcano). Si falla,
      recibe 10d8 de daño de Fuerza. Si tiene éxito, la mitad.<br> Si el daño reduce al objetivo a 0 Puntos de Salud, se
      convierte en un fino polvo gris y es destruido.
    slug: rayo-desintegrador
  - id: 075cbfbb288ae86c9c2addfa181d7d49735100a8
    name: Maestría Arcana
    level: 5
    type: efecto
    tags:
      - Arcanista
    requirements: Teoría Arcana Avanzada & Atributo Arcano 6
    uses:
      type: null
      qty: 0
    description: >-
      _Tu control sobre el flujo de la magia es tan absoluto que reciclar la energía de tus conjuros se vuelve un acto
      natural._<br><br> Una vez por turno, cuando lanzas un conjuro de Arcanista de Nivel 2 o inferior que tenga un
      sistema de Recarga, puedes tirar 2 veces el dado de recarga para ese conjuro y quedarte con el resultado más alto.
    slug: maestria-arcana
  - id: c66e21de47f990391825dad62eecb51918ad614b
    name: "Palabra de Poder: Aturdir"
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Sugestión Mayor & Atributo Arcano 6
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Pronuncias una palabra de poder cargada de una vibración arcana tan intensa que colapsa los sentidos de tu
      víctima._<br><br> Eliges una criatura que puedas ver a distancia Cercana. Si la criatura tiene 100 Puntos de Salud
      o menos, queda Aturdida. Al final de cada uno de sus turnos, la criatura puede realizar una TS de Instinto (ND 7 +
      Atributo Arcano) para terminar el efecto.
    slug: palabra-de-poder-aturdir
  - id: d7c6414cfc87ec48fa4ea8e136af8fabe0bcd778
    name: Legión de los Condenados
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana & Atributo Arcano 6
    uses:
      type: RELOAD
      qty: 8
    description: >-
      _Abres las puertas del inframundo por un segundo, liberando una marea de espectros aullantes que arrasan con todo
      a su paso._<br><br> Liberas un cono de 10 metros de espíritus atormentados.<br>
       Las criaturas en el área deben superar una TS de Instinto (ND 5 + Atributo Arcano). Si fallan, reciben 6d6 de daño Necrótico y quedan Asustadas y Ensordecidas hasta el final de tu próximo turno. Si tienen éxito, reciben la mitad del daño y no sufren efectos adicionales.
    slug: legion-de-los-condenados
  - id: 330daa743f1bf6974b430f37d97a737279479ff6
    name: Lluvia de Meteoritos
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana & Atributo Arcano 6
    uses:
      type: RELOAD
      qty: 8
    description: >-
      _Desgarras el cielo y haces caer fragmentos incandescentes que impactan la tierra con una violencia
      catastrófica._<br><br> Como Acción, eliges hasta tres puntos que puedas ver a distancia Larga. Un meteorito
      impacta en cada uno, provocando una explosión de 3 metros de radio.<br> Toda criatura alcanzada debe realizar una
      TS de Reflejos (ND 5 + Atributo Arcano). Si falla, recibe 4d6 de daño Contundente y 4d6 de daño de Fuego. Si tiene
      éxito, recibe la mitad del daño total.<br> Las áreas de impacto pueden superponerse, pero una criatura solo puede
      recibir el daño de esta carta una vez por lanzamiento.<br> Los impactos incendian materiales fácilmente
      inflamables y pueden destruir objetos y estructuras vulnerables a discreción del DJ.
    slug: lluvia-de-meteoritos
  - id: 835e4a2725ba7ab33a46235ccfe5bbdd7a9ee6f5
    name: "Palabra de Poder: Matar"
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana & Atributo Arcano 6
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Pronuncias una palabra primordial cuyo significado no describe la muerte: la ordena._<br><br> Como Acción, eliges
      una criatura que puedas ver a distancia Cercana. Si posee 50 Puntos de Salud o menos, muere inmediatamente.<br> Si
      posee más de 60 Puntos de Salud, la palabra no tiene efecto.<br> Este efecto no inflige daño y, por lo tanto, no
      puede ser reducido mediante Mitigación, Resistencias u otros efectos que reduzcan daño.
    slug: palabra-de-poder-matar
