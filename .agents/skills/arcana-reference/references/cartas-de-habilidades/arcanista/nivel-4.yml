cards:
  - id: 951eaba4cd2d3d8ca52470c14746b8ed7706a1ee
    name: Barrera de Fuerza
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Levantas un muro de energía pura e invisible que bloquea el paso de cualquier proyectil o criatura._<br><br>
      Creas una pared plana, delgada e invisible de energía arcana a distancia Cercana. La pared puede tener hasta 15
      metros de largo y 5 de alto, o puede ser una cúpula de 4m de radio. La barrera es inmune a todo daño físico, pero
      es destruida automáticamente por efectos mágicos de desintegración y puede ser terminada prematuramente por
      efectos de disipación mágica. Dura hasta 10 minutos.
    slug: barrera-de-fuerza
  - id: 0961c75583ed34708eeece610e38a9b579405b39
    name: Pliegue Espacial
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Paso Brumoso & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Perforas el tejido de la realidad para conectar dos puntos distantes mediante portales gemelos._<br><br> Eliges
      dos puntos en superficies sólidas que puedas ver a distancia Larga. En cada punto, aparece un portal circular de 3
      metros de diámetro. Los portales están intrínsecamente conectados; cualquier cosa que entre por uno, sale
      instantáneamente por el otro. Son una puerta de dos vías que permanece abierta mientras te concentres, hasta por 1
      minuto.
    slug: pliegue-espacial
  - id: fee4f116d1923702f1e81c9431cd0edafe2c2b78
    name: Dominio Elemental
    level: 4
    type: efecto
    tags:
      - Arcanista
    requirements: Atributo Arcano 5
    uses:
      type: null
      qty: 0
    description: >-
      _Has alcanzado una comprensión tan profunda de un elemento que tus conjuros del mismo tipo se vuelven más
      letales._<br><br> Al adquirir esta carta, elige un tipo de daño: Fuego, Frío o Eléctrico. Ganas los siguientes
      beneficios para conjuros de Arcanista de ese tipo:<br> - Puedes volver a tirar cualquier dado de daño que resulte
      en un 1 (debes usar el nuevo resultado).<br> - El ND de tus conjuros que hagan daño de este tipo aumenta en 1.
    slug: dominio-elemental
  - id: 56fa481aa45d4ba12f63605d71723c8923e2b15d
    name: Sugestión Mayor
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Maledicción & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Implantas una idea en la mente de un humanoide, forzándolo a seguir tus órdenes como si fueran propias._<br><br>
      Como Acción, eliges a una criatura humanoide a distancia Media. Debe superar una TS de Instinto (ND 5 + Atributo
      Arcano). Si falla, le das una orden que pueda completar en los próximos 10 minutos (ej: "protege este
      puente").<br> La orden no puede ser obviamente dañina para si mismo. La criatura obedece lo mejor que puede
      mientras mantengas la concentración.
    slug: sugestion-mayor
  - id: 22ed0c83910d74ba019eb784f7424622df86612f
    name: Sobrecarga Arcana
    level: 4
    type: efecto
    tags:
      - Arcanista
    requirements: Afinidad Arcana & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Fuerzas los límites de tu poder para saturar tus conjuros más simples con una potencia devastadora._<br><br> Tu
      dominio de la magia te permite saturar los conjuros simples con un poder devastador.<br> Cuando lanzas una carta
      con las etiquetas _Arcanista_ y _Conjuro_ de Nivel 1 o 2 que inflija daño, puedes usar tu Interacción para
      sobrecargar el lanzamiento. Si lo haces, duplicas la cantidad de dados de daño del conjuro.
    slug: sobrecarga-arcana
  - id: 016e5895a908e37a73c37aa26d6c1c42335c024c
    name: Segador Incorpóreo
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 5
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Desgarras el velo para conjurar a un verdugo espectral envuelto en mortajas, armado con una guadaña de
      sombra._<br><br> Invocas una entidad incorpórea que ocupa un espacio Mediano a distancia Cercana durante 1
      minuto.<br> El segador es invulnerable, pero no bloquea el paso.<br> Cuando lanzas el conjuro, y en cada uno de
      tus turnos subsiguientes usando tu Interacción, puedes ordenar al Segador que se mueva hasta 10 metros en
      cualquier dirección y realice un ataque de conjuro cuerpo a cuerpo (1d8e + Atributo Arcano) contra un enemigo a
      distancia Inmediata a él. Si impacta, inflige 2d8 de daño Necrótico y el objetivo no puede recuperar Puntos de
      Salud hasta el inicio de tu próximo turno.
    slug: segador-incorporeo
  - id: 94a6c6aa38af719963b6eba03b16bc0a773e8faf
    name: Escrutinio Arcano
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 5
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Tu sensor arcano deja de estar limitado por la distancia visible: buscas un hilo conocido en la Urdimbre y
      observas aquello que se encuentra en el otro extremo._<br><br> Como Acción, comienzas un escrutinio que requiere
      10 minutos de concentración ininterrumpida. Al finalizar, eliges una criatura que conozcas o un lugar concreto del
      mismo plano cuya ubicación puedas identificar razonablemente.<br> Creas un sensor invisible e intangible a
      distancia Inmediata del objetivo o en un punto apropiado del lugar elegido. Durante un máximo de 10 minutos, ves y
      oyes a través de él como si estuvieras allí.<br> Si eliges una criatura, esta realiza una TS de Instinto (ND 5 +
      Atributo Arcano):<br> - Si apenas la conoces o solo dispones de una descripción, obtiene Ventaja (+1d4) en la
      tirada.<br> - Si la conoces personalmente, realiza la tirada normalmente.<br> - Si posees un objeto íntimamente
      vinculado a ella —como una posesión personal importante, un mechón de cabello o una muestra similar— realiza la
      tirada con Desventaja (-1d4).<br> Si supera la TS, el conjuro falla y no obtienes información sobre su
      ubicación.<br> El sensor puede ser detectado mediante efectos capaces de percibir magia o criaturas invisibles.
    slug: escrutinio-arcano
