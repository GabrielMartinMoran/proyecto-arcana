cards:
  - id: 7241423d7b11c3f58ccca3908655a2ee6ebcac2b
    name: Distorsión Singular
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Estudios Mágicos & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Manipulas las leyes fundamentales de la física para crear una perturbación que altera el tiempo o la gravedad en
      un punto._<br><br> Al lanzar el conjuro, elije un punto a distancia Media. En un radio de 3 metros del punto
      elegido, aplicas uno de los siguientes efectos:<br> - **Colapso Gravitatorio:** La gravedad del área se vuelve
      gigantesca y su fuerza tira en dirección al punto que elegiste. Toda criatura en el área debe superar una TS de
      Cuerpo (ND 5 + Atributo Arcano). Si falla, recibe 4d6 de daño de Fuerza, es arrastrada violentamente al centro de
      la esfera y queda Derribada.<br> - **Éxtasis Temporal:** El tiempo se congela y se fractura. Toda criatura en el
      área debe superar una TS de Mente (ND 5 + Atributo Arcano). Si falla, recibe 4d6 de daño de Fuerza, su Velocidad
      se reduce a la mitad y pierde la capacidad de usar Reacciones hasta el final de tu próximo turno.<br> En ambos
      casos, si la criatura tiene éxito en la salvación, recibe la mitad del daño y no sufre los efectos secundarios.
    slug: distorsion-singular
  - id: 87e3747d82965a6738f286e8604c7bee64a56b75
    name: Explosión Elemental
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Descarga Elemental & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Generas una detonación masiva de energía en la distancia, devastando una amplia zona del campo de
      batalla._<br><br> Provocas una explosión mágica en una esfera de 5 metros de radio a distancia Larga. Todas las
      criaturas en el área deben superar una TS de Reflejos (ND 5 + Atributo Arcano). Si tienen éxito, reciben la mitad
      del daño y evitan los efectos secundarios.<br> Al lanzar el conjuro, eliges la forma que adopta:<br> - **Bola de
      Fuego (Fuego):** Una explosión naranja rugiente que incinera objetos inflamables y provoca 5d6 de daño de
      fuego.<br> - **Nova de Escarcha (Frío):** Un estallido azulado que congela líquidos y provoca 4d6 de daño de frío.
      Las criaturas que fallen la TS ven reducida su Velocidad a la mitad hasta el final de su próximo turno.<br> -
      **Tormenta Estática (Eléctrico):** Un trueno ensordecedor que rompe objetos de cristal y provoca 4d6 de daño
      eléctrico. Las criaturas que fallen la TS no pueden usar Reacciones hasta el final de su próximo turno.<br>
    slug: explosion-elemental
  - id: 69ffc982e08653780c89c0f61c7ed8a0a1886fc4
    name: Volar
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Anulas los efectos de la gravedad sobre una criatura, permitiéndole surcar los cielos con la gracia de un
      ave._<br><br> Tocas a una criatura voluntaria. Obtiene una velocidad de vuelo igual a su Velocidad normal durante
      10 minutos o hasta que pierdas la concentración.<br> Cuando el conjuro termina, la criatura cae suavemente al
      suelo.
    slug: volar
  - id: ca2f1342b6abc713bab578037114d9fef5d534b3
    name: Círculo de Protección
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
      - Ritual
    requirements: Barrera Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Trazas un perímetro místico en el suelo que actúa como una barrera infranqueable para ciertos tipos de
      seres._<br><br> Creas un círculo mágico de 3 metros de radio en el suelo que dura 10 minutos. Elige un tipo de
      criatura (no-muertos, demonios, etc.). Para poder entrar al círculo, una criatura del tipo elegido debe superar
      una tirada de Instinto (ND 5 + Atributo Arcano). Además, los aliados dentro del círculo tienen Ventaja (+1d4) en
      las Tiradas de Salvación contra efectos de criaturas del tipo declarado.
    slug: circulo-de-proteccion
  - id: b69c525cc94b4541a6e990945599704313ca2100
    name: Ráfaga Aniquiladora
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Lanzas proyectiles de fuerza pura en una secuencia frenética, manteniendo el ataque mientras tu voluntad
      aguante._<br><br> Realizas un ataque de conjuro a distancia (1d8e + Atributo Arcano) contra un objetivo. Si
      impactas, el objetivo recibe 1d10 de daño de Fuerza y puedes repetir el ataque, pero la siguiente tirada de ataque
      sufre un -1 acumulativo. Puedes continuar atacando de esta manera, acumulando un -1 por cada golpe adicional,
      hasta que falles una tirada de ataque o decidas detener la ráfaga.
    slug: rafaga-aniquiladora
  - id: 1a182f6d4ecebc5ff5890fc95300cdc7a6ab721e
    name: Transmutar Materia
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Alteras la estructura de la materia inerte, deformándola como arcilla o reorganizándola para crear nuevas
      herramientas y estructuras._<br><br> Al utilizar este conjuro, eliges uno de los siguientes modos:<br> -
      **Transmutar:** Como Acción, tocas un objeto no mágico de hasta 1 metro cúbico. Durante 1 hora, puedes alterar una
      de sus propiedades físicas —como dureza, peso o textura— o modificar su forma. No puedes cambiar su masa total ni
      transformar una sustancia en otra distinta. Por ejemplo, puedes ablandar una cerradura metálica como si fuera
      cera, volver quebradiza una sección de piedra o esculpir una palanca a partir de un trozo de metal.<br> -
      **Fabricar:** Como Acción, reorganizas una cantidad de materia prima no mágica que puedas tocar y que ocupe como
      máximo 1 metro cúbico, convirtiéndola en uno o varios objetos terminados compuestos principalmente por esos mismos
      materiales. La masa total no cambia. Puedes fabricar objetos corrientes cuya construcción comprendas, pero los
      mecanismos de precisión, obras artesanales especializadas o dispositivos complejos requieren que poseas el
      conocimiento o la habilidad apropiada. No puedes crear sustancias alquímicas, seres vivos, objetos mágicos ni
      transformar materiales de menor valor en otros de mayor valor.<br> Puedes utilizar _Fabricar_ de esta forma
      únicamente si el objeto terminado pertenece a la categoría de precio Mundano. Los objetos de categorías superiores
      solo pueden fabricarse lanzando el conjuro como Ritual. En ese caso, el tiempo de lanzamiento aumenta según la
      categoría de precio final del objeto.:<br> &nbsp;&nbsp;&nbsp;&nbsp;• _Mundano:_ 10 minutos<br>
      &nbsp;&nbsp;&nbsp;&nbsp;• _Común:_ 1 hora<br> &nbsp;&nbsp;&nbsp;&nbsp;• _Calidad:_ 24 horas<br> La categoría
      máxima de precio que puedes fabricar con este conjuro es de Calidad.
    slug: transmutar-materia
  - id: cd63e5dfc4095d0e5360d1565ab15194dc52cb51
    name: Visión Remota
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Creas un sensor místico invisible que actúa como una extensión de tus propios sentidos en la distancia._<br><br>
      Al lanzar el conjuro, elije un punto que puedas ver a distancia Media, donde aparece el sensor. Este esta
      compuesto de energía y no puede atravesar objetos sólidos. En tus turnos, puedes usar tu Acción para mover el
      sensor hasta 10 metros. Ves y oyes a través del sensor. El sensor es detectable con magia o visión especial. Dura
      10 minutos.
    slug: vision-remota
  - id: 59d7d61b1cb422ee678e04476bb1d3a9a32d0bc2
    name: Santuario Arcano
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: LONG_REST
      qty: 1
    description: >-
      _Eriges una cúpula de protección que actúa como un refugio seguro frente a los ataques del exterior._<br><br>
      Trazas un círculo en el suelo, del que brota una cúpula de energía opaca desde fuera pero transparente desde
      dentro, de 3 metros de radio. Dura 8 horas. Las criaturas que designes al lanzar el conjuro pueden usar una Acción
      para entrar o salir. Si tú, el lanzador, sales, el conjuro termina. Cualquier ataque o conjuro dirigido a la
      cúpula debe superar una Esquiva de 9. Si impacta, la cúpula realiza una Tirada de Salvación de Mente con tu
      bonificador (1d8 + Atributo Arcano) contra el daño del ataque. Si la salvación falla, el ataque atraviesa la
      barrera.
    slug: santuario-arcano
  - id: 95f0c6f6d2e2080790ebf23c792fa4dbe0a0a58a
    name: Fosa de los Lamentos
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _El suelo se pudre y se vuelve fangoso, vomitando cientos de manos esqueléticas que arrastran a los vivos hacia la
      tumba._<br><br> Eliges un punto a distancia Media, creando un área de terreno difícil en un radio de 3 metros
      durante 1 minuto.<br> Toda criatura que entre en el área o empiece su turno allí debe superar una TS de Reflejos
      (ND 5 + Atributo Arcano). Si falla, recibe 2d6 de daño Necrótico y queda Inmovilizada hasta el inicio de su
      próximo turno mientras los huesos tiran de ella. Si tiene éxito, recibe la mitad del daño y no queda atrapada.
    slug: fosa-de-los-lamentos
  - id: 90ae85bbd2fe30a58c0ba84501d35ad63a4e92f2
    name: Niebla de Putrefacción
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 5
    description: >-
      _Exhalas una espesa nube de gas amarillo y verdoso que corroe la carne y nubla los sentidos._<br><br> Creas una
      esfera de 5 metros de radio en un punto a distancia Media.<br> El área queda fuertemente oscurecida (bloquea la
      visión) durante 1 minuto.<br> Cualquier criatura que empiece su turno en el interior de la nube debe superar una
      TS de Cuerpo (ND 5 + Atributo Arcano). Si falla, recibe 3d6 de daño de Ácido o Veneno (a tu elección al lanzar el
      conjuro) y sufre el estado Envenenado hasta el inicio de su próximo turno. Si tiene éxito, recibe la mitad del
      daño y no se envenena.
    slug: niebla-de-putrefaccion
  - id: c8f718b21f3d84efe608abdef245cc2a4d841b71
    name: Forma Gaseosa
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: Afinidad Arcana & Atributo Arcano 4
    uses:
      type: RELOAD
      qty: 6
    description: >-
      _Tu cuerpo pierde su consistencia y se dispersa en una nube de gas tenue que fluye por lugares donde la carne
      jamás podría pasar._<br><br> Como Acción, transformas tu cuerpo y todo el equipo que lleves en una forma gaseosa
      durante un máximo de 10 minutos o hasta que pierdas la Concentración.<br> Mientras permanezcas en esta forma:<br>
      - Puedes volar a una velocidad igual a la mitad de tu Velocidad normal.<br> - Puedes atravesar cualquier abertura
      por la que pudiera pasar humo o aire, aunque no puedes atravesar superficies completamente selladas.<br> - No
      puedes atacar, lanzar conjuros, activar habilidades, manipular objetos ni utilizar equipamiento.<br> - No puedes
      ser Inmovilizado o Enredado mediante ataduras, presas u obstáculos puramente físicos.
    slug: forma-gaseosa
