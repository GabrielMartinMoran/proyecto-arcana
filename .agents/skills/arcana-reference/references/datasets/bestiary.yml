      - name: Visión en la Oscuridad
        detail: >-
          El goblin puede ver en penumbra como si fuera luz tenue y en oscuridad
          como si fuera penumbra (sombras grises) hasta distancia Cercana.
    actions:
      - name: Curación de Hongos
        uses:
          type: RELOAD
          qty: 5
        detail: >-
          Como Acción, el chamán obliga a un aliado a distancia Inmediata a
          comer un hongo extraño. El aliado recupera 1d6 Puntos de Salud.
    reactions: []
    interactions:
      - name: Bendición de la Tribu
        detail: >-
          Como Interacción, el chamán chilla un cántico. Un aliado a distancia
          Cercana obtiene Ventaja (+1d4) en su próxima tirada de ataque.
    behavior: >
      El consejero espiritual de la tribu, cubierto de fetiches y huesos. Evita
      el combate directo, prefiriendo potenciar a los guerreros más fuertes con
      gritos frenéticos y curar sus heridas con brebajes dudosos. Si se queda
      solo, lanzará fuego desesperadamente.
    img: https://i.imgur.com/zKzwD2N.jpeg
    size: Pequeño
