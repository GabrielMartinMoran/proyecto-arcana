          distancia contra él se realiza con Desventaja.
    behavior: >
      Un matón pragmático que lucha por dinero, no por gloria. Analiza el campo
      de batalla en busca del objetivo más rentable (el que lleva mejor equipo)
      o el menos defendido. No dudará en usar a un compañero como escudo humano
      o en pedir clemencia si el combate se vuelve en su contra.
