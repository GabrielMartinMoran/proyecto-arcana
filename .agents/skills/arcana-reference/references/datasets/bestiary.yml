      Un depredador ancestral, inteligente y brutalmente poderoso. Combina
      ataques físicos devastadores con superioridad aérea y utiliza su Aliento
      cuando puede alcanzar a varios enemigos a la vez.


      En su turno alterna entre Asalto Dracónico, Aliento Dracónico y Presencia
      Aterradora según la situación. Prefiere utilizar el miedo al inicio del
      combate o cuando necesita recuperar el control del campo, mientras reserva
      el Aliento para grupos bien posicionados.


      Utiliza Batir Alas para apartar enemigos que logren rodearlo y recuperar
      una posición favorable.


      Cuando se utiliza como jefe con Reacciones adicionales, aprovecha
      Reposicionarse para dominar el espacio aéreo y Ataque Rápido para realizar
      Mordidas o Garras individuales entre los turnos enemigos.
