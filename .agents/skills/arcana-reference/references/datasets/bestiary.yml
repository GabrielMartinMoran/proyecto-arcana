      - name: Asalto Dracónico
        detail: El Dragón realiza un ataque de Mordida y dos ataques de Garra.
      - name: Aliento Dracónico
        uses:
          type: RELOAD
          qty: 6
        detail: >
          El Dragón exhala energía correspondiente a su Afinidad Dracónica.


          Las criaturas afectadas deben superar una Tirada de Salvación de
          Reflejos (ND 14). Si fallan, reciben 10d6 de daño del tipo
          correspondiente; con éxito, reciben la mitad.


          Si su Afinidad utiliza un cono, afecta un cono de 8 metros. Si utiliza
          una línea, afecta una línea de 12 metros de largo y 2 metros de ancho.
      - name: Presencia Aterradora
        uses:
          type: RELOAD
          qty: 5
        detail: >
          El Dragón despliega toda la magnitud de su presencia. Cada enemigo a
          distancia Cercana que pueda verlo u oírlo debe superar una Tirada de
          Salvación de Instinto (ND 14).


          Si falla, queda Asustado durante 1 minuto. Al final de cada uno de sus
          turnos puede repetir la Tirada de Salvación, terminando el efecto
          sobre sí mismo si tiene éxito.


          Una criatura que supere cualquiera de estas Tiradas de Salvación no
          puede volver a ser afectada por la Presencia Aterradora de ese Dragón
          durante 24 horas.
    reactions:
      - name: Batir Alas
        detail: >
          Cuando una criatura termine su turno a distancia Inmediata del Dragón,
          este puede usar su Reacción para batir violentamente sus alas.


          La criatura debe superar una Tirada de Salvación de Reflejos (ND 14).
          Si falla, queda Derribada y es empujada 3 metros.


          Después, el Dragón puede moverse hasta 3 metros volando sin provocar
          Reacciones por este movimiento.
