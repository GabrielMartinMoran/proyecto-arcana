          El Dragón posee una afinidad determinada por su color, que define el
          tipo de daño de su Aliento y el daño al que es inmune:

          - Rojo: Fuego. Aliento en cono.

          - Azul: Eléctrico. Aliento en línea.

          - Verde: Veneno. Aliento en cono.

          - Negro: Ácido. Aliento en línea.

          - Blanco: Frío. Aliento en cono.
      - name: Inmunidad al Daño
        detail: >-
          El Dragón es inmune al tipo de daño indicado por su Afinidad
          Dracónica.
      - name: Voluntad Dracónica
        detail: >-
          El Dragón obtiene Ventaja (+1d4) en Tiradas de Salvación contra
          efectos que podrían dejarlo Encantado.
      - name: Vuelo Dracónico
        detail: >-
          El Dragón posee una velocidad de Vuelo de 16 metros y puede mantenerse
          en el aire mientras tenga espacio suficiente para maniobrar.
