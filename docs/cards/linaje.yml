cards:
  # ------------------------------ LINAJES ------------------------------
  # ------------------------------ HUMANO ------------------------------
  - name: Talento de Familia
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    description: >-
      _Las lecciones de tu hogar y tu crianza te han dejado marcas imborrables que aplicas instintivamente en tu día a día._<br><br>
      Elige tres habilidades (como Atletismo, Persuasión, etc.) que representen tu crianza. Obtienes Ventaja (+1d4) en todas las pruebas relacionadas con esas tres habilidades.
    uses:
      type: null
      qty: 0
  - name: Enfoque Adaptable
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    description: >-
      _Tu mente es flexible y se adapta rápidamente a nuevos desafíos._<br><br>
      Adquieres los siguientes beneficios:<br>
      - Una vez por día de descanso, puedes tomarte 10 minutos para cambiar una de tus cartas activas por otra de tu Colección.<br>
      - Una vez por día de descanso, puedes utilizar una carta Activable de **Nivel 1 o 2** que no tengas activada pero que poseas en tu Colección.
    uses:
      type: null
      qty: 0
  - name: Líder Nato
    level: 1
    type: efecto
    tags:
      - Linaje
      - Humano
    requirements: Solo Creación de Personaje
    description: >-
      _Tu presencia inspira confianza y coordinación en el campo de batalla._<br><br>
      Cuando usas la acción de Ayuda para otorgar Ventaja a un aliado en una prueba de habilidad o tirada de ataque, ese aliado también suma un +1 al resultado final de su tirada.
    uses:
      type: null
      qty: 0
  # ------------------------------ ELFO ------------------------------
  - name: Gracia Élfica
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    description: >-
      _Te mueves y reaccionas al peligro con una celeridad antinatural, anticipando las amenazas antes de que se manifiesten._<br><br>
      Tu velocidad de movimiento aumenta en 1 metro, obtienes Ventaja (+1d4) en todas tus tiradas de Iniciativa, y no pueden sorprenderte mientras estás consciente.
    uses:
      type: null
      qty: 0
  - name: Trance Élfico
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    description: >-
      _Tu linaje te conecta con un estado de conciencia profunda capaz de restaurar tu cuerpo y tus energías._<br><br>
      No necesitas dormir. Puedes entrar en un estado de meditación durante 4 horas para obtener los beneficios de un día de descanso. Además, la magia y los venenos no pueden dormirte.<br>
      Además, al finalizar tu trance, elige una habilidad en la que no tengas Ventaja. Adquieres Ventaja (+1d4) en pruebas relacionadas esa habilidad.
    uses:
      type: null
      qty: 0
  - name: Mirada Estelar
    level: 1
    type: efecto
    tags:
      - Linaje
      - Elfo
    requirements: Solo Creación de Personaje
    description: >-
      _Tus ojos ven más allá de la simple luz y la sombra._<br><br>
      Obtienes Visión en la Oscuridad hasta distancia Cercana.<br>
      Además, puedes usar tu Acción para abrir tus sentidos al mundo invisible durante 1 minuto, volviéndote consciente de la presencia y ubicación de cualquier criatura invisible o escondida a 10 metros de ti. Puedes usar esta habilidad un número de veces igual a tu puntuación de Mente por día de descanso.
    uses:
      type: null
      qty: 0
  # ------------------------------ ENANO ------------------------------
  - name: Sangre Resistente
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    description: >-
      _Tu herencia te otorga una constitución inquebrantable. Tu sangre purga las toxinas con facilidad y tu capacidad para sobreponerte al dolor físico es legendaria._<br><br>
      Obtienes Ventaja (+1d4) en Tiradas de Salvación de Cuerpo contra venenos y enfermedades.<br>
      Además, tu capacidad para sobreponerte al dolor es legendaria. Una vez por día de descanso, al final de tu turno, si estás bajo un efecto causado por una Tirada de Salvación de Cuerpo fallida, y dicho efecto permita realizar otra Tirada de Salvación de Cuerpo para finalizarlo, puedes terminar el efecto sobre ti inmediatamente.
    uses:
      type: null
      qty: 0
  - name: Acorazado
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    description: >-
      _Estás acostumbrado a la carga y el peso de las armaduras._<br><br>
      El requisito de Cuerpo de cualquier armadura que vistas se reduce en 1 (hasta un mínimo de 1).
    uses:
      type: null
      qty: 0
  - name: Eco de la Roca
    level: 1
    type: efecto
    tags:
      - Linaje
      - Enano
    requirements: Solo Creación de Personaje
    description: >-
      _Tu conexión con la piedra es tan profunda que puedes sentir las vibraciones a través de ella._<br><br>
      Obtienes Visión en la Oscuridad hasta distancia Cercana.<br>
      Además, mientras estés en contacto con una superficie de piedra o tierra, puedes usar tu Interacción para "escuchar" el suelo. Hasta el inicio de tu próximo turno, eres consciente de la ubicación y movimiento de cualquier criatura en contacto con la misma superficie a 10 metros de ti. Puedes usar esta habilidad un número de veces igual a tu puntuación de Instinto por día de descanso.
    uses:
      type: null
      qty: 0
  # ------------------------------ GNOMO ------------------------------
  - name: Mente Curiosa
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
    requirements: Solo Creación de Personaje
    description: >-
      _Tu mente nunca deja de trabajar._<br><br>
      Cuando realizas una prueba de Mente para recordar información sobre historia, conocimiento arcano o para investigar algo y fallas la tirada, aun así obtienes una pieza de información verdadera, aunque incompleta o críptica, a discreción del DJ.
    uses:
      type: null
      qty: 0
  - name: Paso Escurridizo
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
      - Reacción
    requirements: Solo Creación de Personaje
    description: >-
      _Eres excepcionalmente difícil de acorralar._<br><br>
      Cuando un enemigo te falla un ataque cuerpo a cuerpo, puedes usar tu Reacción para moverte una distancia en metros igual a la mitad de tu puntuación de Reflejos (redondeando hacia arriba). Este movimiento no provoca ataques de oportunidad.
    uses:
      type: null
      qty: 0
  - name: Parpadeo Ilusorio
    level: 1
    type: efecto
    tags:
      - Linaje
      - Gnomo
      - Reacción
    requirements: Solo Creación de Personaje
    description: >-
      _Eres un maestro en el arte de la distracción._<br><br>
      Obtienes Visión en la Oscuridad hasta distancia Cercana.<br>
      Además, cuando un enemigo declara un ataque contra ti pero antes de que realice la tirada, puedes usar tu Reacción para crear una breve ilusión de ti mismo. El enemigo debe superar una TS de Instinto (ND 5 + Mente). Si falla, el ataque se redirige a la ilusión y falla. Puedes usar esta habilidad un número de veces igual a tu puntuación de Mente por día de descanso.
    uses:
      type: null
      qty: 0
  # ------------------------------ MEDIANO ------------------------------
  - name: Afortunado
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
    requirements: Solo Creación de Personaje
    description: >-
      _El destino parece sonreírte incluso en tus peores momentos, convirtiendo los tropiezos en nuevas oportunidades._<br><br>
      Cuando sacas un 1 natural en una tirada de un dado que pueda explotar, ganas un Punto de Suerte.
    uses:
      type: null
      qty: 0
  - name: Pies Ligeros
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
    requirements: Solo Creación de Personaje
    description: >-
      _Eres un experto en escurrirte por los lugares mas estrechos y pasar desapercibido._<br><br>
      Puedes moverte a través del espacio de cualquier criatura que sea de un tamaño mayor que el tuyo. Además, puedes intentar esconderte (usar la habilidad de Sigilo) incluso cuando solo te oculta una criatura aliada que sea más grande que tú.
    uses:
      type: null
      qty: 0
  - name: Compartir Fortuna
    level: 1
    type: efecto
    tags:
      - Linaje
      - Mediano
      - Reacción
    requirements: Solo Creación de Personaje
    description: >-
      _Tu buena fortuna es tan grande que puedes compartirla._<br><br>
      Después de que un aliado a distancia Cercana que puedas ver realice una tirada de ataque, prueba de habilidad o tirada de salvación, puedes usar tu Reacción para gastar cualquier cantidad de tus Puntos de Suerte. El resultado de la tirada de tu aliado aumenta en +1 por cada Punto de Suerte que hayas gastado.
    uses:
      type: null
      qty: 0
  # ------------------------------ TIEFLING ------------------------------
  - name: Reprensión Infernal
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
      - Reacción
    requirements: Solo Creación de Personaje
    description: >-
      _Tu sangre infernal responde al dolor con una reprimenda infernal._<br><br>
      Cuando una criatura que puedas ver a distancia Cercana te inflige daño, puedes usar tu Reacción para desatar una descarga de Fuego, Frío o Electricidad contra ella (elijes el tipo de daño al escoger esta carta).<br>
      El atacante debe superar una Tirada de Salvación de Reflejos (ND 5 + Presencia). Si falla, recibe 1d6 de daño de Fuego. Si tiene éxito, recibe la mitad del daño.<br>
      Puedes usar esta habilidad un número de veces por día de descanso igual a tu puntuación de Presencia.
    uses:
      type: null
      qty: 0
  - name: Pacto de Sangre
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
    requirements: Solo Creación de Personaje
    description: >-
      _Tus tratos y acuerdos tienen un peso especial, sellados con la sangre de tu linaje._<br><br>
      Si una criatura hace un juramento verbal directamente contigo y lo sella con un gesto simbólico, se crea un vínculo entre ambos. Si esa criatura rompe el juramento, tú lo sabes instintivamente y puedes desatar una de las siguientes maldiciones sobre ella (la elección es permanente para ese traidor y no requiere acción para activarse):<br>
      - **Marca del Cazador:** Obtienes Ventaja (+1d4) en todas las tiradas de ataque que realices contra él.<br>
      - **Marca del Paria:** El traidor sufre Desventaja (-1d4) en todas las tiradas de ataque que realice contra ti.<br>
      - **Marca de la Debilidad:** Obtienes Ventaja (+1d4) en todas las pruebas de habilidad que realices contra él.<br>
      La marca dura hasta que el traidor repare su falta de una manera significativa (a discreción del DJ), o hasta que tú decidas liberarlo del juramento.
    uses:
      type: null
      qty: 0
  - name: Pacto Oscuro
    level: 1
    type: efecto
    tags:
      - Linaje
      - Tiefling
    requirements: Solo Creación de Personaje
    description: >-
      _Puedes hacer un pacto con tu propia sangre para forzar el destino cuando más lo necesites._<br><br>
      Obtienes Visión en la Oscuridad hasta distancia Cercana.<br>
      Además, una vez por día de descanso, puedes elegir sacar un 8 automático (sin explosión ni obtención de suerte) en el dado de una tirada de ataque, prueba de habilidad o tirada de salvación (puedes decidirlo después de ver el resultado del dado real).<br>
      Al hacerlo, obtienes un "Dado de Deuda" (un d6). Mientras tengas este dado, la próxima vez que debas realizar una tirada de ataque, prueba de habilidad o tirada de salvación, debes lanzar el Dado de Deuda junto con tu tirada normal.<br>
      - Si el Dado de Deuda resulta en un 1, tu tirada se considera un fallo crítico independientemente de tu resultado, y la deuda se salda (el dado se retira).<br>
      - Si el resultado es cualquier otro número, no ocurre nada adicional y conservas el Dado de Deuda para tu siguiente tirada.
    uses:
      type: null
      qty: 0
  # ------------------------------ GOLIATH ------------------------------
  - name: Fortaleza Rocosa
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    description: >-
      _Tu linaje de te ha dotado de una resistencia física excepcional._<br><br>
      Tu Salud máxima aumenta permanentemente en +3. Además, tienes Ventaja para resistir cualquier intento de ser Derribado o movido contra tu voluntad.
    uses:
      type: null
      qty: 0
  - name: Porte de Gigante
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    description: >-
      _Tu estatura y físico imponentes son un arma en sí mismos._<br><br>
      Puedes cargar el doble de peso de lo que podrías normalmente.<br>
      Además, una vez por turno, si te mueves por lo menos 5 metros para llegar a un enemigo de tamaño Grande o inferior y atacarlo, en caso de que el ataque impacte, puedes forzar al objetivo a superar una Tirada de Salvación de Cuerpo (ND 5 + Cuerpo) o caer Derribado.
    uses:
      type: null
      qty: 0
  - name: Adaptación Climática
    level: 1
    type: efecto
    tags:
      - Linaje
      - Goliath
    requirements: Solo Creación de Personaje
    description: >-
      _Tu linaje te ha adaptado a los entornos más extremos._<br><br>
      Al elegir este linaje, selecciona un clima: Frío o Calor. Obtienes Mitigación Mágica contra el daño del tipo elemental correspondiente (Frío o Fuego) igual a la mitad de tu puntuación de Cuerpo (redondeando hacia arriba). Además, no sufres los efectos negativos de las temperaturas extremas asociadas a tu clima elegido.
    uses:
      type: null
      qty: 0
  # ------------------------------ DRACÓNIDO ------------------------------
  - name: Mirada Dracónica
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    description: >-
      _Tus ojos brillan con una intensidad de otro mundo._<br><br>
      Obtienes Visión en la Oscuridad hasta distancia Cercana.<br>
      Adicionalmente, tu mirada refleja la ancestral sabiduría y poder de tu linaje. Al finalizar un día de descanso, eliges uno de los siguientes focos para tu mirada. Hasta tu próximo día de descanso, obtienes Ventaja (+1d4) en todas las pruebas de habilidad de la pericia elegida:<br>
      - **Foco del Terror:** Intimidación.<br>
      - **Foco de la Verdad:** Perspicacia.<br>
      - **Foco del Cazador:** Percepción.
    uses:
      type: null
      qty: 0
  - name: Herencia Draconiana
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    description: >-
      _Tu linaje te ha otorgado una resistencia innata al elementos que tus ancestros dominaban._<br><br>
      Al elegir esta carta, seleccionas un tipo de ancestro dracónico de la siguiente lista. Tus escamas te protegen contra la energía elemental de tu linaje, otorgándote Mitigación Mágica contra el tipo de daño asociado igual a tu puntuación de **Cuerpo**.<br>
      - **Rojo, Dorado o Latón:** Fuego<br>
      - **Azul o Bronce:** Eléctrico<br>
      - **Blanco o Plateado:** Frío<br>
      - **Negro o Cobre:** Ácido<br>
      - **Verde:** Veneno
    uses:
      type: null
      qty: 0
  - name: Castigo Elemental
    level: 1
    type: efecto
    tags:
      - Linaje
      - Dracónido
    requirements: Solo Creación de Personaje
    description: >-
      _Puedes canalizar la energía de tus ancestros para castigar a tus enemigos._<br><br>
      Al elegir esta carta, debes seleccionar un tipo de ancestro dracónico de la siguiente lista para determinar tu tipo de daño.<br>
      - **Rojo, Dorado o Latón:** Fuego<br>
      - **Azul o Bronce:** Eléctrico<br>
      - **Blanco o Plateado:** Frío<br>
      - **Negro o Cobre:** Ácido<br>
      - **Verde:** Veneno<br>
      Cuando impactas a un objetivo con un ataque cuerpo a cuerpo, puedes decidir imbuir el golpe con energía elemental, infligiendo 1d6 de daño adicional del tipo elemental elegido.
      Puedes usar esta habilidad un número de veces igual a tu puntuación de Cuerpo por día de descanso.
    uses:
      type: null
      qty: 0
