cards:
  - name: Herencia Sobrenatural
    level: 1
    type: efecto
    tags:
      - Hechicero
      - Arquetipo
      - Arcanista
    requirements: Presencia 2
    description: >-
      _La magia no es algo que aprendiste, es algo que eres. Un fuego antiguo, una estirpe sobrenatural o la influencia de fuerzas imposibles late en tu interior, esperando ser liberada por tu voluntad._<br><br>
      Obtienes Ventaja (+1d4) en pruebas de Persuasión e Intimidación.<br>
      Adquieres la carta _Afinidad Arcana_, y puedes usar Presencia como tu Atributo Arcano para las cartas de _Arcanista_.<br><br>
      Al adquirir esta carta, determina el origen de tu poder sobrenatural y elige uno de los siguientes tipos de daño que sea apropiado para tu herencia: Ácido, Eléctrico, Frío, Fuego, Fuerza, Necrótico, Psíquico, Radiante o Veneno.<br>
      Esta elección es permanente y se convierte en tu _Daño de Herencia_. Siempre que una carta haga referencia a tu _Daño de Herencia_, utiliza el tipo elegido.<br><br>
      **Beneficio de Arquetipo:** Mientras este sea tu Beneficio de Arquetipo activo, añades la carta _Sangre Mágica_ a tu colección.<br>
      Adicionalmente, tu Salud máxima aumenta en +3, aprendes un idioma apropiado para el origen de tu poder y ganas un bono a tus Puntos de Salud igual a 5 PS por cada 10 PP que hayas gastado.
    uses:
      type: null
      qty: 0
  - name: Sangre Mágica
    level: 1
    type: efecto
    tags:
      - Hechicero
    requirements: Herencia Sobrenatural
    description: >-
      _Utilizas tu propia vitalidad como combustible, sacrificando tu cuerpo para potenciar tu inestable poder arcano._<br><br>
      Una vez por ronda, puedes sacrificar vitalidad para alterar tus conjuros de _Arcanista_ o de _Hechicero_. Los Puntos de Salud sacrificados de esta forma se pierden directamente, no pueden ser mitigados ni pagados con Puntos de Salud temporales. Este sacrificio puede reducir tus Puntos de Salud a 0.<br><br>
      - **Sacrificio:** Cuando fallas una tirada de Recarga, siempre que el dado no haya obtenido un 1 natural, puedes sacrificar 3 PS por cada punto que quieras sumar al resultado.<br>
      - **Potencia:** Cuando realizas una tirada de daño de un conjuro, puedes sacrificar una cantidad de PS igual a 2 × el Nivel del conjuro para volver a tirar hasta un número de sus dados de daño igual a tu Presencia. Debes conservar los nuevos resultados.<br>
      - **Celeridad:** Cuando lanzas un conjuro de Nivel 1 o 2 cuyo tiempo de lanzamiento sea una Acción, puedes lanzarlo como Interacción en su lugar. Para hacerlo, sacrificas una cantidad de PS igual a 3 + el Nivel del conjuro.
    uses:
      type: null
      qty: 0
  - name: 'Ráfaga Inestable'
    level: 1
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: 'Herencia Sobrenatural'
    description: >-
      _Liberas una descarga de la energía sobrenatural que, al impactar, puede desbordarse en una cascada de destrucción impredecible._<br><br>
      Realizas un ataque de conjuro (1d8e + Atributo Arcano) a distancia Cercana contra un objetivo. Si impactas, infliges 1d6 de _Daño de Herencia_.<br>
      - **Cascada Menor:** Si el dado de daño resulta en un 6 natural, la energía se desborda: tiras 1d6 adicional y lo sumas al daño total. Este dado también puede generar otro dado adicional si obtiene un 6.
    uses:
      type: RELOAD
      qty: 3
  - name: 'Sangre Despierta'
    level: 1
    type: efecto
    tags:
      - Hechicero
    requirements: 'Herencia Sobrenatural'
    description: >-
      _La esencia sobrenatural que corre por tus venas ha comenzado a manifestarse más allá de tu magia. Tu cuerpo, tu mente y los conjuros que canalizas reflejan cada vez con mayor intensidad la verdadera naturaleza de tu herencia._<br><br>
      Obtienes el siguiente beneficio según tu _Daño de Herencia_:<br>
      - **Ácido — Corrosión Arcana:** Cuando infliges tu _Daño de Herencia_, ignoras una cantidad de Mitigación Mágica del objetivo igual a la mitad de tu Presencia (redondeado hacia abajo).<br>
      - **Eléctrico — Descarga Encadenada:** Una vez por turno, cuando infliges tu _Daño de Herencia_, puedes elegir una de las criaturas dañadas como origen de una descarga eléctrica. Desde ella, la descarga puede saltar a otra criatura situada a 3 metros o menos, y continuar saltando desde cada nueva criatura alcanzada hacia otra criatura situada a 3 metros o menos, hasta realizar un máximo de saltos igual a tu Presencia. Cada criatura alcanzada por un salto recibe 1d4 de daño Eléctrico. Una misma criatura no puede ser alcanzada más de una vez por esta descarga.<br>
      - **Frío — Frío Entumecedor:** Cuando una criatura recibe tu _Daño de Herencia_, su Velocidad se reduce en una cantidad de metros igual a la mitad de tu Presencia (redondeado hacia arriba) hasta el inicio de tu próximo turno. Varias aplicaciones de este efecto no se acumulan.<br>
      - **Fuego — Combustión Sobrenatural:** Una vez por turno, cuando infliges tu _Daño de Herencia_ mediante una carta con la etiqueta _Conjuro_, añades 1d4 de daño de Fuego a su tirada de daño.<br>
      - **Fuerza — Campo Inercial:** Cuando utilizas una carta con la etiqueta _Conjuro_ que inflige tu _Daño de Herencia_, la energía residual se condensa alrededor de tu cuerpo. Hasta el inicio de tu próximo turno, obtienes +1 a tu Mitigación Física y Mágica. Si tu Presencia es 5 o superior, este bono aumenta a +2.<br>
      - **Necrótico — Marca de Extinción:** Cuando infliges tu _Daño de Herencia_ a una criatura hostil, esta queda marcada hasta el inicio de tu próximo turno. Si una criatura marcada es reducida a 0 Puntos de Salud mientras permanece marcada, recuperas una cantidad de Puntos de Salud igual a la mitad de tu Presencia (redondeado hacia abajo).<br>
      - **Psíquico — Mente Sin Fronteras:** Puedes comunicarte telepáticamente de forma bidireccional con criaturas que puedas percibir o que sepas que se encuentren a distancia Media. Esta comunicación transmite directamente pensamientos y conceptos, por lo que no requiere compartir una lengua. Si ya posees telepatía por otra fuente, su alcance aumenta en un rango.<br>
      - **Radiante — Marca Luminosa:** Cuando una criatura recibe tu _Daño de Herencia_, queda envuelta en un resplandor sobrenatural hasta el final de tu próximo turno. Mientras permanezca iluminada, no puede beneficiarse de Invisibilidad ni Esconderse, y la siguiente tirada de ataque realizada contra ella obtiene Ventaja (+1d4). La Ventaja se consume después de esa tirada, aunque el resplandor permanece hasta finalizar su duración.<br>
      - **Veneno — Metabolismo Tóxico:** Eres inmune al estado Envenenado. Además, cuando una criatura recibe tu _Daño de Herencia_ mediante una carta con la etiqueta _Conjuro_, queda intoxicada hasta el inicio de su próximo turno. Al inicio de ese turno, recibe 1d6 de daño de Veneno. Una criatura no puede tener más de una instancia de este efecto al mismo tiempo.
    uses:
      type: null
      qty: 0

  - name: 'Adaptación Sobrenatural'
    level: 2
    type: efecto
    tags:
      - Hechicero
    requirements: 'Sangre Mágica & Presencia 2'
    description: >-
      _Tu cuerpo ha comenzado a adaptarse a la energía sobrenatural que corre por tus venas, transformando parte del dolor de tus sacrificios en una barrera protectora y volviéndose cada vez más resistente a la esencia de tu propia herencia._<br><br>
      Inmediatamente después de sacrificar Puntos de Salud usando tu carta _Sangre Mágica_, ganas una cantidad de Puntos de Salud temporales igual a la mitad de los PS sacrificados (redondeado hacia arriba). Estos Puntos de Salud temporales duran 1 minuto.<br>
      Además, obtienes Resistencia a tu _Daño de Herencia_.
    uses:
      type: null
      qty: 0

  - name: 'Desborde Armado'
    level: 2
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: 'Herencia Sobrenatural & Presencia 3'
    description: >-
      _Cuando tu ataque impacta, la magia que corre por tus venas encuentra una grieta por la que escapar, deformando violentamente el golpe y la realidad a su alrededor._<br><br>
      Cuando impactas a una criatura con un ataque usando un arma cuerpo a cuerpo o desarmado, puedes usar tu Interacción y gastar el uso de esta carta para liberar un desborde de magia inestable.<br>
      Todo el daño infligido por ese ataque se convierte en tu _Daño de Herencia_. Además, el objetivo recibe 1d6 de _Daño de Herencia_ adicional.<br>
      Luego, tira 1d4 y aplica la manifestación correspondiente:<br>
      - **1 — Sobrecarga Arcana:** Vuelve a tirar el dado de daño base del arma y utiliza el resultado más alto. Si el dado original ya había obtenido su valor máximo, no lo vuelves a tirar; en su lugar, infliges 1d4 de _Daño de Herencia_ adicional.<br>
      - **2 — Ruptura Cinética:** Si el objetivo es como máximo un tamaño mayor que tú, es empujado 3 metros directamente en dirección opuesta a ti. Si es de tu tamaño o menor, además queda Derribado.<br>
      - **3 — Fractura Espacial:** Si el objetivo es como máximo un tamaño mayor que tú, lo teletransportas hasta 5 metros a un espacio desocupado que puedas ver. El destino debe ser capaz de sostener físicamente a la criatura y no puede colocarla directamente dentro de un peligro ambiental evidente.<br>
      - **4 — Reflujo Arcano:** Obtienes una cantidad de Puntos de Salud temporales igual a 2d4 + tu Presencia durante 1 minuto.<br><br>
      **Forzar el Desborde:** Si posees la carta _Sangre Mágica_, antes de tirar el dado puedes sacrificar 2 Puntos de Salud mediante ella. Si lo haces, tira 2d4 y elige cuál de los dos resultados aplicar.<br>
      Este sacrificio cuenta como tu uso de _Sangre Mágica_ de la ronda y activa cualquier efecto que se desencadene al sacrificar Salud mediante esa carta.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Anomalía Salvaje'
    level: 3
    type: efecto
    tags:
      - Hechicero
    requirements: 'Sangre Mágica & Presencia 4'
    description: >-
      _Al forzar tu poder, la magia errática desestabiliza la realidad a tu alrededor, creando efectos aleatorios._<br><br>
      Inmediatamente después de sacrificar Puntos de Salud usando tu carta _Sangre Mágica_, tira 1d4 para determinar qué efecto secundario se manifiesta:<br>
      - **Parpadeo:** Te teletransportas hasta 3 metros a un espacio desocupado que puedas ver.<br>
      - **Distorsión:** El próximo ataque que recibas antes del inicio de tu próximo turno se realiza con Desventaja (-1d4).<br>
      - **Claridad:** Tu próxima tirada de ataque de conjuro antes del final de tu próximo turno obtiene Ventaja (+1d4).<br>
      - **Ruptura Defensiva:** Eliges a una criatura a distancia Media que puedas ver. Esta sufre Desventaja (-1d4) en la próxima Tirada de Salvación que realice contra uno de tus conjuros antes del final de tu próximo turno.
    uses:
      type: null
      qty: 0
  - name: 'Absorción Inestable'
    level: 3
    type: activable
    tags:
      - Hechicero
      - Reacción
    requirements: 'Sangre Mágica & Presencia 4'
    description: >-
      _En lugar de rehuir del daño mágico, obligas a tu cuerpo a absorber esa energía para alimentar tus próximos conjuros._<br><br>
      Como Reacción, cuando recibes daño de un _Conjuro_ o efecto mágico, reduces el daño recibido a la mitad.<br><br>
      Además, el remanente de esa magia queda latente en tu interior: la próxima vez que lances una carta de _Conjuro_ antes del final de tu próximo turno, puedes aplicar una de las opciones de tu carta _Sangre Mágica_ sin tener que sacrificar Puntos de Salud.<br>
      Aplicar una opción de esta forma cuenta como tu uso de _Sangre Mágica_ de esa ronda, pero no activa efectos que requieran haber sacrificado Puntos de Salud.
    uses:
      type: RELOAD
      qty: 6

  - name: 'Esfera de Caos'
    level: 3
    type: activable
    tags:
      - Hechicero
      - Conjuro
    requirements: 'Herencia Sobrenatural & Atributo Arcano 4'
    description: >-
      _Condensas tu poder sobrenatural en una esfera inestable que detona violentamente, deformando a su alrededor el espacio y la materia._<br><br>
      Elije punto a distancia Media, donde provocas una detonación en una esfera de 3 metros de radio. Todas las criaturas en el área deben superar una TS de Reflejos (ND 5 + Atributo Arcano). El daño de la detonación es de 4d6 de _Daño de Herencia_.<br>
      - **Cascada Inestable:** Por cada dado de daño que resulte en un 6 natural, la magia se desborda y tiras 1d6 adicional para sumarlo al daño total. Estos dados adicionales también generan más dados si sacan un 6.<br>
      - **Anomalía Gravitacional:** Observa el número total final del daño. Las criaturas que fallaron su Tirada de Salvación sufren uno de los siguientes efectos adicionales:<br>
      &nbsp;&nbsp;&nbsp;&nbsp; - _Si el daño total es PAR (Implosión):_ Son arrastradas violentamente 2 metros hacia el centro de la esfera y su Velocidad se reduce a la mitad hasta el final de tu próximo turno.<br>
      &nbsp;&nbsp;&nbsp;&nbsp; - _Si el daño total es IMPAR (Onda Cinética):_ Son empujadas 2 metros en dirección opuesta al centro de la esfera y caen Derribadas.<br>
      Si una criatura tiene éxito en la Tirada de Salvación, recibe la mitad del daño total acumulado y no sufre la _Anomalía Gravitacional_.
    uses:
      type: RELOAD
      qty: 7
  - name: 'Apoteosis Arcana'
    level: 4
    type: activable
    tags:
      - Hechicero
    requirements: 'Sangre Mágica & Presencia 5'
    description: >-
      _Dejas que la magia pura de tu linaje te consuma por completo, convirtiéndote en un faro de poder letal._<br><br>
      Como Acción, entras en un estado de poder arcano que dura 1 minuto.<br>
      Mientras estes en este estado, ganas una velocidad de vuelo igual a tu Velocidad normal, emites luz brillante a 3 metros, y el costo en Puntos de Salud de todas las opciones de tu carta _Sangre Mágica_ se reduce a la mitad (redondeado hacia arriba, hasta un mínimo de 1 PS).
    uses:
      type: LONG_REST
      qty: 1
  - name: 'Torrente de la Urdimbre'
    level: 5
    type: activable
    tags:
      - Hechicero
      - Reacción
    requirements: 'Herencia Sobrenatural & Presencia 6'
    description: >-
      _Te niegas a caer, anclando tu alma a la Urdimbre para desatar una onda de choque devastadora como tu último aliento._<br><br>
      Una vez por día de descanso, cuando tus Puntos de Salud se reducen a 0, puedes usar tu Reacción para negarte a caer, anclando tu alma a la Urdimbre. Quedas con 1 Punto de Salud y tu cuerpo desata una onda de choque inestable de magia pura.<br>
      Eliges hasta un número de criaturas hostiles a distancia Cercana igual a tu puntuación de Presencia. Cada objetivo debe superar una TS de Reflejos (ND 5 + Presencia) o recibir 5d8 de _Daño de Herencia_ y ser empujado 3 metros lejos de ti. Si tiene éxito, recibe la mitad del daño y no es empujado.<br>
      Además, la pura adrenalina mágica te permite recuperar instantáneamente el uso de una carta de _Arcanista_ o _Hechicero_ que tuvieras agotada.
    uses:
      type: LONG_REST
      qty: 1
