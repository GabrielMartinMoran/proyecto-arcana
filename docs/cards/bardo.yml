cards:
  # ------------------------------ BARDO ------------------------------
  - name: Don del Elocuente
    level: 1
    type: efecto
    tags:
      - Bardo
      - Arquetipo
    requirements: Presencia 2
    description: >-
      _Tu voz puede encender rebeliones o calmar tormentas. Entiendes que una palabra bien dicha es más afilada que cualquier espada de acero._<br><br>
      Obtienes Ventaja (+1d4) en Pruebas de Interpretación y Persuasión.<br><br>
      **Beneficio de Arquetipo:** Aprendes dos lenguas convencionales adicionales, a utilizar 2 instrumentos musicales, y obtienes Ventaja (+1d4) en las pruebas de habilidad de Engaño y Perspicacia.
      Adicionalmente, ganas un bono a tus Puntos de Salud igual a 4 PS por cada 10 PP que hayas gastado.
    uses:
      type: null
      qty: 0
  - name: Canto de Inspiración
    level: 1
    type: activable
    tags:
      - Bardo
    requirements: Don del Elocuente
    description: >-
      _Entonas una melodía épica o recitas un verso vibrante que enciende el coraje y la destreza en los corazones de tus compañeros._<br><br>
      Usas tu Interacción para inspirar a un aliado a distancia Cercana que pueda oírte.<br>
      Durante 1 minuto, el objetivo obtiene un dado de inspiración (1d4) que puede añadir a una Prueba de Habilidad, Tirada de Ataque o Tirada de Salvación que realice.<br>
      La cantidad máxima de criaturas que pueden estar inspiradas por ti al mismo tiempo es igual a tu puntuación de Presencia.
    uses:
      type: RELOAD
      qty: 3
  - name: Palabras Hirientes
    level: 1
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: Don del Elocuente
    description: >-
      _Tus insultos no solo ofenden el orgullo, sino que llevan una carga mágica subyacente que desgarra la mente de tu víctima._<br><br>
      Insultas a una criatura a distancia Cercana que puedas ver y que pueda oírte.<br>
      El objetivo debe superar una TS de Instinto (ND 5 + Presencia) o recibir 1d6 de daño Psíquico y tener Desventaja en su próxima tirada de ataque.
    uses:
      type: RELOAD
      qty: 3
  - name: Inspiración Eficaz
    level: 2
    type: efecto
    tags:
      - Bardo
    requirements: 'Canto de Inspiración & Presencia 3'
    description: >-
      _Tu música resuena en la memoria de tus aliados; si fallan, los ecos de tu melodía les otorgan una segunda oportunidad de brillar._<br><br>
      Si un aliado usa tu dado de _Canto de Inspiración_ y aun así falla la tirada, no gasta el dado de inspiración; puede conservarlo para otro intento.
    uses:
      type: null
      qty: 0
  - name: Mil Saberes
    level: 2
    type: activable
    tags:
      - Bardo
      - Reacción
    requirements: Don del Elocuente
    description: >-
      _En el momento exacto, recuerdas un viejo cuento, una leyenda o un poema esotérico que contiene la clave para superar el obstáculo actual._<br><br>
      Como Reacción, cuando vas a realizar una prueba de habilidad en la que no tienes Ventaja, invocas un recuerdo propio y te otorgas Ventaja (+1d4) en la tirada.
    uses:
      type: LONG_REST
      qty: 3
  - name: Hechizar Persona
    level: 1
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: Don del Elocuente
    description: >-
      _Tus palabras se vuelven convincentes y tu mirada un refugio seguro; nublas el juicio de tu interlocutor para convertirlo temporalmente en un amigo devoto._<br><br>
      Intentas encantar a un humanoide a distancia Cercana. Este debe superar una TS de Instinto
      (ND 5 + Presencia, con ventaja si tu o tus compañeros estan combatiendo contra la criatura) o quedar Encantado por ti durante 10 minutos.<br>
      Mientras este bajo este efecto, su postura hacia ti es amigable y como mínino tendra en cuenta tus peticiones o sugerencias.
    uses:
      type: LONG_REST
      qty: 2
  - name: Inspiración Superior
    level: 3
    type: efecto
    tags:
      - Bardo
    requirements: 'Inspiración Eficaz & Presencia 4'
    description: >-
      _Tus cánticos alcanzan notas más altas y puras, infundiendo a tus compañeros con una valentía aún más resonante y poderosa._<br><br>
      El dado de tu _Canto de Inspiración_ aumenta a 1d6 y su alcance aumenta a distancia Media.
    uses:
      type: null
      qty: 0
  - name: Impersonar
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Ritual
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Tejes una ilusión compleja sobre tu propia piel y cuerdas vocales, convirtiéndote en otra persona con una precisión inquietante._<br><br>
      Como acción, alteras físicamente tu estatura (hasta medio metro más o menos),
      rasgos faciales, color de piel y voz para adoptar una nueva apariencia humanoide. La transformación es física y dura hasta 8 horas.<br>
      Aunque no es una simple ilusión, su naturaleza mágica puede ser percibida por efectos como la Visión Verdadera.<br>
      Un observador que sospeche de ti puede usar su Acción para estudiar tu actuación. Para descubrirte, debe superar una Tirada Enfrentada
      de su Perspicacia contra tu Engaño.
    uses:
      type: LONG_REST
      qty: 1
  - name: Secretos Mágicos
    level: 3
    type: efecto
    tags:
      - Bardo
    requirements: 'Don del Elocuente & Presencia 4 & Mente 2'
    description: >-
      _Tu incansable curiosidad y tu estudio estudio de diversas tradiciones te ha otorgad la capacidad de aprender a canalizar mágia de distintas disciplinas._<br><br>
      Eliges un total de 3 niveles de cartas de Conjuro
      de las listas del Arcanista, Sacerdote o Druida (todas de la misma lista). Las combinaciones pueden ser:<br>
      - Una carta de Nivel 3.<br>
      - Una carta de Nivel 2 y una de Nivel 1.<br>
      - Tres cartas de Nivel 1.<br>
      Ignoras cualquier requisito que tengan las cartas elegidas. Estas se añaden a tu colección y usan Presencia como tu atributo principal para utilizarlas.<br><br>
      **Reaprendizaje:** Durante una semana de tiempo de inactividad, puedes dedicarte a investigar. Al final de la semana, puedes reemplazar
      una o varias de las cartas elegidas por otra, siempre que el coste total de niveles no supere 3.
    uses:
      type: null
      qty: 0
  - name: Canto de Héroes
    level: 4
    type: efecto
    tags:
      - Bardo
    requirements: 'Inspiración Superior & Presencia 5'
    description: >-
      _Cantas las epopeyas de la antigüedad con tanta pasión y magia que tus aliados se sienten, y actúan, de forma verdaderamente invencible._<br><br>
      El dado de tu _Canto de Inspiración_ aumenta a 1d8.<br>
      Además, cualquier aliado que use tu dado de inspiración también gana una cantidad de Puntos de Salud temporales igual al resultado del dado.
    uses:
      type: null
      qty: 0

  - name: Dominar Persona
    level: 4
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Hechizar Persona & Presencia 5'
    description: >-
      _Tu voz se convierte en las cadenas invisibles que atan y doblegan la voluntad de tu víctima, convirtiéndola en tu marioneta perfecta._<br><br>
      Como Acción, eliges a un humanoide a distancia Media. Este debe superar una TS de Instinto (ND 5 + Presencia). Si falla, queda Encantado por ti durante 1 minuto.<br>
      Mientras dure el efecto, tienes un vínculo telepático con él y puedes usar tu Interacción para darle órdenes que obedecerá.<br>
      Si le das una orden que atenta directamente contra su vida, o si tu o tus aliados lo atacan, el objetivo puede repetir la tirada de Salvación, liberandose del efecto en caso de éxito.
    uses:
      type: RELOAD
      qty: 7
  # --- Bardo: Colegio del Valor ---
  - name: Inspiración Marcial
    level: 1
    type: efecto
    tags:
      - Bardo
    requirements: Canto de Inspiración
    description: >-
      _El ritmo de tu propia música guía tus pasos, volviendo tu danza en el campo de batalla tan ágil, letal e impredecible como tu arte._<br><br>
      Puedes usar tu _Canto de Inspiración_ en ti mismo.<br>
      Además, mientras poseas un dado de _Canto de Inspiración_ sin gastar (otorgado por ti mismo), obtienes un bonificador de +1 a tu Esquiva.
    uses:
      type: null
      qty: 0
  - name: Danza de la Muerte
    level: 2
    type: efecto
    tags:
      - Bardo
    requirements: Inspiración Marcial
    description: >-
      _Te deleitas en el caos hermoso del combate; cada enemigo que cae es un compás más en tu macabra y triunfal sinfonía._<br><br>
      Ganas los siguientes beneficios:<br>
      - **Golpe Resonante:** Cuando una criatura vaya a gastar uno de tus dados de _Canto de Inspiración_ en un ataque, puede elegir sumar el resultado al daño en lugar de a la tirada de ataque.<br>
      - **Ritmo de Batalla:** Cada vez que gastas un uso de tu _Canto de Inspiración_, ganas Puntos de Salud Temporales igual a tu puntuación de Presencia.<br>
      - **Bis Sangriento:** Si reduces a un enemigo a 0 Puntos de Salud, recuperas inmediatamente un uso gastado de tu _Canto de Inspiración_.
    uses:
      type: null
      qty: 0
  - name: Crescendo Aterrador
    level: 2
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: 'Don del Elocuente & Presencia 3'
    description: >-
      _Tocas un acorde disonante y ensordecedor que siembra un pánico primordial y absoluto en la mente de tus adversarios._<br><br>
      Como Acción, realizas una interpretación imponente. Todo enemigo en un radio de 3 metros que pueda verte u oírte
      debe superar una TS de Instinto (ND 5 + Presencia). Si falla, el objetivo debe usar su próximo turno para
      moverse lo más lejos posible de ti por la ruta más segura disponible.
    uses:
      type: RELOAD
      qty: 6
  - name: Floritura Ofensiva
    level: 3
    type: efecto
    tags:
      - Bardo
    requirements: 'Inspiración Marcial & Presencia 4'
    description: >-
      _Tu espada se mueve al ritmo acelerado de tu música, asestando golpes que florecen en un espectáculo letal de acero y sangre._<br><br>
      Una vez por turno, cuando impactas a un enemigo con un ataque con arma, puedes gastar un uso de tu _Canto de Inspiración_.
      Si lo haces, sumas el resultado del dado de inspiración al daño de ese ataque y puedes realizar un segundo ataque con arma como parte de la misma Acción.
    uses:
      type: null
      qty: 0
  - name: Cacofonía Discordante
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: 'Crescendo Aterrador & Presencia 4'
    description: >-
      _Gritas o tocas una nota tan estridente y caótica que aturde la mente y desgarra los tímpanos de quienes tienen la desgracia de rodearte._<br><br>
      Como Acción, creas una explosión de sonido disonante en un punto a distancia Cercana. Toda criatura en un radio de 3 metros
      debe superar una TS de Cuerpo (ND 5 + Presencia) o recibirá 2d6 de daño Sónico y no podrá usar Reacciones hasta el
      final de tu próximo turno.<br>
      Además, si una criatura estaba manteniendo Concentración al momento de fallar la tirada, pierde la concentración imediatamente.
    uses:
      type: RELOAD
      qty: 6
  - name: Floritura Artística
    level: 1
    type: efecto
    tags:
      - Bardo
      - Conjuro
    requirements: Don del Elocuente
    description: >-
      _Moldeas el entorno a tu absoluto antojo, usando magia sutil para crear el escenario, la iluminación y el sonido perfectos para tu entrada._<br><br>
      Adquieres la capacidad de conjurar la magia de tu arte en forma de los siguientes trucos:<br>
      - **Puesta en Escena (Interacción):** Creas efectos narraitvos menores: haces sonar música de fondo, amplificas tu voz, afinas instrumentos o generas efectos visuales menores (lluvia de pétalos, foco de luz).<br>
      - **Trucos de Salón (Acción):** Realizas magia menor sobre objetos: enciendes/apagas velas, creas una esfera de luz flotante, limpias/manchas ropa, o cambias el sabor y temperatura de 1 litro de bebida o comida.<br>
      - **Ventriloquia (Acción):** Creas un sonido corto (como un susurro, pasos, etc.) que parezca provenir de un punto específico a distancia Cercana.
    uses:
      type: null
      qty: 0

  - name: Versos Vigorizantes
    level: 1
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: Don del Elocuente
    description: >-
      _Tus rimas son un bálsamo reconfortante para el alma, aliviando el cansancio y cerrando las heridas físicas con el puro poder de tu arte._<br><br>
      Al lanzar el conjuro, eliges un efecto:<br>
      - **Palabra de Esperanza (Interacción):** Pronuncias una palabra revigorizante. Un aliado a distancia Cercana recupera 1d4 Puntos de Salud.<br>
      - **Canto Heroico (Acción):** Interpretas una breve y potente melodía. Hasta 2 aliados a distancia Cercana ganan 1d4 + Presencia en Puntos de Salud Temporales durante 1 minuto.
    uses:
      type: RELOAD
      qty: 4

  - name: Risa Incontenible
    level: 2
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: 'Don del Elocuente & Presencia 3'
    description: >-
      _Cuentas una broma cargada de encanto tan potente que tu víctima colapsa en el suelo en un ataque de hilaridad asfixiante._<br><br>
      Como Acción, eliges una criatura a distancia Media que pueda verte y oírte. Debe superar una TS de Instinto (ND 5 + Presencia).
      Si falla, cae al suelo en un ataque de risa, quedando en los estados Derribado y Aturdido.<br>
      La criatura puede repetir la Tirada de Salvación al final de cada uno de sus turnos.<br>
      El efecto también termina si la criatura recibe daño.
    uses:
      type: RELOAD
      qty: 5

  - name: Himno de Batalla
    level: 2
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 3'
    description: >-
      _Entonas una potente marcha marcial que hace hervir la sangre de tus aliados, guiando sus armas con una precisión letal y coordinada._<br><br>
      Como Acción, interpretas himno de guerra inspirador que dura hasta 1 minuto, creando un aura de 3 metros de radio centrada en ti.<br>
      Tus aliados (incluido tú) que comiencen su turno dentro del aura ganan un +1 a sus tiradas de ataque hasta el inicio de su próximo turno.
    uses:
      type: RELOAD
      qty: 5

  - name: Balada de los Héroes
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Reacción
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Cuando todo parece perdido, cantas un verso de redención in extremis que altera la mismísima probabilidad a favor de tus amigos._<br><br>
      Como Reacción, cuando un aliado a distancia Cercana que puedas ver falla una tirada de ataque o una tirada de salvación,
      puedes interpretar una nota de aliento para permitirle que vuelva a tirar el dado.<br>
      Debe usar el nuevo resultado.
    uses:
      type: RELOAD
      qty: 6

  - name: Lamento Confuso
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Cantas una canción de cuna distorsionada que nubla la mente de tus enemigos, enfrentándolos entre sí en un delirio violento._<br><br>
      Como Acción, eliges un punto a distancia Media y entonas tu canción, creando una esfera de 3 metros de radio durante 1 minuto.<br>
      Una criatura hostil que empiece su turno en el área debe superar una TS de Instinto (ND 5 + Presencia).
      Si falla, no puede distinguir amigo de enemigo y debe usar su Acción
      para realizar un ataque cuerpo a cuerpo contra la criatura más cercana a ella.
    uses:
      type: RELOAD
      qty: 6

  - name: Narrativa Cautivadora
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Tu relato verbal es tan hipnótico y envolvente que la línea entre tu ficción y la realidad desaparece por completo para quienes te escuchan._<br><br>
      Como Acción, eliges un objetivo a distancia Media y comienzas a hablarle. Este debe superar una TS de Instinto (ND 5 + Presencia). Si falla,
      durante 1 minuto, cree que tus afirmaciones son hechos, siempre que no sean directamente suicidas o contradigan una creencia fundamental.<br>
      Una vez que una criatura ha sido objetivo de este conjuro, es inmune a él durante un día de descanso, independientemente del resultado.
    uses:
      type: RELOAD
      qty: 6

  - name: Patrón Hipnótico
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Tejes una cascada de luces y colores vibrantes en el aire, fascinando a quienes las miran hasta dejarlos completamente paralizados._<br><br>
      Como Acción, eliges un punto a distancia Media que dura hasta 1 minuto. Todas las criaturas
      en un cubo de 3 metros desde ese punto deben superar una TS de Instinto (ND 5 + Presencia). Si fallan, quedan Encantadas por ti.<br>
      Mientras estén encantadas por este efecto, quedan Inmovilizadas en un estado de fascinación.<br>
      El efecto termina para una criatura si esta recibe daño.
    uses:
      type: RELOAD
      qty: 6

  - name: Terror Primordial
    level: 4
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 5'
    description: >-
      _Proyectas las pesadillas más oscuras engendradas directamente en la mente de tus aterrorizados adversarios._<br><br>
      Liberas una onda psíquica en un cono de 5 metros. Las criaturas en el área deben superar una TS de Instinto (ND 5 + Presencia).<br>
      Si fallan, reciben 4d6 de daño Psíquico y deben usar su Reacción (si la tienen disponible) para moverse lo más lejos posible de ti por la ruta más segura posible.<br>
      Además, las criaturas que fallaron quedan Asustadas de ti durante 1 minuto. Pueden repetir la TS al final de cada uno de sus turnos para terminar el efecto.
    uses:
      type: RELOAD
      qty: 6

  - name: Discordia
    level: 4
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 5'
    description: >-
      _Liberas una onda de locura psíquica que sume a tus enemigos en un caos absoluto de balbuceos incomprensibles, huidas despavoridas y ataques erráticos._<br><br>
      Creas una distorsión psíquica en una esfera de 3 metros de radio a distancia Media. Las criaturas en el área deben superar una TS de Mente (ND 5 + Presencia).
      Si fallan, quedan Confundidas durante 1 minuto.<br>
      Una criatura Confundida no puede usar Reacciones y debe tirar 1d4 al inicio de su turno para determinar su comportamiento:<br>
      - **1-2:** No hace nada (balbucea).<br>
      - **3:** Huye en una dirección aleatoria.<br>
      - **4:** Ataca a la criatura más cercana.<br>
      Las criaturas afectadas pueden repetir la salvación al final de cada uno de sus turnos.
    uses:
      type: RELOAD
      qty: 6

  - name: Sinfonía Heroica
    level: 5
    type: efecto
    tags:
      - Bardo
    requirements: 'Canto de Héroes & Presencia 6'
    description: >-
      _Tu obra maestra resuena en todo el campo de batalla, inspirando y coordinando a múltiples héroes con un solo y majestuoso compás._<br><br>
      Cuando usas tu _Canto de Inspiración_, puedes inspirar a dos aliados a la vez.<br>
      Todos los demás beneficios asociados a tu inspiración se aplican a ambos objetivos por igual.
    uses:
      type: null
      qty: 0

  - name: Canción de la Creación
    level: 5
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Ritual
    requirements: 'Secretos Mágicos & Presencia 6'
    description: >-
      _Tu música es tan perfecta que trasciende la simple ilusión, solidificando la materia a partir del mismísimo silencio._<br><br>
      Tras 10 minutos de interpretación ininterrumpida, tejes una ilusión semi-real y duradera a partir de la música. Eliges uno de los siguientes efectos:<br>
      - **Crear Materia:** Creas un objeto no mágico que puede ocupar hasta un cubo de 10 metros de lado (como una casa pequeña o un puente de piedra). El objeto se ve y se siente real ante una inspección superficial. Sin embargo, puede ser identificado como una creación mágica mediante efectos de Visión Verdadera o realizando una inspección física exhaustiva superando una Prueba de Percepción vs (ND 5 + Presencia). El objeto es sólido y su duración se mantiene hasta ser disipado.<br>
      - **Reescribir Memoria:** Alteras permanentemente la memoria de una criatura sobre un evento específico. Si el objetivo no es voluntario, debe superar una Tirada de Salvación de Instinto (ND 5 + Presencia) para evitar el efecto.
    uses:
      type: LONG_REST
      qty: 1

  - name: Danza de Magia y Acero
    level: 5
    type: efecto
    tags:
      - Bardo
    requirements: 'Floritura Ofensiva & Presencia 6'
    description: >-
      _Has alcanzado la cúspide del combate artístico, donde cada corte de tu espada sirve como el componente somático de un poderoso hechizo._<br><br>
      Cuando utilizas tu carta _Floritura Ofensiva_, puedes optar por lanzar un conjuro de Nivel 1 o 2 (con tiempo de lanzamiento de una Acción) en lugar de realizar el segundo ataque con arma.<br>
      El conjuro elegido debe poseer las etiquetas _Bardo_ y _Conjuro_ (ambas), o haber sido aprendido mediante la carta _Secretos Mágicos_.
    uses:
      type: null
      qty: 0

  - name: 'Voz sin Fronteras'
    level: 2
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: 'Don del Elocuente & Presencia 3'
    description: >-
      _Tus palabras atraviesan las barreras que separan a las personas: distancia, idioma e incluso el silencio dejan de ser obstáculos para tu voz._<br><br>
      Mientras esta carta esté activa, puedes utilizar uno de los siguientes modos:<br>
      - **Susurro Distante:** Como Interacción, y sin agotar esta carta, eliges a una criatura que puedas ver a distancia Media y le envías un breve mensaje que solo ella puede oír. La criatura puede responder inmediatamente con un mensaje igualmente breve que solo tú puedes oír. Deben compartir al menos un idioma para comprenderse.<br>
      - **Lengua Universal:** Como Acción, tocas a una criatura voluntaria. Durante 1 hora, comprende cualquier idioma hablado que escuche y cualquier criatura capaz de comprender al menos un idioma entiende aquello que diga. Este efecto no permite leer ni escribir idiomas desconocidos.<br>
      - **Mensaje Lejano:** Como Acción, eliges a una criatura que conozcas y que se encuentre en tu mismo plano de existencia. Le transmites mentalmente un mensaje de hasta unas 25 palabras. La criatura reconoce que el mensaje proviene de ti y puede responder inmediatamente con un mensaje de extensión similar. No necesitas conocer su ubicación para contactar con ella.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Interludio Pacífico'
    level: 2
    type: activable
    tags:
      - Bardo
      - Conjuro
      - Concentración
    requirements: 'Don del Elocuente & Presencia 3'
    description: >-
      _Cambias el tono de la escena con una melodía imposible de ignorar, haciendo que durante unos instantes el miedo, la ira y la violencia pierdan su dominio._<br><br>
      Como Acción, interpretas una melodía que dura hasta 1 minuto o hasta que pierdas la Concentración. Al comenzar, eliges uno de los siguientes efectos:<br>
      - **Apaciguar Hostilidad:** Las criaturas hostiles que puedan oírte en un radio de 5 metros centrado en un punto a distancia Media deben superar una TS de Instinto (ND 5 + Presencia). Si fallan, no pueden realizar ataques ni utilizar habilidades deliberadamente dañinas mientras permanezcan afectadas. El efecto termina inmediatamente sobre una criatura si esta recibe daño, es objetivo de un efecto hostil o presencia cómo uno de sus aliados es atacado por una criatura enemiga.<br>
      - **Serenar Ánimo:** Eliges un número de criaturas voluntarias que puedan oírte igual a tu Presencia. Mientras dure la interpretación, quedan suprimidos sobre ellas los efectos que las mantengan Asustadas o Encantadas. El efecto original no termina: si todavía debería seguir activo cuando acaba el Interludio, vuelve a aplicarse normalmente.
    uses:
      type: RELOAD
      qty: 6

  - name: 'Conocer la Leyenda'
    level: 3
    type: activable
    tags:
      - Bardo
      - Conjuro
    requirements: 'Don del Elocuente & Presencia 4'
    description: >-
      _Toda gran persona, reliquia y lugar deja ecos en canciones, cuentos y rumores; tú sabes escuchar hasta que esas versiones contradictorias revelan la verdad que esconden._<br><br>
      Como Acción, comienzas una interpretación o recitación que requiere 10 minutos ininterrumpidos. Al finalizar, nombras o describes una persona, lugar, criatura u objeto de importancia legendaria o histórica.<br>
      El DJ te revela información verdadera y relevante asociada al objetivo: hechos históricos, hazañas, propietarios anteriores, rumores fundamentados, peligros conocidos, propiedades famosas o acontecimientos que explican su importancia.<br>
      La información puede manifestarse mediante versos, relatos fragmentarios, metáforas, testimonios contradictorios o imágenes simbólicas, pero debe contener conocimiento potencialmente útil y verdadero.<br>
      Cuanto más conocimiento previo tengas sobre el objetivo, más precisa y específica será la revelación.<br>
      Este conjuro no revela automáticamente estadísticas de juego, secretos completamente desvinculados de la historia conocida del objetivo ni acontecimientos futuros.
    uses:
      type: LONG_REST
      qty: 1
