cards:
  - name: Sintonía con el Acero
    level: 1
    type: efecto
    tags:
      - Coloso
      - Arquetipo
      - Combatiente
    requirements: Cuerpo 2
    description: >-
      _No solo empuñas tus armas; te conviertes en una extensión de ellas. Tu cuerpo es el yunque sobre el cual se rompen las ambiciones de tus enemigos._<br><br>
      Obtienes Ventaja (+1d4) en Pruebas de Atletismo y Percepción.<br><br>
      **Beneficio de Arquetipo:** Adquieres la carta _Maestría Marcial_ y usas Cuerpo como tu Atributo Marcial. Tu Salud máxima aumenta en +6 y obtienes Ventaja (+1d4) en pruebas de Fuerza Bruta. Adicionalmente, ganas un bono a tus Puntos de Salud igual a 7 PS por cada 10 PP que hayas gastado.<br><br>
    uses:
      type: null
      qty: 0
  - name: Furia de Batalla
    level: 1
    type: activable
    tags:
      - Coloso
    requirements: Sintonía con el Acero
    description: >-
      _Dejas que el instinto primordial tome el control, convirtiéndote en una fuerza de la naturaleza que ignora el dolor y siembra el caos._<br><br>
      Entras en furia por 1 minuto o hasta que quedes inconsciente.<br>
      Al entrar en furia, ganas una cantidad de Puntos de Salud temporales igual a dos veces tu puntuación de Cuerpo. Además, mientras dure la furia, ganas los siguientes efectos:<br>
      - **Temple de Hierro:** Ganas ventaja en Pruebas de Habilidad de Cuerpo.<br>
      - **Presencia Imponente:** Tu imponente estado físico te permite usar tu puntuación de Cuerpo en lugar de tu puntuación de Presencia al realizar pruebas de habilidad de Intimidación.<br>
      - **Instinto Primordial:** Mientras dure la furia, no puedes pensar con claridad, mantener concentración ni usar cartas con la etiqueta _Conjuro_.<br>
      En caso de no recibir ninguna agresión o agredir a alguien durante una ronda, tu furia termina.
    uses:
      type: LONG_REST
      qty: 2
  - name: Baluarte de Acero
    level: 1
    type: efecto
    tags:
      - Coloso
    requirements: Sintonía con el Acero
    description: >-
      _Tu maestría con la armadura es tal que su peso no te entorpece, sino que se convierte en una segunda piel inexpugnable._<br><br>
      Por cada punto de tu Atributo Cuerpo que supere el Requisito de la armadura que vistes, ignoras 1 punto de su Penalización a la Esquiva.
    uses:
      type: null
      qty: 0
  - name: Pellejo de Hierro
    level: 1
    type: efecto
    tags:
      - Coloso
    requirements: Sintonía con el Acero
    description: >-
      _Años de cicatrices y entrenamiento han vuelto tu carne tan resistente como el cuero endurecido, incluso sin llevar protección._<br><br>
      Mientras no lleves armadura, tu Mitigación Física es igual a tu puntuación de Cuerpo menos 1 (mínimo 1).
    uses:
      type: null
      qty: 0
  - name: Barrido de Piernas
    level: 2
    type: activable
    tags:
      - Coloso
    requirements: 'Sintonía con el Acero & Cuerpo 3'
    description: >-
      _Usas el peso de tu arma y la inercia de tu cuerpo para derribar a todos los oponentes a tu alrededor en un arco devastador._<br><br>
      Cuando realizas la acción de Atacar mientras empuñas un arma a dos manos o un arma Versátil con ambas manos, puedes renunciar a uno de tus ataques para forzar a todas las criaturas a distancia Inmediata de ti a superar una
      TS de Cuerpo (ND 5 + Cuerpo) o caer Derribados.
    uses:
      type: RELOAD
      qty: 4
  - name: Ira del Berserker
    level: 3
    type: efecto
    tags:
      - Coloso
    requirements: 'Furia de Batalla & Cuerpo 4'
    description: >-
      _Tu furia se convierte en un torbellino de destrucción imparable, donde el miedo se desvanece y tus músculos arden con poder._<br><br>
      Adquieres un uso adicional de tu _Furia de Batalla_. Además, cuando la activas, esta se ve potenciada con los siguientes beneficios:<br>
      - **Furia Desatada:** Tus ataques que utilicen Cuerpo infligen daño adicional igual a la mitad de tu puntuación de este atributo (redondeando hacia abajo).<br>
      - **Mente Inexpugnable:** Obtienes Ventaja (+1d4) en Tiradas de Salvación de Instinto para resistir los estados de _Encantado_ o efectos de miedo.<br>
      - **Impulso Imparable:** Tu Velocidad de movimiento aumenta en **2 metros**.
    uses:
      type: null
      qty: 0
  - name: Bastión Inamovible
    level: 4
    type: efecto
    tags:
      - Coloso
    requirements: 'Sintonía con el Acero & Cuerpo 5'
    description: >-
      _Eres una montaña contra la que se estrellan las olas; nadie puede moverte de tu sitio ni doblegar tu espíritu físico._<br><br>
      Ganas los siguientes beneficios:<br>
      - **Inquebrantable:** Eres inmune a ser Derribado o movido contra tu voluntad por criaturas de tu tamaño o inferior.<br>
      - **Resistencia Titánica:** Obtienes Ventaja (+1d4) en Tiradas de Salvación de Cuerpo.
    uses:
      type: null
      qty: 0

  - name: Último Bastión
    level: 5
    type: activable
    tags:
      - Coloso
      - Reacción
    requirements: 'Sintonía con el Acero & Cuerpo 6'
    description: >-
      _Te interpones entre el peligro y tus aliados, convirtiéndote en el escudo definitivo que anula cualquier daño._<br><br>
      Como Reacción, cuando tú o un aliado a distancia Inmediata de ti van a recibir daño, puedes interponer tu cuerpo o escudo. Al hacer esto, anulas completamente ese daño.
    uses:
      type: LONG_REST
      qty: 1
