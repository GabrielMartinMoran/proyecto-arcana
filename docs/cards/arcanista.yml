    requirements: 'Teoría Arcana Avanzada & Atributo Arcano 6'
    description: >-
      _Tu control sobre el flujo de la magia es tan absoluto que reciclar la energía de tus conjuros se vuelve un acto natural._<br><br>
      Una vez por turno, cuando lanzas un conjuro de Arcanista de Nivel 2 o inferior que tenga un sistema de Recarga,
      puedes tirar 2 veces el dado de recarga para ese conjuro y quedarte con el resultado más alto.
    uses:
      type: null
      qty: 0

