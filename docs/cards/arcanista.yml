  - name: Santuario Arcano
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Ritual
    requirements: 'Afinidad Arcana & Atributo Arcano 4'
    description: >-
      _Eriges una cúpula de protección que actúa como un refugio seguro frente a los ataques del exterior._<br><br>
      Trazas un círculo en el suelo, del que brota una cúpula de energía opaca desde fuera pero transparente desde dentro, de 3 metros de radio. Dura 8 horas.
      Las criaturas que designes al lanzar el conjuro pueden usar una Acción para entrar o salir. Si tú, el lanzador, sales, el conjuro termina.
      Cualquier ataque o conjuro dirigido a la cúpula debe superar una Esquiva de 9. Si impacta, la cúpula realiza una Tirada de Salvación de Mente
      con tu bonificador (1d8 + Atributo Arcano) contra el daño del ataque. Si la salvación falla, el ataque atraviesa la barrera.
    uses:
      type: LONG_REST
      qty: 1
  - name: Barrera de Fuerza
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 5'
    description: >-
      _Levantas un muro de energía pura e invisible que bloquea el paso de cualquier proyectil o criatura._<br><br>
      Creas una pared plana, delgada e invisible de energía arcana a distancia Cercana. La pared puede tener hasta 15 metros de largo y 5 de alto,
      o puede ser una cúpula de 4m de radio. La barrera es inmune a todo daño físico, pero es destruida automáticamente por efectos mágicos de desintegración
      y puede ser terminada prematuramente por efectos de disipación mágica. Dura hasta 10 minutos.
    uses:
      type: RELOAD
      qty: 6
  - name: Pliegue Espacial
    level: 4
    type: activable
    tags:
