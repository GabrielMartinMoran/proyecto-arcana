      - Concentración
    requirements: 'Paso Brumoso & Atributo Arcano 5'
    description: >-
      _Perforas el tejido de la realidad para conectar dos puntos distantes mediante portales gemelos._<br><br>
      Eliges dos puntos en superficies sólidas que puedas ver a distancia Larga. En cada punto, aparece un portal circular de 3 metros de diámetro.
      Los portales están intrínsecamente conectados; cualquier cosa que entre por uno, sale instantáneamente por el otro. Son una puerta de dos vías
      que permanece abierta mientras te concentres, hasta por 1 minuto.
    uses:
      type: RELOAD
      qty: 6
  - name: Dominio Elemental
    level: 4
    type: efecto
    tags:
      - Arcanista
    requirements: 'Atributo Arcano 5'
    description: >-
      _Has alcanzado una comprensión tan profunda de un elemento que tus conjuros del mismo tipo se vuelven más letales._<br><br>
      Al adquirir esta carta, elige un tipo de daño: Fuego, Frío o Eléctrico. Ganas los siguientes beneficios para conjuros de Arcanista de ese tipo:<br>
      - Puedes volver a tirar cualquier dado de daño que resulte en un 1 (debes usar el nuevo resultado).<br>
      - El ND de tus conjuros que hagan daño de este tipo aumenta en 1.
    uses:
      type: null
      qty: 0

  - name: Sugestión Mayor
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Maledicción & Atributo Arcano 5'
    description: >-
      _Implantas una idea en la mente de un humanoide, forzándolo a seguir tus órdenes como si fueran propias._<br><br>
      Como Acción, eliges a una criatura humanoide a distancia Media. Debe superar una TS de Instinto (ND 5 + Atributo Arcano). Si falla, le das una orden que pueda completar en los próximos 10 minutos (ej: "protege este puente").<br>
      La orden no puede ser obviamente dañina para si mismo. La criatura obedece lo mejor que puede mientras mantengas la concentración.
    uses:
      type: RELOAD
      qty: 6

