      _Creas un sensor místico invisible que actúa como una extensión de tus propios sentidos en la distancia._<br><br>
      Al lanzar el conjuro, elije un punto que puedas ver a distancia Media, donde aparece el sensor. Este esta compuesto de energía y no puede atravesar objetos sólidos. En tus turnos, puedes usar tu Acción para mover el sensor hasta 10 metros. Ves y oyes a través del sensor.
      El sensor es detectable con magia o visión especial. Dura 10 minutos.
    uses:
      type: RELOAD
      qty: 5
  - name: Zona Nula
    level: 2
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 3'
    description: >-
      _Generas un vacío de energía en un área donde el sonido y la luz se extinguen casi por completo._<br><br>
      Eliges un punto a distancia Media, creando una esfera de 5 metros de radio que dura hasta 10 minutos.
      Dentro de la esfera, el sonido se apaga por completo (otorgando inmunidad a daño Sónico y al estado Ensordecido)
      y toda fuente de luz, mágica o no, se reduce a una penumbra tenue.
