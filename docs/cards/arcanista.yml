    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: 'Sugestión Mayor & Atributo Arcano 6'
    description: >-
      _Pronuncias una palabra de poder cargada de una vibración arcana tan intensa que colapsa los sentidos de tu víctima._<br><br>
      Eliges una criatura que puedas ver a distancia Cercana. Si la criatura tiene 100 Puntos de Salud o menos, queda Aturdida. Al final de cada uno de sus turnos, la criatura puede realizar una TS de Instinto (ND 7 + Atributo Arcano) para terminar el efecto.
    uses:
      type: LONG_REST
      qty: 1

  - name: 'Festín Macabro'
    level: 2
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Reacción
    requirements: 'Afinidad Arcana & Atributo Arcano 3'
    description: >-
      _Mientras la vida abandona el cuerpo de una criatura, inhalas violentamente su esencia deshilachada, fortaleciendo tu propia carne._<br><br>
      Como Reacción, cuando una criatura a distancia Cercana es reducida a 0 Puntos de Salud, arrancas parte de su alma antes de que escape.<br>
      Ganas Puntos de Salud temporales igual a 2d6 + tu Atributo Arcano.<br>
      Mientras poseas estos Puntos de Salud temporales, tus ojos brillan con una luz cadavérica y emites un aura de frío antinatural.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Enjambre Parasitario'
    level: 2
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 3'
    description: >-
      _De las mangas de tu túnica brota una nube de insectos cadavéricos y escarabajos necrófagos que envuelven a tu enemigo._<br><br>
      Realizas un ataque de conjuro (1d8e + Atributo Arcano) contra una criatura a distancia Cercana.<br>
      Si impactas, el enjambre se adhiere a ella durante 1 minuto.<br>
      La criatura sufre 1d6 de daño Perforante al inicio de cada uno de sus turnos.<br>
      Además, mientras el enjambre la cubra, la criatura sufre Desventaja (-1d4) en cualquier prueba de habilidad para mantener la Concentración.<br>
      El objetivo u otra criatura a distancia inmediata de este puede usar su Acción para aplastar y disipar el enjambre, terminando el efecto.
    uses:
      type: RELOAD
      qty: 4

  - name: 'Fosa de los Lamentos'
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 4'
    description: >-
      _El suelo se pudre y se vuelve fangoso, vomitando cientos de manos esqueléticas que arrastran a los vivos hacia la tumba._<br><br>
      Eliges un punto a distancia Media, creando un área de terreno difícil en un radio de 3 metros durante 1 minuto.<br>
      Toda criatura que entre en el área o empiece su turno allí debe superar una TS de Reflejos (ND 5 + Atributo Arcano).
      Si falla, recibe 2d6 de daño Necrótico y queda Inmovilizada hasta el inicio de su próximo turno mientras los huesos tiran de ella. Si tiene éxito, recibe la mitad del daño y no queda atrapada.
    uses:
      type: RELOAD
      qty: 5

