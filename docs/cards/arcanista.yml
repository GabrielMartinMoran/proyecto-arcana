      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 4'
    description: >-
      _Exhalas una espesa nube de gas amarillo y verdoso que corroe la carne y nubla los sentidos._<br><br>
      Creas una esfera de 5 metros de radio en un punto a distancia Media.<br>
      El área queda fuertemente oscurecida (bloquea la visión) durante 1 minuto.<br>
      Cualquier criatura que empiece su turno en el interior de la nube debe superar una TS de Cuerpo (ND 5 + Atributo Arcano). Si falla, recibe 3d6 de daño de Ácido o Veneno (a tu elección al lanzar el conjuro) y sufre el estado Envenenado hasta el inicio de su próximo turno. Si tiene éxito, recibe la mitad del daño y no se envenena.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Segador Incorpóreo'
    level: 4
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 5'
    description: >-
      _Desgarras el velo para conjurar a un verdugo espectral envuelto en mortajas, armado con una guadaña de sombra._<br><br>
      Invocas una entidad incorpórea que ocupa un espacio Mediano a distancia Cercana durante 1 minuto.<br>
      El segador es invulnerable, pero no bloquea el paso.<br>
      Cuando lanzas el conjuro, y en cada uno de tus turnos subsiguientes usando tu Interacción, puedes ordenar al Segador que se mueva hasta 10 metros en cualquier dirección y realice un ataque de conjuro cuerpo a cuerpo (1d8e + Atributo Arcano) contra un enemigo a distancia Inmediata a él. Si impacta, inflige 2d8 de daño Necrótico y el objetivo no puede recuperar Puntos de Salud hasta el inicio de tu próximo turno.
    uses:
      type: RELOAD
      qty: 6

  - name: 'Legión de los Condenados'
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: 'Afinidad Arcana & Atributo Arcano 6'
    description: >-
      _Abres las puertas del inframundo por un segundo, liberando una marea de espectros aullantes que arrasan con todo a su paso._<br><br>
      Liberas un cono de 10 metros de espíritus atormentados.<br>
       Las criaturas en el área deben superar una TS de Instinto (ND 5 + Atributo Arcano). Si fallan, reciben 6d6 de daño Necrótico y quedan Asustadas y Ensordecidas hasta el final de tu próximo turno. Si tienen éxito, reciben la mitad del daño y no sufren efectos adicionales.
    uses:
      type: RELOAD
      qty: 8

  - name: 'Forma Gaseosa'
    level: 3
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 4'
    description: >-
      _Tu cuerpo pierde su consistencia y se dispersa en una nube de gas tenue que fluye por lugares donde la carne jamás podría pasar._<br><br>
      Como Acción, transformas tu cuerpo y todo el equipo que lleves en una forma gaseosa durante un máximo de 10 minutos o hasta que pierdas la Concentración.<br>
      Mientras permanezcas en esta forma:<br>
      - Puedes volar a una velocidad igual a la mitad de tu Velocidad normal.<br>
      - Puedes atravesar cualquier abertura por la que pudiera pasar humo o aire, aunque no puedes atravesar superficies completamente selladas.<br>
      - No puedes atacar, lanzar conjuros, activar habilidades, manipular objetos ni utilizar equipamiento.<br>
      - No puedes ser Inmovilizado o Enredado mediante ataduras, presas u obstáculos puramente físicos.
    uses:
      type: RELOAD
      qty: 6

  - name: 'Anclaje Arcano'
    level: 2
    type: activable
    tags:
      - Arcanista
      - Conjuro
      - Concentración
    requirements: 'Afinidad Arcana & Atributo Arcano 3'
    description: >-
      _Inscribes una coordenada invisible sobre la realidad y obligas a la materia a permanecer exactamente donde se encuentra._<br><br>
      Como Acción, eliges un objeto no mágico que puedas tocar, o una parte móvil de una estructura como una puerta, ventana, compuerta o mecanismo. El objetivo no puede pesar más de 50 kg por cada punto de tu Atributo Arcano.<br>
      Durante 10 minutos o hasta que pierdas la Concentración, el objeto queda mágicamente fijado a su posición y orientación actuales.<br>
      Una criatura que intente mover, abrir, cerrar o desplazar el objetivo debe usar su Acción y superar una Prueba de Cuerpo (ND 5 + Atributo Arcano). Si tiene éxito, rompe el anclaje y el conjuro termina.<br>
      El objeto todavía puede ser destruido normalmente, y destruirlo también termina el efecto.<br>
      No puedes utilizar este conjuro sobre una criatura ni sobre un objeto que una criatura lleve puesto o sostenga.
    uses:
      type: RELOAD
      qty: 5

  - name: 'Lluvia de Meteoritos'
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: 'Afinidad Arcana & Atributo Arcano 6'
    description: >-
      _Desgarras el cielo y haces caer fragmentos incandescentes que impactan la tierra con una violencia catastrófica._<br><br>
      Como Acción, eliges hasta tres puntos que puedas ver a distancia Larga. Un meteorito impacta en cada uno, provocando una explosión de 3 metros de radio.<br>
      Toda criatura alcanzada debe realizar una TS de Reflejos (ND 5 + Atributo Arcano). Si falla, recibe 4d6 de daño Contundente y 4d6 de daño de Fuego. Si tiene éxito, recibe la mitad del daño total.<br>
      Las áreas de impacto pueden superponerse, pero una criatura solo puede recibir el daño de esta carta una vez por lanzamiento.<br>
      Los impactos incendian materiales fácilmente inflamables y pueden destruir objetos y estructuras vulnerables a discreción del DJ.
    uses:
      type: RELOAD
      qty: 8

  - name: 'Palabra de Poder: Matar'
    level: 5
    type: activable
    tags:
      - Arcanista
      - Conjuro
    requirements: 'Afinidad Arcana & Atributo Arcano 6'
    description: >-
      _Pronuncias una palabra primordial cuyo significado no describe la muerte: la ordena._<br><br>
      Como Acción, eliges una criatura que puedas ver a distancia Cercana. Si posee 50 Puntos de Salud o menos, muere inmediatamente.<br>
      Si posee más de 60 Puntos de Salud, la palabra no tiene efecto.<br>
      Este efecto no inflige daño y, por lo tanto, no puede ser reducido mediante Mitigación, Resistencias u otros efectos que reduzcan daño.
    uses:
      type: LONG_REST
      qty: 1
