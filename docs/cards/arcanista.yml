    requirements: 'Afinidad Arcana & Atributo Arcano 5'
    description: >-
      _Fuerzas los límites de tu poder para saturar tus conjuros más simples con una potencia devastadora._<br><br>
      Tu dominio de la magia te permite saturar los conjuros simples con un poder devastador.<br>
      Cuando lanzas una carta con las etiquetas _Arcanista_ y _Conjuro_ de Nivel 1 o 2 que inflija daño, puedes usar tu Interacción para sobrecargar el lanzamiento. Si lo haces, duplicas la cantidad de dados de daño del conjuro.
    uses:
      type: RELOAD
      qty: 6

