    actions:
      - name: Aliento de Fuego
        uses:
          type: RELOAD
          qty: 6
        detail: El dragón exhala un cono de fuego de 15 metros. Toda criatura en el área debe superar una Tirada de Salvación de Reflejos (ND 16). Si falla, recibe 10d6 de daño de Fuego (35 Dmg AoE); si tiene éxito, recibe la mitad.
      - name: Presencia Aterradora
        uses:
          type: USES
          qty: 1
        detail: El dragón ruge. Todo enemigo a distancia Larga que pueda verlo u oírlo debe superar una TS de Instinto (ND 16) o quedar Asustado durante 1 minuto (Desventaja en todo). El objetivo puede repetir la Tirada de Salvación al final de cada uno de sus turnos. El estado Asustado termina para ese objetivo cuando supera la tirada.
    reactions:
      - name: Coletazo
        detail: Como Reacción cuando un enemigo termina su movimiento adyacente, el dragón golpea con la cola. TS Cuerpo (ND 16) o 2d8 Contundente y Derribado.
    interactions: []
    behavior: Un ser de arrogancia y poder elemental. Utilizará su vuelo para evaluar las amenazas, desatando su Aliento de Fuego sobre el grupo más concentrado. Aterrizará solo para eliminar a supervivientes heridos, usando su Asalto Múltiple para abrumar. Su Presencia Aterradora rompe la coordinación del grupo al inicio.
    img: null
