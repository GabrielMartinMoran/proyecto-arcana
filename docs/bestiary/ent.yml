        note: Como Acción alternativa, afecta un cono de distancia Inmediata. Cada objetivo debe superar una Tirada de Salvación de Reflejos (ND 12) o recibir el daño completo; con éxito, recibe la mitad. No puede usar Puño de Corteza en la misma Acción.
    traits:
      - name: Habilidades con Ventaja
        detail: Naturaleza, Percepción, Supervivencia
    actions:
      - name: La Arboleda se Alza
        uses:
          type: RELOAD
          qty: 6
        detail: El ent despierta raíces en un área de distancia Cercana centrada en un punto visible a distancia Media. Las criaturas dentro deben superar una Tirada de Salvación de Reflejos (ND 12). Si fallan, quedan Inmovilizadas hasta el final del siguiente turno del ent. Cada criatura que haya quedado Inmovilizada puede repetir la Tirada de Salvación al final de su propio turno. Las raíces son visibles y el área siempre deja al menos una ruta razonable de salida.
    reactions:
      - name: Corteza Reactiva
        detail: Cuando una criatura inflige daño al ent con un ataque cuerpo a cuerpo, esa criatura debe superar una Tirada de Salvación de Cuerpo (ND 12) o quedar Derribada. Solo puede usar esta Reacción una vez por ronda.
    interactions: []
    behavior: |
      Una frontera forestal móvil que reconfigura objetivos, rutas y cobertura. Expulsa, separa y bloquea accesos antes de buscar matar. Si el objetivo del grupo no amenaza al bosque, prefiere negociar.
    img: null
